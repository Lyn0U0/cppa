<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>一束花💐 管理後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #4A403A; --muted: #8A7E76; --line: #E6DFD5; --paper: #FAF6EE; --card: #FFFFFF; --accent: #E0876A; --on: #6E9C78; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: Inter, "Noto Sans TC", "PingFang TC", sans-serif; color: var(--ink); background: var(--paper); -webkit-tap-highlight-color: transparent; }
  .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px 22px 22px;
    box-shadow: 0 18px 40px -26px rgba(74,64,58,.45); }
  .hide { display: none !important; }
  h1 { margin: 0; font-size: 19px; font-weight: 700; text-align: center; letter-spacing: .02em; }
  .sub { margin: 6px 0 22px; text-align: center; font-size: 12.5px; color: var(--muted); }
  label.field { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type=password] { width: 100%; height: 44px; border-radius: 12px; border: 1px solid #DAD3C8; background: #FFFCF7; padding: 0 14px;
    font: inherit; font-size: 15px; color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s; }
  input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,135,106,.18); }
  .btn { width: 100%; height: 44px; margin-top: 14px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: inherit; font-size: 14.5px;
    font-weight: 500; cursor: pointer; transition: transform .15s, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .msg { min-height: 18px; margin-top: 10px; font-size: 12.5px; text-align: center; color: #C0563F; }
  .msg.ok { color: var(--on); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .row { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .ico { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
  .row .ico.hw { background: #FFF1E4; border: 1.5px solid #E8B48A; }
  .row .ico.pr { border: 1.5px solid transparent; background-image: linear-gradient(#fff, #fff), linear-gradient(90deg, #E46A6A, #F09A55, #F2CF55, #74B874, #5F92D8, #9C72C8);
    background-origin: border-box; background-clip: padding-box, border-box; }
  .row .txt { flex: 1; min-width: 0; }
  .row .name { font-size: 14.5px; font-weight: 600; }
  .row .state { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; border: 0; border-radius: 999px; background: #D9D3C9; cursor: pointer; transition: background .25s; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 999px; background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
  .switch[aria-checked=true] { background: var(--on); }
  .switch[aria-checked=true]::after { transform: translateX(22px); }
  .switch[disabled] { opacity: .6; cursor: default; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .foot a, .foot button { color: var(--muted); background: none; border: 0; font: inherit; cursor: pointer; text-decoration: none; padding: 0; transition: color .2s; }
  .foot a:hover, .foot button:hover { color: var(--accent); }
  .setup { font-size: 12.5px; line-height: 1.7; color: var(--muted); background: #FBF4EA; border-radius: 12px; padding: 12px 14px; }
</style>
</head>
<body>
<main class="card">
  <!-- 尚未設定 Firebase 登入 -->
  <section id="setup" class="hide">
    <h1>🔐 管理後台</h1>
    <p class="sub">尚未完成設定</p>
    <div class="setup">請在 <code>admin.html</code> 最上方的設定填入 Firebase 的 Web API 金鑰與管理者 Email，後台才能登入。</div>
  </section>

  <!-- 登入畫面 -->
  <section id="login" class="hide">
    <h1>🔐 管理者登入</h1>
    <p class="sub">一束花💐 限時主題控制台</p>
    <form id="loginForm" autocomplete="on">
      <input type="text" name="username" autocomplete="username" class="hide" tabindex="-1" aria-hidden="true" />
      <label class="field" for="pw">管理者密碼</label>
      <input id="pw" type="password" autocomplete="current-password" required />
      <button id="loginBtn" class="btn" type="submit">登入</button>
      <div id="loginMsg" class="msg" role="alert"></div>
    </form>
  </section>

  <!-- 控制台 -->
  <section id="panel" class="hide">
    <h1>🌷 限時主題控制台</h1>
    <p class="sub">切換後所有訪客的前台會一起套用</p>
    <div class="row">
      <div class="ico hw">🎃</div>
      <div class="txt"><div class="name">萬聖節限時主題</div><div class="state" id="st-halloween">讀取中…</div></div>
      <button class="switch" role="switch" aria-checked="false" aria-label="萬聖節限時主題" data-key="halloween" disabled></button>
    </div>
    <div class="row">
      <div class="ico pr">🏳️‍🌈</div>
      <div class="txt"><div class="name">彩虹驕傲主題</div><div class="state" id="st-pride">讀取中…</div></div>
      <button class="switch" role="switch" aria-checked="false" aria-label="彩虹驕傲主題" data-key="pride" disabled></button>
    </div>
    <div id="panelMsg" class="msg" role="status"></div>
    <div class="foot">
      <a href="../" target="_blank" rel="noopener">查看前台 ↗</a>
      <button id="logout" type="button">登出</button>
    </div>
  </section>
</main>

<script>
(() => {
  /* ---------- 設定（可自行修改） ----------
     密碼不寫在程式裡：管理者帳號建立在 Firebase Authentication（Email／密碼），
     要改密碼請到 Firebase 後台修改。這裡只需要填 Web API 金鑰（公開資訊）與管理者 Email。 */
  const FIREBASE_API_KEY = '';
  const ADMIN_EMAIL = '';
  const DB = 'https://happybouquet-b640e-default-rtdb.firebaseio.com';
  const CFG_PATH = '/config/festivals';
  const SESSION_KEY = 'bouquetAdmin';      // 登入狀態（關閉分頁即登出）
  const CACHE_KEY = 'bouquet.festivals';   // 同一台裝置的前台立即套用

  const $ = s => document.querySelector(s);
  const show = id => ['setup', 'login', 'panel'].forEach(k => $('#' + k).classList.toggle('hide', k !== id));
  const NAMES = { halloween: '萬聖節', pride: '彩虹驕傲' };

  let session = null;
  try { session = JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch {}
  const saveSession = s => { session = s; try { s ? sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)) : sessionStorage.removeItem(SESSION_KEY); } catch {} };

  async function signIn(password) {
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: ADMIN_EMAIL, password, returnSecureToken: true })
    });
    const d = await r.json();
    if (!r.ok) throw d.error?.message || 'LOGIN_FAILED';
    saveSession({ isAdminLoggedIn: true, idToken: d.idToken, refreshToken: d.refreshToken, exp: Date.now() + (Number(d.expiresIn) - 60) * 1000 });
  }
  // 登入憑證一小時到期，到期前自動換新
  async function token() {
    if (session.exp > Date.now()) return session.idToken;
    const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}`, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(session.refreshToken)}`
    });
    const d = await r.json();
    if (!r.ok) { saveSession(null); show('login'); throw 'EXPIRED'; }
    saveSession({ ...session, idToken: d.id_token, refreshToken: d.refresh_token, exp: Date.now() + (Number(d.expires_in) - 60) * 1000 });
    return session.idToken;
  }

  let cfg = { halloween: false, pride: false };
  function render() {
    document.querySelectorAll('.switch').forEach(b => {
      const on = !!cfg[b.dataset.key];
      b.setAttribute('aria-checked', on); b.disabled = false;
      $('#st-' + b.dataset.key).textContent = on ? '開啟中・前台顯示' : '已關閉・前台隱藏';
    });
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cfg)); } catch {}
  }
  async function loadPanel() {
    show('panel');
    try {
      const r = await fetch(DB + CFG_PATH + '.json', { cache: 'no-store' });
      const v = r.ok ? await r.json() : null;
      cfg = { halloween: !!v?.halloween, pride: !!v?.pride };
      render();
    } catch { $('#panelMsg').textContent = '讀取設定失敗，請檢查網路後重新整理'; }
  }

  document.querySelectorAll('.switch').forEach(b => b.addEventListener('click', async () => {
    const key = b.dataset.key, next = !cfg[key], msg = $('#panelMsg');
    b.disabled = true; msg.className = 'msg'; msg.textContent = '儲存中…';
    try {
      const r = await fetch(`${DB}${CFG_PATH}/${key}.json?auth=${await token()}`, { method: 'PUT', body: JSON.stringify(next) });
      if (!r.ok) throw r.status;
      cfg[key] = next; render();
      msg.className = 'msg ok'; msg.textContent = `✓ ${NAMES[key]}主題已${next ? '開啟' : '關閉'}`;
    } catch (e) {
      b.disabled = false;
      msg.textContent = e === 401 || e === 403 ? '沒有寫入權限，請確認 Firebase 規則已設定管理者 UID' : e === 'EXPIRED' ? '登入已過期，請重新登入' : '儲存失敗，請再試一次';
    }
  }));

  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#loginBtn'), msg = $('#loginMsg'), pw = $('#pw');
    btn.disabled = true; btn.textContent = '登入中…'; msg.textContent = '';
    try { await signIn(pw.value); pw.value = ''; loadPanel(); }
    catch (err) {
      msg.textContent = /PASSWORD|CREDENTIAL|EMAIL_NOT_FOUND/.test(err) ? '密碼不正確' : /TOO_MANY/.test(err) ? '嘗試次數過多，請稍後再試' : '登入失敗，請檢查網路';
      $('#loginForm').classList.remove('shake'); void $('#loginForm').offsetWidth; $('#loginForm').classList.add('shake');
    }
    btn.disabled = false; btn.textContent = '登入';
  });
  $('#logout').onclick = () => { saveSession(null); show('login'); $('#pw').focus(); };

  $('[name=username]').value = ADMIN_EMAIL;
  if (!FIREBASE_API_KEY || !ADMIN_EMAIL) show('setup');
  else if (session?.isAdminLoggedIn) loadPanel();
  else { show('login'); $('#pw').focus(); }
})();
</script>
</body>
</html>
