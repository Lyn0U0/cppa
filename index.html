<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>花語包花室</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#333333',
          paper: '#F5F5F0',
          milk: { DEFAULT: '#55554F', light: '#DCDCD5', deep: '#6B6B63' },
          sage: { DEFAULT: '#9CAF88', dark: '#7D9471', light: '#DCE5D2' },
        },
        fontFamily: { ui: ['Inter', '"Helvetica Neue"', 'Helvetica', '"Noto Sans TC"', '"PingFang TC"', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100dvh; padding: 16px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-family: Inter, "Helvetica Neue", Helvetica, "Noto Sans TC", "PingFang TC", sans-serif; color: #333;
    background: #E0E0E0;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  /* 純淨平面底色（不使用紙紋） */
  .paper-tex { background: #FAF6EE; } /* 奶油白底 */
  .phone {
    position: relative; overflow: hidden; display: flex; flex-direction: column;
    width: 390px; height: min(844px, calc(100dvh - 32px));
    border-radius: 44px; border: 9px solid #2B2B2B;
    box-shadow: 0 24px 50px -24px rgba(0, 0, 0, .35);
  }
  @media (max-width: 480px) {
    body { padding: 0; }
    .phone { width: 100vw; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
  }

  /* ---------- 畫布與圖層 ---------- */
  .canvas-wrap { touch-action: none; }
  .stage { position: absolute; left: 50%; top: 50%; width: 360px; height: 480px; transform-origin: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  .layer { position: absolute; inset: 0; }
  .layer > svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .layer-back, .layer-tissue, .layer-front, .layer-ribbon, .layer-flowers { pointer-events: none; }
  .layer-front { transform-origin: 180px 340px; } /* 左右側翼以收腰中心為軸 */
  .layer-back { z-index: 1; } .layer-tissue { z-index: 2; } .layer-flowers { z-index: 3; } .layer-front { z-index: 4; }
  .layer-ribbon { z-index: 5; } .layer-card { z-index: 6; pointer-events: none; }
  .layer-card.tucked { z-index: 3; } /* 插地標籤：與花材同層、在後面插入，前包裝紙（4）與緞帶（5）蓋住木棒下半段 */ .sel-layer { z-index: 9; pointer-events: none; }
  /* 🦇 萬聖節裝飾貼紙：在所有圖層最上面，可自由拖曳、旋轉、縮放 */
  .layer-deco { z-index: 8; pointer-events: none; }
  .stage.is3d .layer-deco { transform: translateZ(22px); }
  .deco { position: absolute; pointer-events: auto; cursor: grab; touch-action: none; transform-origin: center; }
  .deco > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .deco-ui { position: absolute; inset: 0; pointer-events: none; }
  .deco-frame { position: absolute; inset: -6px; border: 1.4px dashed #C9682A; border-radius: 10px; }
  .deco-btn { position: absolute; width: 26px; height: 26px; border-radius: 999px; background: #fff; border: 1px solid #C9682A; color: #C9682A;
    display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; pointer-events: auto; touch-action: none; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .deco-btn::after { content: ""; position: absolute; inset: -9px; }
  .deco-rot { right: -19px; bottom: -19px; cursor: grab; }
  .deco-del { right: -19px; top: -19px; }
  .deco-card { border-radius: 14px; border: 1px solid #E8D9C8; background: #FFFCF7; transition: transform .15s, border-color .2s; }
  .deco-card:active { transform: scale(.94); }
  .stage.xray .layer-front { opacity: .4; }

  /* ---------- 微景深（圖鑑排列為主，只保留極輕微的前後層次） ---------- */
  .canvas-wrap, .pv-3d { perspective: 1400px; }
  .layer { transition: transform .5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity .25s ease; }
  .z-anim .flower { transition: transform .5s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .stage.is3d, .stage.is3d-out, .stage.is3d .layer-flowers, .stage.is3d-out .layer-flowers { transform-style: preserve-3d; }
  .stage.is3d .layer-back   { transform: translateZ(-12px); }
  .stage.is3d .layer-tissue { transform: translateZ(-6px); }
  .stage.is3d .layer-front  { transform: translateZ(9px); }
  .stage.is3d .layer-ribbon { transform: translateZ(13px); }
  .stage.is3d .layer-card   { transform: translateZ(18px); }
  .stage.is3d .layer-card.tucked { transform: translateZ(7px); }
  .stage.is3d .layer-front > svg, .stage.is3d .card-el svg { filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .08)); }

  /* 編輯 / 3D 切換膠囊 */
  .mode-ui .seg { display: flex; padding: 3px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CFCFC8; position: relative; }
  .mode-ui .seg button { position: relative; z-index: 1; padding: 5px 10px; border-radius: 999px; font-size: 12px; line-height: 1.2; color: #666; transition: color .25s; white-space: nowrap; }
  .mode-ui .seg button.on { color: #fff; }
  .mode-ui .seg .thumb { position: absolute; top: 3px; bottom: 3px; border-radius: 999px; background: #55554F;
    transition: left .35s cubic-bezier(.3,1.3,.5,1), width .35s cubic-bezier(.3,1.3,.5,1); }
  .tilt-hint { transition: opacity .4s; }
  .tilt-hint.hide { opacity: 0; }

  /* ---------- 🔮 今日幸運花束 ---------- */
  .lucky-btn { color: #333; font-weight: 500; background: #FFFFFF; border: 1px solid #555; }
  .lucky-btn:active { transform: scale(.95); }
  .lucky-btn[disabled] { opacity: .7; }
  .magic { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .magic .glow { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 999px;
    border: 1px solid #555; background: rgba(255,255,255,.55); animation: glow .75s ease-out forwards; }
  .magic .bp { position: absolute; left: 50%; top: 50%; animation: burst .7s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: var(--dl); opacity: 0; }
  @keyframes glow { 0% { transform: scale(.3); opacity: 0; } 35% { opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes burst { 0% { transform: translate(-50%, -50%) scale(.3) rotate(0deg); opacity: 0; } 15% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity: 0; } }
  .poof { animation: poof .45s ease-in forwards; transform-origin: 50% 100%; }
  @keyframes poof { to { transform: scale(.5) rotate(12deg); opacity: 0; } }
  .fortune { transition: opacity .45s ease, transform .5s cubic-bezier(.3,1.3,.5,1); }
  .fortune.hide { opacity: 0; transform: translateY(-10px) scale(.97); pointer-events: none; }
  .fortune-box { background: #F4F4EF; border: 1px solid #DADAD3; }
  @media (prefers-reduced-motion: reduce) { .magic .bp, .magic .glow { animation: none; opacity: 0; } }

  .flower { position: absolute; transform-origin: 50% 100%; pointer-events: none; will-change: transform; }
  .flower svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .flower svg * { pointer-events: visiblePainted; cursor: grab; }
  .flower.is-sel svg { filter: drop-shadow(0 0 0.5px #555); }
  .flip { width: 100%; height: 100%; transform-origin: 50% 100%; }
  .flip.on { transform: scaleX(-1); }
  .pop { width: 100%; height: 100%; transform-origin: 50% 100%; animation: pop .55s cubic-bezier(.3, 1.5, .5, 1) both; }
  @keyframes pop { from { transform: scale(.35) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .animate .flower { transition: left .6s cubic-bezier(.3,1.25,.5,1), top .6s cubic-bezier(.3,1.25,.5,1), transform .6s cubic-bezier(.3,1.25,.5,1); }
  .animate .flip { transition: transform .6s ease; }

  /* 選取：從花莖底部（支點）拉一條虛線到花頭上方的把手 */
  .sel-box { position: absolute; transform-origin: 50% 100%; pointer-events: none; display: none; }
  .sel-guide { position: absolute; left: 50%; bottom: 0; border-left: 1px dashed #555; opacity: .7; }
  .sel-pivot { position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; margin-left: -4px; border-radius: 999px; background: #fff; border: 1px solid #555; }
  .sel-handle { position: absolute; left: 50%; width: 30px; height: 30px; margin-left: -15px; border-radius: 999px;
    background: #fff; border: 1px solid #555; box-shadow: 0 2px 6px rgba(0,0,0,.12);
    display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; cursor: grab; }
  .sel-handle::after { content: ""; position: absolute; inset: -10px; } /* 放大觸控範圍 */

  /* ---------- 小卡（可拖曳） ---------- */
  .card-el { position: absolute; pointer-events: auto; cursor: grab; touch-action: none; transform-origin: 50% 0; }
  .card-el.dragging { cursor: grabbing; }
  .card-el > svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .ct { position: absolute; display: flex; flex-direction: column; justify-content: space-between; color: #333; overflow: hidden; pointer-events: none;
    font-family: Inter, "Helvetica Neue", Helvetica, "Noto Sans TC", sans-serif; }
  .ct-to, .ct-from { font-size: 6.8px; line-height: 1.25; letter-spacing: .04em; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ct-from { text-align: right; }
  .ct-msg { font-size: 8.6px; line-height: 1.38; font-weight: 500; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 3); overflow: hidden; }
  .fld { display: flex; align-items: center; gap: 6px; border-radius: 10px; border: 1px solid #D5D5CE; background: #FFFFFF; padding: 0 10px; }
  .fld > span { font-size: 10.5px; letter-spacing: .04em; color: #888; white-space: nowrap; }
  .fld input, .fld textarea { flex: 1; min-width: 0; background: transparent; outline: none; font-size: 13.5px; padding: 6px 0; resize: none; }
  .fld:focus-within { border-color: #555; }

  /* ---------- 空間背景與窗邊光影 ---------- */
  .scene { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; transition: background .5s; }
  .gobo { position: absolute; inset: -36px; z-index: 20; pointer-events: none; }
  .gobo > * { position: absolute; inset: 0; }
  .dotty { position: absolute; width: 3px; height: 3px; border-radius: 999px; background: #E8E4D6; opacity: .55; }
  .scene-dark .empty-hint { color: rgba(255, 248, 235, .7); }

  /* ---------- 工作台 ---------- */
  .workspace { transition: transform .45s cubic-bezier(.4,0,.2,1), opacity .35s; }
  .finished .workspace { transform: translateY(105%); opacity: 0; pointer-events: none; }
  .finished .toolbar, .finished .sel-box { display: none !important; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  .mat-card { transition: transform .15s, box-shadow .2s, border-color .2s; }
  .mat-card:active { transform: scale(.95); }
  .mini-dot { width: 7px; height: 7px; border-radius: 999px; border: 1px solid #555; }
  .mat-card.is-active { border-color: #555 !important; }

  /* 色票列 */
  .swatch-bar { background: #EDEDE8; }
  .sw { width: 24px; height: 24px; border-radius: 999px; border: 1px solid #555; flex-shrink: 0; transition: transform .15s; }
  .sw.sm { width: 20px; height: 20px; }
  .sw.on { box-shadow: 0 0 0 2px #EDEDE8, 0 0 0 3px #555; }
  .sw:active { transform: scale(.9); }

  /* 季節限定卡片 */
  .seasonal { border-color: #555 !important; background: #FFFFFF !important; }
  .badge { font-size: 8px; line-height: 1; padding: 3px 5px; border-radius: 3px; white-space: nowrap; letter-spacing: .08em;
    background: #333; color: #F5F5F0; }
  .stamp { display: inline-block; font-size: 8.5px; letter-spacing: .12em; font-weight: 600; color: #555; border: 1px solid #555;
    border-radius: 3px; padding: 0 4px; line-height: 1.6; vertical-align: 1px; margin-left: 6px; }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

  .toolbar { transition: opacity .2s, transform .25s cubic-bezier(.3,1.4,.5,1); }
  .toolbar.hide { opacity: 0; transform: translate(-50%, 16px) scale(.95); pointer-events: none; }

  /* ---------- 收據 ---------- */
  .modal { transition: opacity .3s; }
  .modal.hide { opacity: 0; pointer-events: none; }
  .modal .sheet { transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
  .modal.hide .sheet { transform: translateY(40px) scale(.96); }
  .order { background: #FFFFFF; border: 1px solid #D5D5CE; }
  .order h4 { font-size: 10px; letter-spacing: .18em; color: #888; font-weight: 500; margin: 0 0 6px; }
  .order .sec { padding: 14px 20px; border-top: 1px solid #ECECE6; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; font-size: 18px; line-height: 1; transition: transform .15s; }
  .act span { font-size: 12.5px; }
  .act:active { transform: scale(.95); }
  .act[disabled] { opacity: .6; }
  .order-detail summary::-webkit-details-marker { display: none; }
  .order-detail summary::before { content: "＋ "; }
  .order-detail[open] summary::before { content: "－ "; }
  .sfx-btn { border-radius: 999px; border: 1px solid #CFCFC8; background: #fff; padding: 4px 10px; font-size: 11.5px; color: #4A403A; transition: transform .15s, background .2s; }
  .sfx-btn:active { transform: scale(.94); }
  .sfx-btn.off { background: #EDEDE8; color: #888; }
  /* 音樂按鈕：播放中顯示跳動音量條 */
  .music-btn { position: relative; color: #4A403A; }
  .music-btn .eq { display: none; position: absolute; right: -3px; top: -3px; gap: 1px; align-items: flex-end; height: 10px; padding: 1px 2px; border-radius: 6px; background: #4A403A; }
  .music-btn.on { background: #4A403A; color: #fff; border-color: #4A403A; }
  .music-btn.on .eq { display: flex; background: #9CAF88; }
  .music-btn .eq i { display: block; width: 2px; background: #fff; animation: eq 1s ease-in-out infinite; }
  .music-btn .eq i:nth-child(2) { animation-delay: -.3s; } .music-btn .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 8px; } }
  /* 特效：加花時的花粉光點、完成時落下的花瓣 */
  .fx-spark { position: absolute; pointer-events: none; z-index: 40; animation: burst .75s cubic-bezier(.2,.8,.3,1) forwards; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti i { position: absolute; top: -20px; display: block; animation: drop var(--d) cubic-bezier(.3,.1,.6,1) var(--dl) forwards; opacity: 0; }
  @keyframes drop { 0% { opacity: 0; transform: translate(0, 0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--sx), 900px) rotate(var(--r)); } }
  @media (prefers-reduced-motion: reduce) { .fx-spark, .confetti, .music-btn .eq i { animation: none; display: none; } }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .toast { transition: opacity .25s, transform .25s; }
  .toast.hide { opacity: 0; transform: translate(-50%, -8px); }
</style>
</head>
<body>

<!-- 共用 SVG 定義：內襯印刷紋樣 -->
<svg id="globalDefs" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 英文報紙段落 -->
    <pattern id="news" width="64" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <path d="M2 3 H19 M22 3 H30 M33 3 H48 M51 3 H62 M2 7 H11 M14 7 H32 M35 7 H43 M46 7 H62" stroke="#4A403A" stroke-opacity=".3" stroke-width="1.1" stroke-linecap="round" />
    </pattern>
    <!-- 網紗網格 -->
    <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0 L5 5 M5 0 L0 5" stroke="#4A403A" stroke-opacity=".16" stroke-width=".5" />
    </pattern>
    <pattern id="fiber" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M2 5 q4 -3 8 0 M12 16 q3 2 7 -1 M4 18 q2 -2 3 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1" />
    </pattern>
  </defs>
</svg>

<div id="app" class="phone paper-tex font-ui">

  <!-- 1. 頂部列 8% -->
  <header class="h-[8%] shrink-0 flex items-center justify-between px-4 pt-1 relative z-20">
    <div class="flex gap-2">
      <button id="btnClear" class="flex items-center gap-1 rounded-full border border-[#CFCFC8] bg-white px-3 py-1.5 text-[12.5px] active:scale-95 transition">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>清空
      </button>
      <button id="btnShuffle" class="flex items-center gap-1 rounded-full border border-[#CFCFC8] bg-white px-3 py-1.5 text-[12.5px] active:scale-95 transition">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>隨機重排
      </button>
    </div>
    <div class="flex items-center gap-2">
    <button id="btnMusic" class="music-btn w-9 h-9 rounded-full border border-[#CFCFC8] bg-white flex items-center justify-center active:scale-95 transition" aria-pressed="false" title="背景音樂與音效">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <button id="btnDone" class="rounded-full bg-[#333] text-white px-4 py-2 text-[13.5px] font-medium active:scale-95 transition">完成包裝</button>
    </div>
  </header>

  <!-- 2. 中央畫布 57% -->
  <main id="canvasWrap" class="canvas-wrap h-[57%] shrink-0 relative overflow-hidden">
    <div id="scene" class="scene"></div>
    <div id="stage" class="stage">
      <div class="layer layer-back" id="layerBack"></div>
      <div class="layer layer-tissue" id="layerTissue"></div>
      <div class="layer layer-flowers" id="layerFlowers"></div>
      <div class="layer layer-front fold-l" id="foldL"></div>
      <div class="layer layer-front fold-r" id="foldR"></div>
      <div class="layer layer-ribbon" id="layerRibbon"></div>
      <div class="layer layer-card" id="layerCard"></div>
      <div class="layer layer-deco" id="layerDeco"></div>
      <div class="layer sel-layer">
        <div id="selBox" class="sel-box">
          <div id="selGuide" class="sel-guide"></div>
          <div class="sel-pivot"></div>
          <div id="handle" class="sel-handle" title="拖曳把手：以綁點為圓心調整角度">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a8 8 0 0 1 16 0"/><path d="M4 9v5h5M20 9v5h-5"/></svg>
          </div>
        </div>
      </div>
      <div class="empty-hint absolute left-0 right-0 top-[118px] text-center text-[13.5px] text-[#888] pointer-events-none z-[5] leading-relaxed" id="emptyHint">
        點選下方花材<br/>花朵會自動排成對稱的倒三角花束
      </div>
    </div>

    <div id="gobo" class="gobo" aria-hidden="true"></div>

    <!-- 🔮 今日幸運花束 -->
    <button id="btnLucky" class="lucky-btn absolute top-2 left-3 z-30 rounded-full px-3 py-[7px] text-[12px] leading-tight transition">✦ 今日幸運花束</button>
    <div id="fortune" class="fortune hide absolute left-3 right-3 top-[48px] z-[35] rounded-xl bg-white border border-[#D5D5CE] px-3 py-2" role="status" aria-live="polite">
      <div class="flex items-center gap-2">
        <div class="min-w-0 flex-1">
          <div class="text-[9.5px] tracking-[.18em] text-[#888] leading-tight">TODAY'S FORTUNE · 今日花籤</div>
          <div id="fortuneTitle" class="text-[13px] font-bold leading-tight mt-0.5 truncate"></div>
        </div>
        <button id="fortuneToCard" class="shrink-0 rounded-full border border-[#555] px-2.5 py-1 text-[11px] active:scale-95 transition">編輯小卡</button>
        <button id="fortuneClose" class="shrink-0 w-6 h-6 rounded-full text-ink/50 text-[16px] leading-none" aria-label="關閉花籤">×</button>
      </div>
      <p id="fortuneText" class="text-[11.5px] leading-[1.55] text-ink/80 mt-1"></p>
    </div>

    <!-- 編輯 / 3D 預覽切換 -->
    <div class="mode-ui absolute top-2 right-3 z-30 flex flex-row-reverse items-center gap-1.5 pointer-events-none">
      <div class="seg pointer-events-auto" id="modeSeg" role="tablist" aria-label="檢視模式">
        <span class="thumb" id="modeThumb"></span>
        <button data-mode="edit" class="on" role="tab">平面</button>
        <button data-mode="3d" role="tab">微景深</button>
      </div>
      <button id="btnSfx" class="sfx-btn pointer-events-auto" aria-pressed="true" title="互動音效">🔊 音效開啟</button>
    </div>
    <div id="tiltHint" class="tilt-hint hide absolute left-1/2 -translate-x-1/2 bottom-3 z-30 rounded-full bg-white border border-[#D5D5CE] px-3 py-1.5 text-[11.5px] text-[#666] pointer-events-none whitespace-nowrap">
      拖曳可微微轉動視角
    </div>

    <!-- 懸浮微調工具列 -->
    <div id="toolbar" class="toolbar hide absolute left-1/2 -translate-x-1/2 bottom-3 z-30 flex items-center gap-0.5 rounded-full bg-white px-2 py-1.5 border border-[#CFCFC8]">
      <button data-tool="fwd" class="tb">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>往前</span></button>
      <button data-tool="back" class="tb">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span>往後</span></button>
      <button data-tool="flip" class="tb">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M8 7 3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg><span>翻轉</span></button>
      <button data-tool="dup" class="tb">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>複製</span></button>
      <button data-tool="del" class="tb text-[#B4535E]">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span>刪除</span></button>
    </div>
    <style>
      .tb { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; line-height: 1; transition: background .15s, transform .15s; }
      .tb:active { transform: scale(.9); background: #EDEDE8; }
      .tb svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </main>

  <!-- 3. 底部花藝工作台 35% -->
  <section id="workspace" class="workspace h-[35%] shrink-0 relative z-20 flex flex-col rounded-t-[24px] bg-[#EDEDE8] border-t border-[#DADAD3]">
    <div class="mx-auto mt-2 h-1 w-10 rounded-full bg-ink/15"></div>
    <nav id="tabs" class="no-scrollbar flex gap-1.5 overflow-x-auto px-3 pt-2 pb-1.5 shrink-0"></nav>
    <div id="panel" class="no-scrollbar flex-1 overflow-y-auto px-3 pb-4"></div>
  </section>

  <!-- 提示 -->
  <div id="toast" class="toast hide absolute left-1/2 -translate-x-1/2 top-[calc(8%+50px)] z-[60] rounded-full bg-[#333] text-white text-[12.5px] px-4 py-2 pointer-events-none whitespace-nowrap"></div>

  <!-- PNG 匯出預覽（瀏覽器擋下載時可長按／右鍵另存） -->
  <div id="pngModal" class="modal hide absolute inset-0 z-[95] flex flex-col items-center justify-center gap-3 px-6" style="background:rgba(36,30,27,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)">
    <div class="text-white text-[15px] font-medium">你的花束完成了 💐</div>
    <img id="pngImg" alt="花束成品圖" class="max-h-[62%] max-w-full w-auto rounded-xl shadow-[0_12px_30px_-10px_rgba(0,0,0,.5)] bg-white" style="-webkit-touch-callout:default" />
    <p id="pngHint" class="text-[13px] text-white text-center leading-relaxed">✨ 長按圖片選擇「加入照片」</p>
    <div class="flex gap-2">
      <button id="pngShare" class="hidden rounded-full bg-[#C9A27A] text-white px-5 py-2 text-[13.5px]">📲 儲存到照片</button>
      <button id="pngClose" class="rounded-full bg-white px-6 py-2 text-[13.5px]">關閉</button>
    </div>
  </div>

  <!-- 完成：拍立得 / 今日花語收據 -->
  <div id="receiptModal" class="modal hide absolute inset-0 z-[90] bg-[#E6E6E1] overflow-y-auto no-scrollbar">
    <div class="sheet min-h-full flex flex-col items-center px-6 pt-8 pb-8" id="receiptBody"></div>
  </div>
</div>

<script>
(() => {
  /* ================= 繪圖工具（極簡植物圖鑑：1px #555 線條＋平面色塊，無漸層） ================= */
  const INK = '#4A403A'; // 溫柔的深棕色細線（法式繪本感）
  const S = `stroke="${INK}" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"`;
  const LEAF = '#9CAF88', LEAF2 = '#B7C4A7', LEAF3 = '#7F9474';
  const f1 = n => (+n).toFixed(1);
  const rng = seed => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const line = (d, o = 1) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1" stroke-linecap="round" opacity="${o}"/>`;
  const C = (cx, cy, r, fill) => `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="${fill}" ${S}/>`;
  const dot = (cx, cy, r, fill) => `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="${fill}"/>`;
  const GRAD = new Map();
  const soft = (top, bottom) => {
    const id = `sg${top.slice(1)}${bottom.slice(1)}`;
    if (!GRAD.has(id)) GRAD.set(id, `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bottom}"/></linearGradient>`);
    return `url(#${id})`;
  };
  const STEM = (top, bottom = 298) => line(`M60 ${bottom} L60 ${top}`);
  const at = (x, y, ang, d0 = 0) => `transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(ang)}) translate(0 ${f1(-d0)})"`;

  // 花瓣造型（本地座標：基部在原點、朝上延伸 len、半寬 w）
  const SHAPE = {
    point: (len, w) => `M0 0 C ${f1(w)} ${f1(-len * .35)}, ${f1(w * .55)} ${f1(-len * .85)}, 0 ${f1(-len)} C ${f1(-w * .55)} ${f1(-len * .85)}, ${f1(-w)} ${f1(-len * .35)}, 0 0 Z`,
    round: (len, w) => `M0 0 C ${f1(w * 1.25)} ${f1(-len * .3)}, ${f1(w * 1.15)} ${f1(-len * 1.02)}, 0 ${f1(-len * .9)} C ${f1(-w * 1.15)} ${f1(-len * 1.02)}, ${f1(-w * 1.25)} ${f1(-len * .3)}, 0 0 Z`,
    cup: (len, w) => `M0 0 C ${f1(w * 1.2)} ${f1(-len * .12)}, ${f1(w)} ${f1(-len * .8)}, 0 ${f1(-len)} C ${f1(-w)} ${f1(-len * .8)}, ${f1(-w * 1.2)} ${f1(-len * .12)}, 0 0 Z`,
    // 玫瑰外瓣：寬圓、頂緣微波浪
    rose: (len, w) => `M0 0 C ${f1(w * 1.35)} ${f1(-len * .25)}, ${f1(w * 1.3)} ${f1(-len * .9)}, ${f1(w * .45)} ${f1(-len * .98)} Q 0 ${f1(-len * 1.06)}, ${f1(-w * .45)} ${f1(-len * .98)} C ${f1(-w * 1.3)} ${f1(-len * .9)}, ${f1(-w * 1.35)} ${f1(-len * .25)}, 0 0 Z`,
    strap: (len, w) => `M${f1(-w * .5)} 0 L${f1(-w)} ${f1(-len * .85)} A ${f1(w)} ${f1(w)} 0 0 1 ${f1(w)} ${f1(-len * .85)} L${f1(w * .5)} 0 Z`,
  };
  const petal = (x, y, ang, d0, shape, len, w, fill, vein = 0) =>
    `<path d="${SHAPE[shape](len, w)}" ${at(x, y, ang, d0)} fill="${fill}" ${S}/>` +
    (vein ? `<path d="M0 ${f1(-len * .12)} L0 ${f1(-len * vein)}" ${at(x, y, ang, d0)} fill="none" stroke="${INK}" stroke-width="1" stroke-linecap="round" opacity=".3"/>` : '');
  // n 片花瓣等角度環繞 (cx, cy)
  const petals = (cx, cy, n, d0, shape, len, w, fill, off = 0, vein = 0) => {
    let s = '';
    for (let i = 0; i < n; i++) s += petal(cx, cy, off + (i * 360) / n, d0, shape, len, w, fill, vein);
    return s;
  };
  // 扇貝邊圓（重瓣花的一層花瓣）；bulge 越接近 .5 弧越飽滿（.5 = 半圓）
  const scallop = (cx, cy, r, n, fill, off = 0, bulge = .62) => {
    const pt = i => { const a = (off + i * 360 / n) * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
    const rr = 2 * r * Math.sin(Math.PI / n) * bulge;
    let d = `M${f1(pt(0)[0])} ${f1(pt(0)[1])}`;
    for (let i = 1; i <= n; i++) { const [x, y] = pt(i); d += ` A ${f1(rr)} ${f1(rr)} 0 0 1 ${f1(x)} ${f1(y)}`; }
    return `<path d="${d} Z" fill="${fill}" ${S}/>`;
  };
  // 阿基米德螺旋（玫瑰花心）
  const spiral = (cx, cy, r0, turns) => {
    let d = '';
    for (let k = 0; k <= 48; k++) { const t = k / 48, r = r0 * (1 - t) + .8, a = t * turns * 2 * Math.PI; d += `${k ? 'L' : 'M'}${f1(cx + r * Math.sin(a))} ${f1(cy - r * Math.cos(a))} `; }
    return line(d);
  };
  // 兩端尖的葉片（ang：0 = 正上方），大片葉子加上主脈與側脈
  const lens = (x, y, len, w, ang, fill) => {
    let s = `<path d="M0 0 Q ${f1(w * 2)} ${f1(-len / 2)}, 0 ${f1(-len)} Q ${f1(-w * 2)} ${f1(-len / 2)}, 0 0 Z" ${at(x, y, ang)} fill="${fill}" ${S}/>`;
    let v = `M0 0 L0 ${f1(-len * .82)}`;
    // 側脈長度依該處實際葉寬（二次曲線半寬 = 4w·t(1−t)）縮放，保證留在葉片內
    if (len >= 22 && w >= 6) [.3, .5, .7].forEach(t => { const yy = -len * t, k = 4 * w * t * (1 - t) * .55; v += ` M0 ${f1(yy)} L${f1(k)} ${f1(yy - k * .6)} M0 ${f1(yy)} L${f1(-k)} ${f1(yy - k * .6)}`; });
    return s + `<path d="${v}" ${at(x, y, ang)} fill="none" stroke="${INK}" stroke-width="1" stroke-linecap="round" opacity=".38"/>`;
  };
  const pair = (y, len, w, ang, fill = LEAF) => lens(60, y, len, w, -ang, fill) + lens(60, y, len, w, ang, fill);
  // 冬青：鋸齒葉緣
  const holly = (x, y, len, w, ang, fill) => {
    const R = [], L = [];
    for (let i = 1; i <= 6; i++) { const t = i / 7, ww = w * Math.sin(Math.PI * t) * (i % 2 ? 1.25 : .8); R.push(`${f1(ww)} ${f1(-len * t)}`); L.unshift(`${f1(-ww)} ${f1(-len * t)}`); }
    return `<path d="M0 0 L${R.join(' L')} L0 ${f1(-len)} L${L.join(' L')} Z" ${at(x, y, ang)} fill="${fill}" ${S}/>` +
      `<path d="M0 0 L0 ${f1(-len * .85)}" ${at(x, y, ang)} fill="none" stroke="${INK}" opacity=".38"/>`;
  };
  const daisy2 = (cx, cy, r, c, seed) => {
    const R = rng(seed), back = mix(c.p, '#C9BFA8', .28);
    let s = '';
    for (let i = 0; i < 13; i++) s += petal(cx, cy, i * 27.7 + 14, r * .2, 'round', r * (.66 + R() * .12), r * .14, back);
    for (let i = 0; i < 13; i++) s += petal(cx, cy, i * 27.7 + R() * 5, r * .22, 'round', r * (.6 + R() * .14), r * .15, soft('#FFFFFF', c.p), .55);
    return s + C(cx, cy + r * .03, r * .33, soft(mix(c.c, '#FFFFFF', .35), c.c)) +
      `<path d="M${f1(cx - r * .2)} ${f1(cy + r * .16)} Q ${cx} ${f1(cy + r * .3)}, ${f1(cx + r * .2)} ${f1(cy + r * .16)}" fill="none" stroke="#B98A2E" stroke-width="1" opacity=".55"/>` +
      Array.from({ length: 9 }, (_, i) => { const a = i * 2.4, rr = r * .2 * Math.sqrt((i + .5) / 9); return dot(cx + rr * Math.cos(a), cy + rr * Math.sin(a), r * .035, '#A97A22'); }).join('');
  };
  const daisyHead = (cx, cy, r, c) => petals(cx, cy, 14, r * .26, 'round', r * .72, r * .13, c.p, 0, .7) + C(cx, cy, r * .3, c.c) +
    [0, 72, 144, 216, 288].map(a => dot(cx + r * .14 * Math.sin(a * Math.PI / 180), cy - r * .14 * Math.cos(a * Math.PI / 180), r * .045, '#B98A2E')).join('');
  const cluster = (cx, cy, c, r = 4.2) => [[0, 0], [-7.5, 0], [7.5, 0], [-3.75, -6.5], [3.75, -6.5], [-3.75, 6.5], [3.75, 6.5]]
    .map(([dx, dy]) => C(cx + dx, cy + dy, r, c.p) + dot(cx + dx + r * .3, cy + dy - r * .3, r * .22, c.d)).join('');
  const sepals = (cx, cy, d0, len) => [150, 180, 210].map(a => petal(cx, cy, a, d0, 'point', len, 4.2, LEAF)).join('');

  /* ---------- 擴充花材用的小工具 ---------- */
  const ell = (cx, cy, rx, ry, rot, fill, extra = '') => `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry)}" transform="rotate(${f1(rot)} ${f1(cx)} ${f1(cy)})" fill="${fill}" ${S}${extra}/>`;
  // 三次貝茲曲線上的點與切線角度（0 = 正上方）
  const bz = (P, t) => { const u = 1 - t; return [0, 1].map(k => u ** 3 * P[0][k] + 3 * u * u * t * P[1][k] + 3 * u * t * t * P[2][k] + t ** 3 * P[3][k]); };
  const bzAng = (P, t) => { const [x0, y0] = bz(P, Math.max(0, t - .01)), [x1, y1] = bz(P, Math.min(1, t + .01)); return Math.atan2(x1 - x0, y0 - y1) * 180 / Math.PI; };
  const bzPath = P => `M${P[0].join(' ')} C ${P[1].join(' ')}, ${P[2].join(' ')}, ${P[3].join(' ')}`;
  const twig = P => line(bzPath(P));
  // 沿著曲線在 t0~t1 之間放 n 個元件（fn(x, y, 角度, i, 0~1 進度)）
  const along = (P, t0, t1, n, fn) => Array.from({ length: n }, (_, i) => { const k = n > 1 ? i / (n - 1) : 0, t = t0 + (t1 - t0) * k, [x, y] = bz(P, t); return fn(x, y, bzAng(P, t), i, k); }).join('');
  const star5 = (x, y, r, fill, eye) => petals(x, y, 5, r * .15, 'round', r, r * .5, fill) + (eye ? dot(x, y, r * .28, eye) : '');

  /* ================= 主花：花莖葉片＋花頭分開定義，才能產生「盛開／半開／花苞」三種變體 ================= */
  // cx, cy：花頭中心；base：花莖頂端（花頭接點）；top：盛開時花頭最高點；bud：花苞造型
  const HEADS = {
    rose: { cx: 60, cy: 55, base: 84, top: 22, bud: 'cup',
      body: () => pair(205, 36, 10, 52) + pair(152, 27, 8, 46, LEAF2),
      head: c => {
        const outer = soft(c.l, c.p), front = soft(c.l, c.p);
        // 外層：5 片向外打開的寬瓣，頂緣有一道翻捲線
        const open = [0, 72, 144, 216, 288].map(a => `<path d="${SHAPE.rose(31, 14)}" ${at(60, 55, a, 2)} fill="${outer}" ${S}/>` +
          `<path d="M${f1(-7.7)} ${f1(-26.7)} Q 0 ${f1(-24.2)}, 7.7 ${f1(-26.7)}" ${at(60, 55, a, 2)} fill="none" stroke="${INK}" stroke-width="1" stroke-linecap="round" opacity=".35"/>`).join('');
        return sepals(60, 55, 20, 17) + open +
          // 花杯內部的深色底（填滿花瓣之間的縫隙）
          `<ellipse cx="60" cy="56" rx="24" ry="20" fill="${c.d}"/>` +
          // 後方花瓣的內面：上緣圓拱、下緣弧形收進花心
          `<path d="M36 56 C 36 36, 48 27, 60 27 C 72 27, 84 36, 84 56 C 76 50, 68 47, 60 47 C 52 47, 44 50, 36 56 Z" fill="${soft(c.p, c.d)}" ${S}/>` +
          // 緊密花心：兩片互相包覆的唇瓣
          `<ellipse cx="60" cy="50" rx="13" ry="9" fill="${c.d}" ${S}/>` +
          `<path d="M47 51 C 47 44, 54 40, 61 41 C 56 43, 53 47, 54 53 C 51 54, 48 53, 47 51 Z" fill="${c.p}" ${S}/>` +
          `<path d="M73 50 C 72 44, 66 40, 59 41 C 64 44, 66 48, 65 54 C 69 54, 72 53, 73 50 Z" fill="${c.l}" ${S}/>` + line('M58 47 Q 60 44.5 62 47', .6) +
          // 前方包覆的三片花瓣
          `<path d="M35 50 C 34 64, 45 75, 60 76 C 55 66, 49 56, 35 50 Z" fill="${front}" ${S}/>` +
          `<path d="M85 50 C 86 64, 75 75, 60 76 C 65 66, 71 56, 85 50 Z" fill="${front}" ${S}/>` +
          `<path d="M41 55 C 45 68, 53 75, 60 76 C 67 75, 75 68, 79 55 C 73 61, 67 63, 60 63 C 53 63, 47 61, 41 55 Z" fill="${front}" ${S}/>` +
          line('M45 58 Q 52 62 60 62.5 Q 68 62 75 58', .3);
      } },    tulip: { cx: 60, cy: 62, base: 96, top: 30, bud: 'cup',
      body: () => lens(60, 292, 120, 13, -12, LEAF) + lens(60, 292, 120, 13, 12, LEAF2),
      head: c => petal(60, 96, 0, 0, 'cup', 66, 16, c.d, .8) + petal(60, 96, -17, 0, 'cup', 60, 16, soft(c.l, c.p), .8) + petal(60, 96, 17, 0, 'cup', 60, 16, soft(c.l, c.p), .8) +
        petal(60, 97, 0, 0, 'cup', 50, 12, soft('#FFFFFF', c.l), .75) },
    sunflower: { cx: 60, cy: 55, base: 78, top: 18, bud: 'green',
      body: () => pair(205, 42, 14, 58) + pair(150, 33, 11, 52, LEAF2),
      head: c => {
        let s = petals(60, 55, 18, 13, 'point', 25, 6.4, soft(c.p, c.d), 10, .6) +
          Array.from({ length: 18 }, (_, i) => petal(60, 55, i * 20, 14, 'point', i % 2 ? 20 : 23, 5.8, soft(c.p, c.d), .6)).join('') +
          C(60, 55, 16, '#6E5B4B') + `<circle cx="60" cy="55" r="11.5" fill="none" stroke="#4E3F33" stroke-width="1"/>`;
        for (let k = 1; k < 46; k++) { const r = 2.15 * Math.sqrt(k), a = k * 2.39996; if (r < 14.5) s += dot(60 + r * Math.cos(a), 55 + r * Math.sin(a), .8, c.d); }
        return s;
      } },
    gerbera: { cx: 60, cy: 55, base: 72, top: 21, bud: 'green',
      body: () => pair(282, 24, 7, 64),
      head: c => petals(60, 55, 18, 7, 'round', 27, 3.6, soft(c.p, c.d), 10, .7) + petals(60, 55, 18, 8, 'round', 24, 3.8, soft(c.l || c.p, c.p), 0, .7) +
        petals(60, 55, 18, 6, 'point', 10, 2.2, c.d, 5) +
        C(60, 55, 8.5, c.c) + Array.from({ length: 14 }, (_, i) => { const a = i * 2 * Math.PI / 14; return dot(60 + 6.2 * Math.sin(a), 55 - 6.2 * Math.cos(a), .8, '#FFF4D6'); }).join('') +
        C(60, 55, 3.6, '#4F4436') },
    ranunculus: { cx: 60, cy: 56, base: 88, top: 24, bud: 'ball',
      body: () => pair(196, 32, 9, 50) + pair(150, 23, 7, 46, LEAF2),
      head: c => {
        const bowl = (r, cy, fill) => `<path d="M${f1(60 - r)} ${f1(cy)} C ${f1(60 - r)} ${f1(cy + r * .95)}, ${f1(60 + r)} ${f1(cy + r * .95)}, ${f1(60 + r)} ${f1(cy)} C ${f1(60 + r * .5)} ${f1(cy + r * .28)}, ${f1(60 - r * .5)} ${f1(cy + r * .28)}, ${f1(60 - r)} ${f1(cy)} Z" fill="${fill}" ${S}/>`;
        let s = sepals(60, 56, 16, 14) + `<ellipse cx="60" cy="50" rx="30" ry="26" fill="${c.d}" ${S}/>` + C(60, 36, 6, LEAF) + dot(60, 36, 1.6, LEAF3);
        [[29, 48], [25, 44], [21, 41], [17, 38.5], [13, 36.5], [9, 35]].forEach(([r, cy], k) => s += bowl(r, cy, k % 2 ? soft(c.l, c.p) : soft(c.p, c.d)));
        return s;
      } },
    hydrangea: { cx: 60, cy: 58, base: 96, top: 18, bud: 'cluster',
      body: () => pair(140, 46, 15, 62),
      head: c => {
        let s = scallop(60, 58, 38, 16, c.d);
        for (let row = -3; row <= 3; row++) for (let col = -3; col <= 3; col++) {

  // 微色差濾鏡（給點陣插畫花頭用；向量部分直接改色）
  let filterSeq = 0;
  const shiftFilter = inst => {
    if (!inst || (!inst.dh && !inst.dl)) return '';
    const id = `hs${++filterSeq}`, k = (1 + inst.dl).toFixed(3);
    GRAD.set(id, `<filter id="${id}" color-interpolation-filters="sRGB"><feColorMatrix type="hueRotate" values="${inst.dh}"/>` +
      `<feComponentTransfer><feFuncR type="linear" slope="${k}"/><feFuncG type="linear" slope="${k}"/><feFuncB type="linear" slope="${k}"/></feComponentTransfer></filter>`);
    return ` filter="url(#${id})"`;
  };
  // 花莖：從底部（綁點以下）以貝茲曲線接到花頭，ext = 花莖加長量、bend = 自然彎曲
  const stemCurve = (h, ext, bend) => {
    const top = h.base - ext, x = 60 + bend;
    return line(`M60 298 C 60 ${f1(298 - (298 - top) * .45)}, ${f1(x)} ${f1(top + (298 - top) * .3)}, ${f1(x)} ${f1(top)}`);
  };
  const headArt = (k, h, c, v, inst) => {
    const img = HEAD_ART[k]?.[`${v}|${inst?.ci ?? 0}`];
    if (img) return `<image href="${img.src}" x="${img.x}" y="${img.y}" width="${img.w}" height="${img.h}"${shiftFilter(inst)}/>`;
    return v === 'bud' ? budArt(h, c) : v === 'semi' ? semiArt(h, c) : h.head(c);
  };
  // 花頭以平移跟著花莖頂端走，絕不拉伸變形
  const bloomDraw = () => Object.fromEntries(Object.entries(HEADS).map(([k, h]) =>
    [k, (c, v = 'full', inst) => {
      const ext = inst?.ext || 0, bend = inst?.bend || 0;
      return stemCurve(h, ext, bend) + h.body() + `<g transform="translate(${f1(bend)} ${f1(-ext)})">${headArt(k, h, c, v, inst)}</g>`;
    }]));
  // 花頭最高點（viewBox 座標）：選取把手放在它正上方
  const headTop = (type, v, ext) => {
    const h = HEADS[type];
    if (!h) return 22 - (ext || 0);
    return (ext || 0) * -1 + (v === 'bud' ? h.base - (h.bud === 'cluster' ? 42 : h.bud === 'cup' ? 50 : 36) : v === 'semi' ? h.base - (h.base - h.top) * .76 : h.top);
  };

  /* ---------- 微色差：每朵花例項的色相 ±3°、亮度 ±5% ---------- */
  const hex2hsl = hex => {
    let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];
    const d = mx - mn, sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, sat, l];
  };
  const hsl2hex = (h, sat, l) => {
    const k = n => (n + h / 30) % 12, a = sat * Math.min(l, 1 - l);
    const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0');
    return '#' + f(0) + f(8) + f(4);
  };
  const shiftColor = (hex, dh, dl) => { const [h, sat, l] = hex2hsl(hex); return hsl2hex((h + dh + 360) % 360, sat, Math.max(0, Math.min(1, l * (1 + dl)))); };
  const tint = (c, inst) => !inst || (!inst.dh && !inst.dl) ? c :
    Object.fromEntries(Object.entries(c).map(([k, v]) => [k, typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) ? shiftColor(v, inst.dh, inst.dl) : v]));
  // 新花例項：隨機變體（有花頭的主花才有花苞／半開）＋ 微色差
  // 現實比例基準尺寸（鎖定，不開放手動縮放）：大花＞中花＞小配花；葉材枝條較長
  const BASE_SIZE = {
    darkrose: .96, hwtulip: .96, ghostdaisy: .9, deadbranch: 1.04,

    lavender: .94, waxflower: .9, statice: .92, veronica: .94, forgetmenot: .86, solidago: .96, craspedia: .9, bunnytail: .88, snapdragon: .96, sweetpea: .9,
    ruscus: 1.04, pittosporum: 1.0, monstera: .98, ivy: 1.0, dustymiller: .94, pampas: 1.06, wheat: 1.0, hypericum: .9, lunaria: .96, pepperberry: 1.0,

  const SIZE_BOOST = 1.18; // 花材整體放大，讓花束更飽滿

  /* ================= 幾何花材 SVG（viewBox 0 0 120 300，花莖底部 = 旋轉支點；造型左右對稱） ================= */

    snapdragon: c => {

    pampas: c => {

      return h + `<svg viewBox="0 0 40 40" width="46" style="position:absolute;right:9%;top:7%;opacity:.85"><path d="M26 4 A 16 16 0 1 0 36 30 A 13 13 0 1 1 26 4 Z" fill="#F3E2B8"/></svg>` + bat(12, 14, 30) + bat(24, 8, 20) + bat(70, 30, 24);
    },
    gobo: '<div style="background:radial-gradient(ellipse at 50% 92%, rgba(255,150,70,.18), transparent 55%);mix-blend-mode:screen"></div>' };
  const SCENE_ORDER = ['paper', 'grey', 'sun', 'wood', 'midnight', ...(HALLOWEEN ? ['halloween'] : [])];
  const sceneDecor = sc => typeof sc.decor === 'function' ? sc.decor() : sc.decor;
  function renderScene() {
    const sc = SCENES[state.scene];
    $('#scene').style.background = sc.bg;
    $('#scene').innerHTML = sceneDecor(sc);
    $('#gobo').innerHTML = sc.gobo;
    canvasWrap.classList.toggle('scene-dark', !!sc.dark);
  }

  // 立體書景深：依疊放順序與種類給每朵花一個 Z 高度（嚴格遞增，確保 3D 排序與圖層順序一致）
  // 微景深：花材層只在 Z 0 ~ 6 之間，介於內襯（-6）與前包裝紙（9）之間
  const Z_RANGE = { foliage: [0, 1], filler: [1, 2], base: [2, 3], main: [3, 5] }, Z_MAX = 6;
  function depthMap() {
    const list = state.flowers, n = list.length, z = {};
    const groups = {};
    list.forEach(f => (groups[MAT[f.type].slot] = groups[MAT[f.type].slot] || []).push(f));
    let prev = -Infinity;
    list.forEach((f, i) => {
      const slot = MAT[f.type].slot, g = groups[slot], k = g.indexOf(f), [a, b] = Z_RANGE[slot];
      let v = a + (b - a) * (g.length > 1 ? k / (g.length - 1) : .5);
      if (i === n - 1 && RANK[slot] >= RANK.base) v = Z_MAX; // 最前排焦點主花
      z[f.id] = prev = Math.max(v, prev + .4);
    });
    // 花很多時嚴格遞增可能超出 20，等比例壓回 0 ~ 20（保持前後順序）
    const vals = Object.values(z), lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi > Z_MAX) for (const id in z) z[id] = lo + (z[id] - lo) * (Z_MAX - lo) / (hi - lo);
    return z;
  }
  let zMap = {};
  function flowerStyle(f, i) {
    const m = MAT[f.type], z = state.mode3d ? (zMap[f.id] ?? 0) : 0;
    const oy = m.h - TAIL / f.scale; // 元素內的支點高度：縮放後綁點以下永遠剩 TAIL px
    return `left:${f.x - m.w / 2}px;top:${f.y - oy}px;width:${m.w}px;height:${m.h}px;z-index:${i + 1};transform-origin:50% ${oy.toFixed(2)}px;transform:translateZ(${z.toFixed(1)}px) rotate(${f.rot}deg) scale(${f.scale})`;
  }
  function renderFlowers() {
    zMap = depthMap();
    layerFlowers.innerHTML = state.flowers.map((f, i) =>
      `<div class="flower${f.id === state.sel ? ' is-sel' : ''}" data-id="${f.id}" style="${flowerStyle(f, i)}">
        <div class="flip${f.flip ? ' on' : ''}"><div class="${f.id === lastAdded || popIds.has(f.id) ? 'pop' : ''}" style="width:100%;height:100%${popIds.has(f.id) ? `;animation-delay:${popIds.get(f.id)}ms` : ''}">${flowerSVG(f.type, f.color, '', '', f)}</div></div>
      </div>`).join('');
    lastAdded = null; popIds = new Map();
    $('#emptyHint').style.display = state.flowers.length ? 'none' : '';
    updateSel();
  }
  function applyFlower(f) {
    const el = layerFlowers.querySelector(`[data-id="${f.id}"]`);
    if (!el) return;
    el.style.cssText = flowerStyle(f, state.flowers.indexOf(f));
    el.querySelector('.flip').classList.toggle('on', !!f.flip);
    if (f.id === state.sel) updateSel();
  }
  function updateSel() {
    const f = get(state.sel);
    if (!f || state.finished) { selBox.style.display = 'none'; toolbar.classList.add('hide'); return; }
    const m = MAT[f.type];
    // selBox 與花朵元素同框同變形（支點都在花莖底部），把手放在花頭最高點上方
    const oy = m.h - TAIL / f.scale;
    selBox.style.cssText = `display:block;left:${f.x - m.w / 2}px;top:${f.y - oy}px;width:${m.w}px;height:${oy}px;transform-origin:50% 100%;transform:rotate(${f.rot}deg) scale(${f.scale})`;
    const topPx = headTop(f.type, f.v, f.ext) * m.h / 300, gap = 30 / f.scale;
    const hd = $('#handle');
    hd.style.top = `${topPx - gap}px`; hd.style.transform = `scale(${1 / f.scale})`;
    $('#selGuide').style.top = `${topPx - gap + 15}px`;
    toolbar.classList.remove('hide');
  }
  function select(id) {
    const had = state.sel;
    state.sel = id;
    layerFlowers.querySelectorAll('.flower').forEach(el => el.classList.toggle('is-sel', el.dataset.id === id));
    updateSel();
    if (id) {
      // 點畫布上的花：工作台跳到該分類並顯示它的色票
      const m = MAT[get(id).type];
      state.activeMat = get(id).type;

  }

  /* ---------- 色票列 ---------- */
  // 色票作用對象：畫布上選取的花 > 剛放進花束的那朵 > 下一朵要加入的花
  function swatchTarget() {
    const k = state.activeMat, s = get(state.sel), f = get(state.focus);

  function swatchBarHTML() {

    return `<div class="swatch-bar sticky top-0 z-10 -mx-3 px-3 pt-1 pb-2 mb-1 flex items-center justify-between border-b border-[#DADAD3]">${head}${dots}</div>`;
  }

  /* ---------- 工作台 ---------- */
  function renderWorkspace() {
    $('#tabs').innerHTML = TABS.map(t =>

    const section = t => `<div class="text-[11px] tracking-[.15em] text-ink/55 mt-1 mb-1.5">${t}</div>`;

    if (FLOWER_TABS.includes(state.tab)) {
      if (MAT[state.activeMat].tab !== state.tab) state.activeMat = Object.keys(MAT).find(k => MAT[k].tab === state.tab);
      const items = Object.entries(MAT).filter(([, m]) => m.tab === state.tab);
      panel.innerHTML = swatchBarHTML() + `<div class="grid grid-cols-4 gap-2 pt-1.5">` + items.map(([k, m]) => `
        <div data-act="add" data-val="${k}" class="${cardCls(state.activeMat === k)} ${m.seasonal ? 'seasonal' : ''}" role="button" aria-label="加入${m.name}">
          ${m.seasonal ? `<span class="badge -mt-0.5 mb-0.5">${m.seasonal}</span>` : ''}
          <div class="${m.seasonal ? 'h-[40px]' : 'h-[50px]'} w-full flex items-center justify-center pointer-events-none relative z-[1]">${flowerSVG(k, state.curColor[k], m.thumb, 'height:100%;width:100%')}</div>
          <div class="text-[12px] font-medium mt-0.5 leading-tight">${m.name}</div><div class="text-[8px] tracking-[.06em] text-[#999] leading-tight uppercase truncate w-full">${m.en}</div>
          <div class="text-[9px] text-[#777] leading-[1.25] mt-0.5 line-clamp-2 min-h-[22px]">${m.meaning}</div>
          <div class="flex gap-[3px] mt-1 h-[7px] relative z-[1]">${m.colors.length > 1 ? m.colors.map(c => `<span class="mini-dot" style="background:${c.p}"></span>`).join('') : ''}</div>
        </div>`).join('') + `</div>`;
    } else if (state.tab === 'wrap') {
      const w = state.wrap, [, styles, colors, sKey, cKey, cols] = WRAP_SUBS[state.wrapSub];
      const subBar = `<div class="flex gap-1.5">${Object.entries(WRAP_SUBS).map(([id, [label, , , , , , hint]]) =>
        `<button data-act="wsub" data-val="${id}" class="flex-1 min-w-0 rounded-xl px-1 py-1 text-[12px] leading-tight border transition ${state.wrapSub === id ? 'bg-white border-[#555] font-medium' : 'bg-transparent border-[#D5D5CE] text-[#777]'}">${label}<span class="block text-[9px] font-normal opacity-60 mt-0.5">${hint}</span></button>`).join('')}</div>`;

          <div class="min-w-0 text-[11px] leading-tight text-ink/65 truncate"><b class="text-ink">${styles[w[sKey]].name}</b>${noColor ? '' : ` · ${curC.n}`}</div>
          <div class="flex gap-1.5 shrink-0">${noColor ? '<span class="text-[10.5px] text-ink/45">極簡無襯紙</span>' : colors.map(c =>
            `<button data-act="wrapset" data-key="${cKey}" data-val="${c.id}" title="${c.n}" aria-label="${c.n}" class="sw sm ${w[cKey] === c.id ? 'on' : ''}" style="background-color:${c.c}"></button>`).join('')}</div>
        </div>`;

        `<div class="grid gap-1.5" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">` + Object.entries(styles).map(([id, st]) => `

          <div class="pointer-events-none flex items-center justify-center" style="height:46px;width:100%">${DECOS[k].svg().replace('<svg ', `<svg style="max-height:46px;max-width:100%" `)}</div>

          <div class="min-w-0"><div class="text-[13px] font-medium">🦇 萬聖節裝飾貼紙</div><div class="text-[10.5px] text-[#888] leading-tight">點一下貼到畫布 · 拖曳移動 · 右下角把手旋轉縮放 · × 刪除</div></div>
          <button data-act="decoclear" class="shrink-0 rounded-full border border-[#D5D5CE] bg-white px-2.5 py-1 text-[11px]">清除裝飾</button></div>
        <div class="text-[11px] tracking-[.12em] text-[#999] mb-1">小巧貼紙</div>
        <div class="grid grid-cols-5 gap-1.5">${DECO_STICKERS.map(k => cell(k, '')).join('')}</div>
        <div class="text-[11px] tracking-[.12em] text-[#999] mt-2.5 mb-1">祝福小插卡</div>
        <div class="grid grid-cols-2 gap-1.5">${DECO_CARDS.map(k => cell(k, '')).join('')}</div>`;
    } else {

      const subBar = `<div class="flex gap-1.5">${subs.map(([id, label, hint]) =>
        `<button data-act="csub" data-val="${id}" class="flex-1 min-w-0 rounded-xl px-1 py-1 text-[11.5px] leading-tight border transition ${sub === id ? 'bg-white border-[#555] font-medium' : 'bg-transparent border-[#D5D5CE] text-[#777]'}">${label}<span class="block text-[9px] font-normal opacity-60 mt-0.5">${hint}</span></button>`).join('')}</div>`;
      let head = '', body = '';
      if (sub === 'style') {
        const st = CARD_STYLES[c.style];
        head = `<div class="flex items-center justify-between gap-2 mt-1.5">
            <div class="min-w-0 text-[11px] leading-tight text-[#777] truncate"><b class="text-ink font-medium">${st.name}</b>${c.style === 'none' ? '' : ` · ${toneOf().n}`}</div>
            <div class="flex items-center gap-1.5 shrink-0">${c.style === 'none' ? '' : CARD_TONES.map(t =>
              `<button data-act="ctone" data-val="${t.id}" title="${t.n}" aria-label="${t.n}" class="sw sm ${c.tone === t.id ? 'on' : ''}" style="background-color:${t.c}"></button>`).join('') +
              `<button data-act="creset" class="ml-1 rounded-full border border-[#CFCFC8] bg-white px-2 py-0.5 text-[10.5px]">歸位</button>`}</div>

            <div data-act="cstyle" data-val="${id}" class="${cardCls(c.style === id)}" role="button" aria-label="${cs.name}">
              <div class="h-[50px] w-full flex items-center justify-center pointer-events-none">${id === 'none' ? '<span class="text-[20px] text-[#AAA]">∅</span>' :
                cardSVG(id, c.tone).replace(/width="\d+" height="\d+"/, 'style="max-width:100%;max-height:100%"')}</div>
              <div class="text-[11px] font-medium mt-1 leading-tight">${cs.short}</div>
              <div class="text-[8px] tracking-[.05em] text-[#999] leading-tight uppercase">${cs.en}</div>

          <p class="text-[10.5px] text-[#888] mt-2">在畫布上直接拖曳標籤：放上方當插牌，放到收腰附近會自動連線成吊牌。</p>`;
      } else if (sub === 'text') {
        body = `<div class="flex flex-col gap-1.5 mt-1.5">
            <div class="grid grid-cols-2 gap-1.5">

              <label class="fld"><span>FROM</span><input id="cFrom" data-field="sign" maxlength="12" placeholder="署名" value="${esc(c.sign)}"></label>

              <button data-act="quote" class="lucky-btn shrink-0 rounded-full px-3 py-1.5 text-[11.5px]">✦ 隨機靈感金句</button>

        body = `<div class="grid grid-cols-5 gap-1.5">` + SCENE_ORDER.map(id => { const s2 = SCENES[id]; return `
            <div data-act="scene" data-val="${id}" class="${cardCls(state.scene === id)}" role="button" aria-label="${s2.name}">
              <div class="h-[46px] w-full rounded-md relative overflow-hidden pointer-events-none border border-[#D5D5CE]" style="background:${s2.bg}">
                <div class="absolute inset-0 overflow-hidden">${sceneDecor(s2)}</div>
                <div class="absolute inset-0 overflow-hidden">${s2.gobo}</div></div>
              <div class="text-[11px] font-medium mt-1 leading-tight">${s2.short}</div>
            </div>`; }).join('') + `</div>`;
      }
      panel.innerHTML = `<div class="swatch-bar sticky top-0 z-10 -mx-3 px-3 pt-0.5 pb-2 mb-1.5 border-b border-[#DADAD3]">${subBar}${head}</div>` + body;
    }
  }

  /* ================= 行為 ================= */
  // depth：花莖插入綁結以下的深度（越深花頭越低）；支點沿花莖方向往下移，花莖仍穿過綁結
  function anchor(f) {
    const r = f.rot * Math.PI / 180, d = f.depth || 0;
    f.x = PIVOT.x + (f.kx || 0) - d * Math.sin(r);
    f.y = PIVOT.y + d * Math.cos(r);
    return f;
  }
  function slotFor(slot, i) {
    const list = SLOTS[slot], base = list[i % list.length], ring = Math.floor(i / list.length);
    const rot = base.a + Math.sign(base.a) * ring * 4;
    return { rot, depth: (1 - base.s) * 110 + ring * 8, kx: 0, flip: rot > 0 };
  }
  function addFlower(type) {
    const m = MAT[type];
    const idx = state.flowers.filter(f => MAT[f.type].slot === m.slot).length;
    const f = anchor({ id: 'f' + uidN++, type, color: state.curColor[type], ...slotFor(m.slot, idx), ...newInstance(type) });
    // 依圖層排序插入：葉材在最後方、主花在最前方，新手更容易排出層次
    const at = state.flowers.findIndex(g => rankOf(g) > RANK[m.slot]);
    if (at < 0) state.flowers.push(f); else state.flowers.splice(at, 0, f);
    lastAdded = f.id; state.focus = f.id; state.activeMat = type;
    state.sel = null;
    renderFlowers(); renderWorkspace();
    sparkleAt(layerFlowers.querySelector(`[data-id="${f.id}"]`)); SFX.tap(); SFX.rustle();
    toast(`${m.seasonal ? '★ ' : ''}${m.name}${HEADS[type] ? `（${VARIANTS[f.v]}）` : ''}・${m.meaning}`);
  }
  function reshuffle() {
    if (!state.flowers.length) return toast('花束還是空的喔');
    Object.keys(SLOTS).forEach(slot =>
      shuffleArr(state.flowers.filter(f => MAT[f.type].slot === slot)).forEach((f, i) => anchor(Object.assign(f, slotFor(slot, i), { _r: Math.random() }))));
    state.flowers.sort((a, b) => rankOf(a) - rankOf(b) || a._r - b._r);
    zMap = depthMap();
    layerFlowers.classList.add('animate');
    state.flowers.forEach(applyFlower);
    updateSel();
    setTimeout(() => layerFlowers.classList.remove('animate'), 700);
  }

  let toastT;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.remove('hide');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 1600);
  }

  /* ---------- 畫布縮放與座標 ---------- */
  function fit() {
    scale = Math.min(canvasWrap.clientWidth / 360, canvasWrap.clientHeight / 480);
    applyStageTilt();
  }
  const goboShift = t => `translate(${(t.y * 1.4).toFixed(1)}px, ${(-t.x * 1.2).toFixed(1)}px)`;
  function applyStageTilt() {
    const t = mainTilt;
    $('#gobo').style.transform = goboShift(t);

  function prepareImages() {
    prerender = (async () => {
      await new Promise(r => setTimeout(r, 900)); // 等訂製單動畫結束再畫，避免卡頓
      if (!window.html2canvas) return null;
      const canvas = await bouquetCanvas();
      return { canvas, blob: await toBlob(canvas) };
    })().catch(() => null);
  }
  async function runAction(btn, fn) {
    if (!window.html2canvas) return toast('匯出元件載入中，請稍後再試');
    const html = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '⏳<span>產生中…</span>';
    try { await fn(); } catch (err) { console.error(err); toast('處理失敗，請再試一次'); }
    finally { btn.disabled = false; btn.innerHTML = html; }
  }
  const stamp = () => new Date().toISOString().slice(0, 10);
  // 💐 領取花束：下載花束成品圖
  async function claimBouquet() {
    const pre = prerender && await prerender;
    const canvas = pre?.canvas || await bouquetCanvas();
    await saveImage(canvas, `my-bouquet-${stamp()}.png`, '花束圖片', pre?.blob);
  }
  // 🧾 下載訂單：整張訂製單（照片換成高畫質花束圖、花語明細展開）
  async function downloadOrder() {
    const pre = prerender && await prerender;
    const photo = (pre?.canvas || await bouquetCanvas()).toDataURL('image/png');
    const canvas = await html2canvas($('#receiptBody .order'), {
      scale: 3, backgroundColor: '#FFFFFF', logging: false,
      onclone: doc => {
        const pv = doc.getElementById('pv');
        pv.innerHTML = `<img src="${photo}" style="width:100%;height:100%;object-fit:contain">`;
        doc.querySelectorAll('.order-detail').forEach(d => { d.open = true; d.querySelector('summary').remove(); });
      },
    });
    await saveImage(canvas, `bouquet-order-${orderMeta.no}.png`, '訂單');
  }
  $('#pngClose').onclick = () => $('#pngModal').classList.add('hide');

  /* ================= ♪ 背景音樂（Web Audio 即時合成的音樂盒）與音效 ================= */
  let sharedCtx = null;
  const audioCtx = () => {
    if (!sharedCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; sharedCtx = new AC(); }
    if (sharedCtx.state === 'suspended') sharedCtx.resume().catch(() => {});
    return sharedCtx;
  };
  // 捕獲階段解鎖：第一下點擊就能出聲，且不會在使用者互動前建立音訊
  document.addEventListener('pointerdown', () => { try { audioCtx(); } catch {} }, { capture: true });

  /* ---------- 微音效互動系統：全部即時合成、極短、音量低於背景音樂 ---------- */
  const SFX = (() => {
    const KEY = 'bouquet.sfx';
    let enabled = true;
    try { enabled = localStorage.getItem(KEY) !== '0'; } catch {}
    let bus = null, noise = null, slider = null;
    const ready = () => {
      // 剛解鎖時 context 可能仍在 resume 中：照常排程，恢復後立即播放
      if (!enabled || !sharedCtx || sharedCtx.state === 'closed') return null;
      if (!bus) {
        bus = sharedCtx.createGain(); bus.gain.value = .5; bus.connect(sharedCtx.destination);
        noise = sharedCtx.createBuffer(1, sharedCtx.sampleRate, sharedCtx.sampleRate);
        const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      return sharedCtx;
    };
    const env = (g, t, peak, a, dur) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
    const tone = (t, f, peak, dur, type = 'sine', f2) => {
      const c = sharedCtx, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      env(g, t, peak, .004, dur); o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .05);
    };
    // 濾波雜訊：紙張、絲帶、快門的質地
    const hiss = (t, dur, peak, type, f, q = 1, f2) => {
      const c = sharedCtx, src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
      src.buffer = noise; flt.type = type; flt.frequency.setValueAtTime(f, t); flt.Q.value = q;
      if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + dur);
      env(g, t, peak, Math.min(.03, dur * .2), dur); src.connect(flt); flt.connect(g); g.connect(bus);
      src.start(t, Math.random() * .5); src.stop(t + dur + .05);
    };
    const bell = (t, m, peak, dur) => { const f = 440 * 2 ** ((m - 69) / 12); tone(t, f, peak, dur); tone(t, f * 2.01, peak * .2, dur * .5); tone(t, f * 3.98, peak * .06, dur * .3); };
    const safe = fn => (...a) => { try { if (ready()) fn(sharedCtx.currentTime, ...a); } catch {} };
    let lastTap = -1;
    return {
      get enabled() { return enabled; },
      set(on) { enabled = on; try { localStorage.setItem(KEY, on ? '1' : '0'); } catch {} if (!on) this.slideEnd(); },
      // 1. 木質輕敲：短促的中頻音＋一點點木頭質感的雜訊
      tap: safe(t => {
        if (t - lastTap < .04) return; lastTap = t;
        tone(t, 820 + Math.random() * 60, .09, .07, 'triangle', 520); tone(t, 1680, .025, .03); hiss(t, .025, .04, 'bandpass', 2400, 3);
      }),
      // 2. 紙張摩擦：幾顆高頻雜訊顆粒
      rustle: safe((t, soft = 1) => {
        for (let i = 0; i < 4; i++) hiss(t + i * .035 + Math.random() * .02, .06 + Math.random() * .05, (.045 + Math.random() * .03) * soft, 'bandpass', 2800 + Math.random() * 2600, .9);
        hiss(t, .22, .025 * soft, 'highpass', 1800);
      }),
      // 3. 滑動：持續的柔和氣流聲，音量跟拖曳速度、音高跟角度走
      slide: safe((t, rot, speed) => {
        if (!slider) {
          const c = sharedCtx, src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
          src.buffer = noise; src.loop = true; flt.type = 'bandpass'; flt.Q.value = 2.2; g.gain.value = 0;
          src.connect(flt); flt.connect(g); g.connect(bus); src.start();
          slider = { src, flt, g };
        }
        slider.flt.frequency.setTargetAtTime(900 + Math.abs(rot) * 22, t, .05);
        slider.g.gain.setTargetAtTime(Math.min(.05, speed * .012), t, .04);
        slider.g.gain.setTargetAtTime(0, t + .12, .08); // 停手就自然淡出
      }),
      slideEnd() {
        if (!slider || !sharedCtx) return;
        const t = sharedCtx.currentTime, sl = slider; slider = null;
        sl.g.gain.setTargetAtTime(0, t, .05); setTimeout(() => { try { sl.src.stop(); } catch {} }, 400);
      },
      // 4. 幸運花束：水晶琴琶音＋閃爍泛音
      chime: safe(t => {
        [76, 79, 83, 88, 91, 95].forEach((m, i) => bell(t + i * .075, m, .07, 1.4));
        for (let i = 0; i < 6; i++) tone(t + .3 + i * .06 + Math.random() * .04, 2600 + Math.random() * 1800, .012, .25);
      }),
      // 5. 完成包裝：絲帶滑開（掃頻氣音）→ 信封展開（紙張低沉一聲）→ 溫柔的兩聲鈴
      unwrap: safe(t => {
        hiss(t, .45, .05, 'bandpass', 700, 1.4, 3600);
        hiss(t + .42, .16, .06, 'lowpass', 520); hiss(t + .44, .2, .03, 'bandpass', 3200, .8);
        bell(t + .62, 84, .07, 1.2); bell(t + .78, 91, .05, 1.4);
      }),
      // 6. 下載成功：相機快門兩聲輕響＋完成提示鈴
      success: safe(t => {
        hiss(t, .035, .07, 'highpass', 3200); hiss(t + .075, .05, .05, 'highpass', 2400);
        tone(t + .02, 180, .04, .06, 'sine', 90);
        bell(t + .2, 88, .08, 1.3);
      }),
    };
  })();
  const sfxBtn = $('#btnSfx');
  const syncSfxBtn = () => { sfxBtn.textContent = SFX.enabled ? '🔊 音效開啟' : '🔇 靜音'; sfxBtn.classList.toggle('off', !SFX.enabled); sfxBtn.setAttribute('aria-pressed', SFX.enabled); };
  sfxBtn.addEventListener('pointerdown', e => e.stopPropagation()); // 不觸發畫布的取消選取
  sfxBtn.onclick = () => { SFX.set(!SFX.enabled); syncSfxBtn(); if (SFX.enabled) SFX.tap(); };
  syncSfxBtn();

  const Sound = (() => {
    let ctx = null, master = null, wet = null, timer = 0, on = false, step = 0, nextT = 0;
    const BPM = 76, EIGHTH = 60 / BPM / 2;
    // Cmaj7 → Am7 → Fmaj7 → G6，每和弦兩小節；旋律在五聲音階上輕輕游走
    const CHORDS = [[48, 55, 64, 71], [45, 52, 60, 67], [41, 48, 57, 64], [43, 50, 59, 64]];
    const SCALE = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81];
    const hz = m => 440 * 2 ** ((m - 69) / 12);
    let mel = 4;
    function init() {
      if (ctx) return;
      ctx = audioCtx();
      master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
      // 簡單的回聲殘響
      const delay = ctx.createDelay(); delay.delayTime.value = EIGHTH * 3;
      const fb = ctx.createGain(); fb.gain.value = .32;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
      wet = ctx.createGain(); wet.gain.value = .35;
      wet.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(master);
    }
    // 音樂盒音色：正弦＋高八度泛音，快速起音、長尾衰減
    function bell(t, m, vel = .16, dur = 1.8, dest = master) {
      [[1, 1], [2, .18], [3.01, .06]].forEach(([mult, amp]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = hz(m) * mult;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel * amp, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur / mult);
        o.connect(g); g.connect(dest); g.connect(wet); o.start(t); o.stop(t + dur + .1);
      });
    }
    function pad(t, notes, dur) {
      notes.forEach(m => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle'; o.frequency.value = hz(m - 12);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.018, t + dur * .4); g.gain.linearRampToValueAtTime(0, t + dur);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
      });
    }
    function schedule() {
      while (nextT < ctx.currentTime + .25) {
        const bar = Math.floor(step / 8), chord = CHORDS[Math.floor(bar / 2) % 4], beat = step % 8;
        if (step % 16 === 0) pad(nextT, chord, EIGHTH * 16);
        if (beat === 0 || beat === 4) bell(nextT, chord[0] + 12, .07, 2.4);
        if (beat % 2 === 0 || Math.random() < .35) {
          mel = Math.max(0, Math.min(SCALE.length - 1, mel + [-2, -1, -1, 0, 1, 1, 2][(Math.random() * 7) | 0]));
          if (Math.random() < .85) bell(nextT, SCALE[mel], beat % 4 === 0 ? .13 : .09);
        }
        step++; nextT += EIGHTH * (beat % 2 ? .9 : 1.1); // 輕微搖擺感
      }
    }
    function start() {
      init(); ctx.resume(); on = true;
      master.gain.cancelScheduledValues(ctx.currentTime); master.gain.linearRampToValueAtTime(.9, ctx.currentTime + 1.2);
      nextT = ctx.currentTime + .05; clearInterval(timer); timer = setInterval(schedule, 90);
    }
    function stop() {
      on = false; if (!ctx) return;
      master.gain.cancelScheduledValues(ctx.currentTime); master.gain.linearRampToValueAtTime(0, ctx.currentTime + .6);
      setTimeout(() => { if (!on) clearInterval(timer); }, 700);
    }
    return { toggle: () => (on ? stop() : start(), on), get on() { return on; } };
  })();
  const musicBtn = $('#btnMusic');
  musicBtn.onclick = () => {
    const on = Sound.toggle();
    musicBtn.classList.toggle('on', on); musicBtn.setAttribute('aria-pressed', on);
    toast(on ? '♪ 背景音樂已開啟' : '背景音樂已關閉');
  };

  // 加花特效：從花頭噴出幾顆花粉光點
  function sparkleAt(el) {
    if (!el || reduceMotion) return;
    const r = el.getBoundingClientRect(), w = canvasWrap.getBoundingClientRect();
    const x = r.left + r.width / 2 - w.left, y = r.top + Math.min(40, r.height * .2) - w.top;
    const colors = ['#F1E3B8', '#FFFFFF', '#E8C5C8', '#C5D1C5'];
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2, d = 22 + Math.random() * 22, sz = 4 + Math.random() * 4, sp = document.createElement('span');
      sp.className = 'fx-spark';
      sp.style.cssText = `left:${x}px;top:${y}px;--dx:${(Math.cos(a) * d).toFixed(1)}px;--dy:${(Math.sin(a) * d).toFixed(1)}px;--r:${(Math.random() * 180) | 0}deg;--dl:0s;` +
        `width:${sz}px;height:${sz}px;border-radius:999px;background:${colors[i % 4]};border:1px solid #4A403A`;
      canvasWrap.appendChild(sp); setTimeout(() => sp.remove(), 800);
    }
  }
  // 完成特效：花瓣從訂製單上方落下
  function petalRain() {
    if (reduceMotion) return;
    const box = document.createElement('div'), colors = ['#E8C5C8', '#F1E3B8', '#FFFFFF', '#C5D1C5', '#E6D7C3', '#EFA9B0'];
    box.className = 'confetti';
    box.innerHTML = Array.from({ length: 34 }, (_, i) => {
      const sz = 9 + Math.random() * 9;
      return `<i style="left:${(Math.random() * 100).toFixed(1)}%;--d:${(2.6 + Math.random() * 2.4).toFixed(2)}s;--dl:${(Math.random() * 1.4).toFixed(2)}s;--sx:${((Math.random() - .5) * 140) | 0}px;--r:${((Math.random() - .5) * 720) | 0}deg">` +
        `<svg width="${sz}" height="${sz * 1.25}" viewBox="0 0 16 20"><path d="M8 1 C 14 5, 15 12, 8 19 C 1 12, 2 5, 8 1 Z" fill="${colors[i % colors.length]}" stroke="#4A403A" stroke-width=".9"/></svg></i>`;
    }).join('');
    $('#receiptModal').appendChild(box); setTimeout(() => box.remove(), 6500);
  }

  /* ================= 初始化 ================= */
  if (HALLOWEEN) {
    state.tab = 'halloween'; state.activeMat = 'darkrose';
    $('#btnLucky').textContent = '🎃 萬聖幸運花束';
    setTimeout(() => toast('🎃 萬聖節限定上線：限定花材、包裝與萬聖夜背景'), 700);
  }
  renderScene(); renderWraps(); renderRibbon(); renderTag(); renderFlowers(); renderWorkspace(); fit();
  bindTilt(canvasWrap, mainTilt); syncModeUI();
  if (document.fonts) document.fonts.ready.then(syncModeUI);
})();
</script>
</body>
