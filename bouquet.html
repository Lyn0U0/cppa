<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>花語包花室</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Serif+TC:wght@500&family=Special+Elite&family=Noto+Sans+TC:wght@400&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#4A403A',
          paper: '#FAF7F2',
          milk: { DEFAULT: '#C8A98B', light: '#EADDCD', deep: '#A88B6E' },
          sage: { DEFAULT: '#9CAF88', dark: '#7D9471', light: '#DCE5D2' },
        },
        fontFamily: { hand: ['"LXGW WenKai TC"', '"Noto Serif TC"', 'serif'] },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100dvh; padding: 16px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-family: "LXGW WenKai TC", "Noto Serif TC", serif; color: #4A403A;
    background: radial-gradient(circle at 20% 15%, #F3ECE2 0, transparent 40%),
                radial-gradient(circle at 85% 80%, #E4EADB 0, transparent 45%), #E9E1D6;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  /* 米白紙張紋理 */
  .paper-tex {
    background-color: #FAF7F2;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .29 0 0 0 0 .25 0 0 0 0 .22 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .phone {
    position: relative; overflow: hidden; display: flex; flex-direction: column;
    width: 390px; height: min(844px, calc(100dvh - 32px));
    border-radius: 48px; border: 10px solid #3E3632;
    box-shadow: 0 30px 60px -20px rgba(74, 64, 58, .45), 0 0 0 2px #5A4F49, inset 0 0 0 1px rgba(255,255,255,.4);
  }
  @media (max-width: 480px) {
    body { padding: 0; }
    .phone { width: 100vw; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
  }

  /* ---------- 畫布與圖層 ---------- */
  .canvas-wrap { touch-action: none; background: radial-gradient(ellipse at 50% 45%, rgba(234,221,205,.55) 0, transparent 62%); }
  .stage { position: absolute; left: 50%; top: 50%; width: 360px; height: 480px; transform-origin: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  .layer { position: absolute; inset: 0; }
  .layer > svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .layer-back, .layer-tissue, .layer-front, .layer-ribbon, .layer-flowers { pointer-events: none; }
  .layer-front { transform-origin: 180px 340px; } /* 左右側翼以收腰中心為軸 */
  .layer-back { z-index: 1; } .layer-tissue { z-index: 2; } .layer-flowers { z-index: 3; } .layer-front { z-index: 4; }
  .layer-ribbon { z-index: 5; } .layer-card { z-index: 6; pointer-events: none; } .sel-layer { z-index: 7; pointer-events: none; }
  .stage.xray .layer-front { opacity: .4; }

  /* ---------- 2.5D 立體書（只在 3D 預覽／收據中啟用 preserve-3d，編輯模式維持平面） ---------- */
  .canvas-wrap, .pv-3d { perspective: 1000px; }
  .layer { transition: transform .5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity .25s ease; }
  .z-anim .flower { transition: transform .5s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .stage.is3d, .stage.is3d-out, .stage.is3d .layer-flowers, .stage.is3d-out .layer-flowers { transform-style: preserve-3d; }
  .stage.is3d .layer-back   { transform: translateZ(-40px); }
  .stage.is3d .layer-tissue { transform: translateZ(-20px); }
  /* 前包裝紙拆成左右側翼：中心在 Z 30，外緣往後彎，從兩側抱住花莖。
     角度刻意壓在 3.5°：外緣最深約 Z 21，仍在花材層（最高 Z 20）之前，
     不與花朵平面相交，避免瀏覽器切割相交平面時出現破洞 */
  .stage.is3d .fold-l { transform: translateZ(30px) rotateY(-3.5deg); }
  .stage.is3d .fold-r { transform: translateZ(30px) rotateY(3.5deg); }
  .stage.is3d .layer-ribbon { transform: translateZ(45px); }
  .stage.is3d .layer-card   { transform: translateZ(60px); }
  .stage.is3d .layer > svg, .stage.is3d .flower svg, .stage.is3d .card-el svg { filter: drop-shadow(0 8px 9px rgba(74, 64, 58, .2)); }
  .stage.is3d .layer-back > svg, .stage.is3d .layer-front > svg { filter: drop-shadow(0 15px 15px rgba(0, 0, 0, .15)) drop-shadow(0 3px 4px rgba(0, 0, 0, .1)); }
  .glare { opacity: 0; transition: opacity .5s; }
  .stage.is3d .glare { opacity: 1; }

  /* 飄落花瓣與微光 */
  .petals { position: absolute; inset: 0; pointer-events: none; display: none; transform-style: preserve-3d; }
  .stage.is3d .petals { display: block; }
  .petal { position: absolute; top: -34px; }
  .petal > i { display: block; animation: fall var(--d) linear var(--dl) infinite; }
  @keyframes fall {
    0%   { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
    8%   { opacity: var(--o); }
    25%  { transform: translate(var(--sw), 120px) rotate(95deg); }
    50%  { transform: translate(0, 250px) rotate(180deg); }
    75%  { transform: translate(calc(var(--sw) * -1), 380px) rotate(275deg); }
    92%  { opacity: var(--o); }
    100% { transform: translate(0, 520px) rotate(360deg); opacity: 0; }
  }
  .spark { width: 6px; height: 6px; border-radius: 999px; background: radial-gradient(circle, #FFFBEA 0 30%, rgba(246,215,140,.9) 45%, transparent 72%); box-shadow: 0 0 8px 2px rgba(246,222,160,.75); }

  /* 編輯 / 3D 切換膠囊 */
  .mode-ui .seg { display: flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.75); border: 1px solid rgba(74,64,58,.14);
    box-shadow: 0 6px 16px -8px rgba(74,64,58,.45); backdrop-filter: blur(6px); position: relative; }
  .mode-ui .seg button { position: relative; z-index: 1; padding: 5px 10px; border-radius: 999px; font-size: 12px; line-height: 1.2; color: rgba(74,64,58,.7); transition: color .25s; white-space: nowrap; }
  .mode-ui .seg button.on { color: #fff; }
  .mode-ui .seg .thumb { position: absolute; top: 3px; bottom: 3px; border-radius: 999px; background: #7D9471; box-shadow: 0 3px 8px -3px rgba(125,148,113,.9);
    transition: left .35s cubic-bezier(.3,1.3,.5,1), width .35s cubic-bezier(.3,1.3,.5,1); }
  .mode-ui .seg.is3d .thumb { background: linear-gradient(120deg, #C8A98B, #D9B98A 60%, #E7CBA0); }
  .gyro-btn { transition: opacity .25s, transform .25s; }
  .gyro-btn.hide { opacity: 0; transform: translateY(-6px); pointer-events: none; }
  .gyro-btn.on { background: #7D9471; color: #fff; border-color: transparent; }
  .tilt-hint { transition: opacity .4s; }
  .tilt-hint.hide { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .petal > i { animation: none; opacity: 0; } }

  /* ---------- 🔮 今日幸運花束 ---------- */
  .lucky-btn { position: relative; overflow: hidden; color: #5B4A5E; font-weight: 700;
    background: linear-gradient(115deg, #EFE3F5 0%, #FBE3DA 45%, #F6E6BE 100%); border: 1px solid rgba(201,166,120,.55);
    box-shadow: 0 6px 16px -8px rgba(176,128,150,.75), inset 0 1px 0 rgba(255,255,255,.8); }
  .lucky-btn::after { content: ""; position: absolute; inset: -40% -70%; pointer-events: none;
    background: linear-gradient(110deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%); animation: sheen 3.2s ease-in-out infinite; }
  .lucky-btn:active { transform: scale(.95); }
  .lucky-btn[disabled] { opacity: .7; }
  .magic { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .magic .glow { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 999px;
    background: radial-gradient(circle, rgba(255,248,226,.95) 0, rgba(246,214,190,.55) 35%, transparent 70%); animation: glow .75s ease-out forwards; }
  .magic .bp { position: absolute; left: 50%; top: 50%; animation: burst .7s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: var(--dl); opacity: 0; }
  @keyframes glow { 0% { transform: scale(.3); opacity: 0; } 35% { opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes burst { 0% { transform: translate(-50%, -50%) scale(.3) rotate(0deg); opacity: 0; } 15% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity: 0; } }
  .poof { animation: poof .45s ease-in forwards; transform-origin: 50% 100%; }
  @keyframes poof { to { transform: scale(.5) rotate(12deg); opacity: 0; } }
  .fortune { transition: opacity .45s ease, transform .5s cubic-bezier(.3,1.3,.5,1); }
  .fortune.hide { opacity: 0; transform: translateY(-10px) scale(.97); pointer-events: none; }
  .fortune-box { background: linear-gradient(135deg, #FBF5EA 0%, #F6EDF4 100%); border: 1px dashed rgba(168,139,110,.55); }
  @media (prefers-reduced-motion: reduce) { .lucky-btn::after, .magic .bp, .magic .glow { animation: none; opacity: 0; } }

  .flower { position: absolute; transform-origin: 50% 100%; pointer-events: none; will-change: transform; }
  .flower svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .flower svg * { pointer-events: visiblePainted; cursor: grab; }
  .flower.is-sel svg { filter: drop-shadow(0 6px 10px rgba(125, 148, 113, .45)); }
  .flip { width: 100%; height: 100%; transform-origin: 50% 100%; }
  .flip.on { transform: scaleX(-1); }
  .pop { width: 100%; height: 100%; transform-origin: 50% 100%; animation: pop .55s cubic-bezier(.3, 1.5, .5, 1) both; }
  @keyframes pop { from { transform: scale(.35) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .animate .flower { transition: left .6s cubic-bezier(.3,1.25,.5,1), top .6s cubic-bezier(.3,1.25,.5,1), transform .6s cubic-bezier(.3,1.25,.5,1); }
  .animate .flip { transition: transform .6s ease; }

  .sel-box { position: absolute; transform-origin: 50% 100%; border: 1.5px dashed #7D9471; border-radius: 18px;
    background: rgba(156, 175, 136, .07); box-shadow: 0 0 0 4px rgba(156, 175, 136, .12); pointer-events: none; display: none; }
  .sel-handle { position: absolute; right: -15px; bottom: -15px; width: 30px; height: 30px; border-radius: 999px;
    background: #fff; border: 1.5px solid #7D9471; box-shadow: 0 3px 8px rgba(74,64,58,.2);
    display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; cursor: grab; }

  /* ---------- 小卡（可拖曳） ---------- */
  .card-el { position: absolute; pointer-events: auto; cursor: grab; touch-action: none; transform-origin: 50% 0; }
  .card-el.dragging { cursor: grabbing; }
  .card-el > svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .ct { position: absolute; display: flex; flex-direction: column; justify-content: space-between; color: #4A403A; overflow: hidden; pointer-events: none; }
  .ct-to, .ct-from { font-size: calc(var(--fs) * 7.6px); line-height: 1.2; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ct-from { text-align: right; }
  .ct-msg { font-size: calc(var(--fs) * 9.2px); line-height: 1.32; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 3); overflow: hidden; }
  .font-hand { --fs: 1.06; font-family: "Caveat", "LXGW WenKai TC", cursive; }
  .font-serif { --fs: 1; font-family: "Cormorant Garamond", "Noto Serif TC", "Songti TC", serif; }
  .font-type { --fs: .94; font-family: "Special Elite", "Noto Sans TC", "Courier New", monospace; letter-spacing: .02em; }
  .fld { display: flex; align-items: center; gap: 6px; border-radius: 14px; border: 1px solid rgba(74,64,58,.15); background: rgba(255,255,255,.75); padding: 0 10px; }
  .fld > span { font-size: 11px; color: rgba(74,64,58,.55); white-space: nowrap; }
  .fld input, .fld textarea { flex: 1; min-width: 0; background: transparent; outline: none; font-size: 13.5px; padding: 6px 0; resize: none; }
  .fld:focus-within { border-color: #7D9471; box-shadow: 0 0 0 2px rgba(125,148,113,.2); }

  /* ---------- 空間背景與窗邊光影 ---------- */
  .scene { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; transition: background .5s; }
  .gobo { position: absolute; inset: -36px; z-index: 20; pointer-events: none; }
  .gobo > * { position: absolute; inset: 0; }
  .gobo .leafs { transform-origin: 92% 0; animation: sway 7s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg) translateX(6px); } }
  .ff { position: absolute; width: 4px; height: 4px; border-radius: 999px; background: #FFE9A8; box-shadow: 0 0 8px 3px rgba(255, 220, 130, .55);
    animation: ff var(--d) ease-in-out var(--dl) infinite alternate; }
  @keyframes ff { from { opacity: .12; transform: translate(0, 0); } to { opacity: 1; transform: translate(7px, -12px); } }
  .scene-dark .empty-hint { color: rgba(255, 248, 235, .7); }
  @media (prefers-reduced-motion: reduce) { .gobo .leafs, .ff { animation: none; } }

  /* ---------- 工作台 ---------- */
  .workspace { transition: transform .45s cubic-bezier(.4,0,.2,1), opacity .35s; }
  .finished .workspace { transform: translateY(105%); opacity: 0; pointer-events: none; }
  .finished .toolbar, .finished .sel-box { display: none !important; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  .mat-card { transition: transform .15s, box-shadow .2s, border-color .2s; }
  .mat-card:active { transform: scale(.95); }
  .dot { width: 16px; height: 16px; border-radius: 999px; border: 1.5px solid rgba(74,64,58,.55); transition: transform .15s; }
  .dot.on { box-shadow: 0 0 0 2px #FAF7F2, 0 0 0 3.5px #7D9471; transform: scale(1.1); }
  .mini-dot { width: 7px; height: 7px; border-radius: 999px; border: 1px solid rgba(74,64,58,.45); }
  .mat-card.is-active { border-color: #7D9471; box-shadow: 0 0 0 2px rgba(125,148,113,.3); }

  /* 色票列 */
  .swatch-bar { background: #F3ECE2; }
  .sw { width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid rgba(74,64,58,.6); flex-shrink: 0;
    background-image: radial-gradient(circle at 35% 30%, rgba(255,255,255,.7) 0 18%, transparent 40%); transition: transform .15s; }
  .sw.sm { width: 20px; height: 20px; }
  .sw.on { box-shadow: 0 0 0 2.5px #F3ECE2, 0 0 0 4.5px #7D9471; transform: scale(1.08); }
  .sw:active { transform: scale(.9); }

  /* 季節限定卡片 */
  .seasonal { position: relative; overflow: hidden; border: 1.5px solid #D6B583 !important;
    background: linear-gradient(160deg, #FFF9EF 0%, #F9EADB 55%, #FFF5E6 100%) !important; }
  .seasonal::after { content: ""; position: absolute; inset: -30% -60%; pointer-events: none;
    background: linear-gradient(110deg, transparent 42%, rgba(255,255,255,.85) 50%, transparent 58%);
    animation: sheen 3.8s ease-in-out infinite; }
  @keyframes sheen { 0%, 55% { transform: translateX(-45%); } 100% { transform: translateX(45%); } }
  .badge { font-size: 8.5px; line-height: 1; padding: 3px 4px; border-radius: 999px; white-space: nowrap;
    background: #FFFDF8; border: 1px solid #D6B583; color: #9A6F3F; letter-spacing: .02em; }
  .stamp { display: inline-block; font-size: 8.5px; letter-spacing: .12em; font-family: ui-monospace, Menlo, monospace; font-weight: 700;
    color: #B4535E; border: 1.5px solid #B4535E; border-radius: 4px; padding: 0 4px; line-height: 1.5; transform: rotate(-4deg); opacity: .88; vertical-align: 1px; margin-left: 4px; }
  @media (prefers-reduced-motion: reduce) { .seasonal::after { animation: none; opacity: 0; } .pop { animation: none; } }

  .toolbar { transition: opacity .2s, transform .25s cubic-bezier(.3,1.4,.5,1); }
  .toolbar.hide { opacity: 0; transform: translate(-50%, 16px) scale(.95); pointer-events: none; }

  /* ---------- 收據 ---------- */
  .modal { transition: opacity .3s; }
  .modal.hide { opacity: 0; pointer-events: none; }
  .modal .sheet { transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
  .modal.hide .sheet { transform: translateY(40px) scale(.96); }
  .polaroid { background: #FFFEFB; box-shadow: 0 14px 30px -10px rgba(74,64,58,.35), 0 0 0 1px rgba(74,64,58,.06); transform: rotate(-2deg); }
  .receipt { background: #FFFDF8; position: relative; box-shadow: 0 10px 24px -12px rgba(74,64,58,.35); }
  .receipt::before, .receipt::after { content: ""; position: absolute; left: 0; right: 0; height: 8px;
    background: conic-gradient(from -45deg at 50% 100%, #FFFDF8 90deg, transparent 0) 0 0 / 14px 8px repeat-x; }
  .receipt::before { top: -8px; }
  .receipt::after { bottom: -8px; transform: scaleY(-1); }
  .barcode { height: 34px; background: repeating-linear-gradient(90deg, #4A403A 0 2px, transparent 2px 4px, #4A403A 4px 5px, transparent 5px 8px, #4A403A 8px 11px, transparent 11px 12px); opacity: .85; }
  .toast { transition: opacity .25s, transform .25s; }
  .toast.hide { opacity: 0; transform: translate(-50%, -8px); }
</style>
</head>
<body>

<!-- 共用 SVG 定義：手繪抖動濾鏡、紙紋 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <path d="M0 3.5 H7" stroke="#4A403A" stroke-opacity=".07" stroke-width="1" />
    </pattern>
    <!-- 前層包裝紙的動態反光（由 JS 依傾斜角度更新） -->
    <linearGradient id="glare" gradientUnits="userSpaceOnUse" x1="40" y1="220" x2="320" y2="470">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop id="g1" offset=".32" stop-color="#fff" stop-opacity="0" />
      <stop id="g2" offset=".5" stop-color="#fff" stop-opacity=".3" />
      <stop id="g3" offset=".68" stop-color="#fff" stop-opacity="0" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <!-- 包裝紙內側陰影：後背紙越往收腰越深；左右側翼外緣（彎向後方）較暗 -->
    <radialGradient id="shadeBack" gradientUnits="userSpaceOnUse" cx="180" cy="330" r="240">
      <stop offset="0" stop-color="#2B1E14" stop-opacity=".3" /><stop offset=".55" stop-color="#2B1E14" stop-opacity=".08" /><stop offset="1" stop-color="#2B1E14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shadeL" gradientUnits="userSpaceOnUse" x1="36" y1="0" x2="190" y2="0">
      <stop offset="0" stop-color="#2B1E14" stop-opacity=".28" /><stop offset=".35" stop-color="#2B1E14" stop-opacity=".1" /><stop offset=".75" stop-color="#2B1E14" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shadeR" gradientUnits="userSpaceOnUse" x1="324" y1="0" x2="170" y2="0">
      <stop offset="0" stop-color="#2B1E14" stop-opacity=".28" /><stop offset=".35" stop-color="#2B1E14" stop-opacity=".1" /><stop offset=".75" stop-color="#2B1E14" stop-opacity="0" />
    </linearGradient>
    <!-- 牛皮紙橫紋與紙漿斑點 -->
    <pattern id="kraftTex" width="40" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <path d="M0 2.5 H14 M18 2.5 H40" stroke="#4A403A" stroke-opacity=".08" stroke-width=".9" />
    </pattern>
    <pattern id="speckle" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r=".9" fill="#5E4633" fill-opacity=".35" /><circle cx="22" cy="4" r=".6" fill="#5E4633" fill-opacity=".3" />
      <circle cx="14" cy="19" r="1.1" fill="#5E4633" fill-opacity=".25" /><circle cx="29" cy="25" r=".7" fill="#fff" fill-opacity=".5" />
      <circle cx="8" cy="29" r=".6" fill="#5E4633" fill-opacity=".35" /><circle cx="26" cy="14" r=".5" fill="#fff" fill-opacity=".45" />
    </pattern>
    <!-- 英文報紙段落 -->
    <pattern id="news" width="64" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <path d="M2 3 H19 M22 3 H30 M33 3 H48 M51 3 H62 M2 7 H11 M14 7 H32 M35 7 H43 M46 7 H62" stroke="#4A403A" stroke-opacity=".3" stroke-width="1.1" stroke-linecap="round" />
    </pattern>
    <!-- 網紗網格 -->
    <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0 L5 5 M5 0 L0 5" stroke="#4A403A" stroke-opacity=".16" stroke-width=".5" />
    </pattern>
    <pattern id="fiber" width="22" height="22" patternUnits="userSpaceOnUse">

<script>
(() => {
  /* ================= 繪圖工具 ================= */
  const INK = '#4A403A';
  const S = `stroke="${INK}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"`;
  const S1 = `stroke="${INK}" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"`;
  const stem = (d, c = '#86A074', w = 3.4) =>
    `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 2.2}" stroke-linecap="round"/>` +
    `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const leaf = (d, vein, fill = '#A5BA91') =>
    `<path d="${d}" fill="${fill}" ${S}/>` +
    (vein ? `<path d="${vein}" fill="none" stroke="${INK}" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>` : '');
  const line = (d, o = 1, w = 1.5) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"/>`;
  const shine = d => `<path d="${d}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round"/>`;
  const rng = seed => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const f1 = n => n.toFixed(1);

  const daisyHead = (cx, cy, r, c) => {
    let s = '';
    for (let i = 0; i < 12; i++) s += `<ellipse cx="${cx}" cy="${cy - r * 0.55}" rx="${r * 0.21}" ry="${r * 0.5}" transform="rotate(${i * 30 + 8} ${cx} ${cy})" fill="${c.p}" stroke="${INK}" stroke-width="1.2"/>`;
    return s + `<circle cx="${cx}" cy="${cy}" r="${r * 0.3}" fill="${c.c}" ${S}/><circle cx="${cx - r * 0.1}" cy="${cy - r * 0.1}" r="${r * 0.08}" fill="#fff" opacity=".7"/>`;
  };
  const cluster = (cx, cy, c, r = 4.6) => [[0, 0], [-7, 4], [7, 4], [-4, -6], [5, -6], [0, 9]].map(([dx, dy]) =>
    `<circle cx="${cx + dx}" cy="${cy + dy}" r="${r}" fill="${c.p}" ${S1}/><circle cx="${cx + dx - 1.4}" cy="${cy + dy - 1.6}" r="1.1" fill="#fff" opacity=".6"/><circle cx="${cx + dx}" cy="${cy + dy + r * .45}" r=".9" fill="${c.d}"/>`).join('');

  /* ================= 手繪花材 SVG（viewBox 0 0 120 300，花莖底部 = 旋轉支點） ================= */
  const DRAW = {
    rose: c =>
      stem('M60 298 C 57 240, 63 170, 60 92') +
      leaf('M60 212 C 72 194, 92 188, 104 194 C 96 210, 78 218, 60 212 Z', 'M62 211 C 76 204, 88 199, 100 195') +
      leaf('M60 166 C 48 151, 28 147, 16 153 C 24 169, 42 175, 60 166 Z', 'M58 165 C 46 158, 32 155, 20 154') +
      `<path d="M61 246 l7 -5 l-5 9z M59 135 l-7 -4 l5 8z" fill="${INK}"/>` +
      `<path d="M60 94 C 50 99, 40 99, 32 92 C 43 89, 52 88, 60 94 C 68 88, 77 89, 88 92 C 80 99, 70 99, 60 94 Z" fill="#8FA77E" ${S}/>` +
      `<path d="M26 56 C 22 30, 44 14, 62 16 C 84 17, 100 34, 96 58 C 93 80, 77 93, 60 93 C 41 93, 29 78, 26 56 Z" fill="${c.p}" ${S}/>` +
      `<path d="M38 52 C 39 35, 53 28, 65 30 C 79 32, 87 44, 84 57 C 80 50, 72 44, 62 44 C 50 44, 42 48, 38 52 Z" fill="${c.l}" ${S}/>` +
      `<path d="M48 54 C 48 44, 60 38, 69 44 C 77 50, 73 62, 62 63 C 55 63, 52 57, 57 53 C 60 51, 64 53, 63 56" fill="none" ${S}/>` +
      `<path d="M26 56 C 34 70, 46 77, 60 76 C 74 77, 88 70, 96 58 C 94 80, 78 94, 60 94 C 42 94, 28 80, 26 56 Z" fill="${c.d}" ${S}/>` +
      line('M31 47 C 37 62, 47 70, 57 72', .7) + line('M91 47 C 85 62, 75 70, 65 72', .7) + shine('M44 25 C 50 21, 58 20, 65 21'),

    tulip: c =>
      stem('M60 298 C 62 240, 58 170, 60 96') +
      leaf('M58 292 C 36 250, 28 200, 34 138 C 50 180, 60 230, 64 286 Z', 'M58 284 C 48 240, 40 200, 36 150') +
      leaf('M62 282 C 80 252, 90 222, 94 180 C 78 210, 66 240, 60 272 Z', 'M63 272 C 74 248, 84 220, 91 190') +
      `<path d="M34 42 C 34 22, 48 10, 60 6 C 72 10, 86 22, 86 42 C 87 70, 76 92, 60 94 C 44 92, 33 70, 34 42 Z" fill="${c.d}" ${S}/>` +
      `<path d="M60 94 C 46 82, 44 48, 60 14 C 76 48, 74 82, 60 94 Z" fill="${c.l}" ${S}/>` +
      `<path d="M60 97 C 40 97, 26 76, 28 30 C 44 40, 58 60, 60 97 Z" fill="${c.p}" ${S}/>` +
      `<path d="M60 97 C 80 97, 94 76, 92 30 C 76 40, 62 60, 60 97 Z" fill="${c.p}" ${S}/>` +
      line('M35 46 C 40 64, 48 80, 56 90', .45, 1.1) + line('M85 46 C 80 64, 72 80, 64 90', .45, 1.1) + shine('M33 40 C 34 52, 37 62, 41 70'),

    sunflower: c => {
      let s = stem('M60 298 C 58 236, 63 150, 60 76', '#86A074', 4.6) +
        leaf('M60 204 C 72 178, 102 172, 114 186 C 108 210, 80 220, 60 204 Z', 'M62 203 C 78 192, 94 186, 110 187') +
        leaf('M60 152 C 48 128, 18 122, 6 136 C 12 160, 40 168, 60 152 Z', 'M58 151 C 42 140, 26 136, 10 137');
      for (let i = 0; i < 16; i++) s += `<ellipse cx="60" cy="27" rx="7.6" ry="16.5" transform="rotate(${i * 22.5 + 11.25} 60 58)" fill="${c.d}" stroke="${INK}" stroke-width="1.4"/>`;
      for (let i = 0; i < 16; i++) s += `<ellipse cx="60" cy="29" rx="7" ry="15" transform="rotate(${i * 22.5} 60 58)" fill="${c.p}" stroke="${INK}" stroke-width="1.4"/>`;
      s += `<circle cx="60" cy="58" r="19" fill="#7A5236" ${S}/><circle cx="60" cy="58" r="13" fill="#5E3E28"/>`;
      for (let k = 1; k < 22; k++) { const r = 2.5 * Math.sqrt(k), a = k * 2.39996; s += `<circle cx="${f1(60 + r * Math.cos(a))}" cy="${f1(58 + r * Math.sin(a))}" r="1.15" fill="#D9A55B"/>`; }
      return s;
    },

    gerbera: c => {
      let s = stem('M60 298 C 61 236, 58 150, 60 70', '#8FA77E', 3.6) +
        line('M58 250 l-3 -2 M62 222 l3 -2 M58 190 l-3 -2 M62 160 l3 -2 M58 128 l-3 -2', .5, 1) +
        leaf('M60 296 C 46 280, 30 276, 20 282 C 30 294, 46 298, 60 296 Z', 'M58 295 C 46 289, 34 285, 24 283');
      for (let i = 0; i < 20; i++) s += `<ellipse cx="60" cy="25" rx="4.6" ry="17" transform="rotate(${i * 18 + 9} 60 55)" fill="${c.d}" stroke="${INK}" stroke-width="1.2"/>`;
      for (let i = 0; i < 20; i++) s += `<ellipse cx="60" cy="29" rx="4.2" ry="14.5" transform="rotate(${i * 18} 60 55)" fill="${c.p}" stroke="${INK}" stroke-width="1.2"/>`;
      s += `<circle cx="60" cy="55" r="13" fill="${c.c}" ${S}/><circle cx="60" cy="55" r="7.5" fill="#4E3A26" opacity=".85"/>`;
      for (let i = 0; i < 14; i++) { const a = i * Math.PI / 7; s += `<circle cx="${f1(60 + 10.3 * Math.cos(a))}" cy="${f1(55 + 10.3 * Math.sin(a))}" r="1" fill="#F6E7B0"/>`; }
      return s;
    },

    ranunculus: c => {
      let s = stem('M60 298 C 58 240, 62 170, 60 92', '#8FA77E', 3.2) +
        leaf('M60 196 C 70 184, 74 170, 92 168 C 88 178, 96 182, 88 190 C 80 198, 70 198, 60 196 Z', 'M62 195 C 72 188, 80 180, 88 172') +
        leaf('M60 150 C 50 138, 46 124, 28 122 C 32 132, 24 136, 32 144 C 40 152, 50 152, 60 150 Z', 'M58 149 C 48 142, 40 134, 32 126') +
        `<path d="M60 92 C 52 96, 44 96, 38 90 C 46 88, 54 88, 60 92 C 66 88, 74 88, 82 90 C 76 96, 68 96, 60 92 Z" fill="#8FA77E" ${S}/>` +
        `<circle cx="60" cy="56" r="36" fill="${c.d}" ${S}/>`;
      [31, 26, 21, 16, 11.5, 7.5].forEach((r, k) =>
        s += `<ellipse cx="60" cy="${f1(56 - (36 - r) * .38)}" rx="${r}" ry="${f1(r * .88)}" fill="${k % 2 ? c.l : c.p}" ${S1}/>`);
      return s + `<circle cx="60" cy="43.5" r="3.6" fill="#9CAF88" ${S1}/>` + shine('M36 34 C 42 28, 50 24, 58 23');
    },

    hydrangea: c => {
      let s = stem('M60 298 C 58 240, 62 160, 60 96', '#8FA77E', 4.2) +
        leaf('M60 132 C 74 106, 108 104, 116 122 C 108 146, 78 152, 60 132 Z', 'M62 131 C 78 120, 96 116, 112 120') +
        leaf('M60 140 C 46 116, 12 112, 4 128 C 12 152, 42 158, 60 140 Z', 'M58 139 C 42 128, 24 124, 8 126') +
        `<circle cx="60" cy="58" r="43" fill="${c.d}" ${S}/>`;
      for (let k = 0; k < 31; k++) {
        const r = 35 * Math.sqrt((k + .5) / 31), a = k * 2.39996, x = 60 + r * Math.cos(a), y = 58 + r * Math.sin(a) * .95;
        const fill = k % 3 === 0 ? c.l : c.p;
        s += `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${(k * 37) % 90})">` +
          [0, 90, 180, 270].map(d => `<path d="M0 0 C -5.5 -1.5, -5.5 -7.5, 0 -7 C 5.5 -7.5, 5.5 -1.5, 0 0 Z" transform="rotate(${d})" fill="${fill}" stroke="${INK}" stroke-width=".9" stroke-linejoin="round"/>`).join('') +
          `<circle r="1.3" fill="${INK}" opacity=".55"/></g>`;
      }
      return s;
    },

    peony: c => {
      let s = stem('M60 298 C 57 240, 63 170, 60 98', '#86A074', 3.8) +
        leaf('M60 200 C 70 186, 84 186, 100 172 C 98 190, 84 206, 60 200 Z', 'M62 199 C 74 192, 86 184, 96 176') +
        leaf('M60 158 C 50 144, 36 144, 18 132 C 22 150, 36 164, 60 158 Z', 'M58 157 C 46 150, 34 142, 22 136') +
        `<path d="M60 98 C 50 102, 40 102, 32 96 C 42 92, 52 92, 60 98 C 68 92, 78 92, 88 96 C 80 102, 70 102, 60 98 Z" fill="#8FA77E" ${S}/>`;
      for (let i = 0; i < 7; i++) { const a = (i / 7) * Math.PI * 2 + .3; s += `<ellipse cx="${f1(60 + 30 * Math.cos(a))}" cy="${f1(60 + 24 * Math.sin(a))}" rx="19" ry="16" transform="rotate(${f1(a * 57.3)} ${f1(60 + 30 * Math.cos(a))} ${f1(60 + 24 * Math.sin(a))})" fill="${c.d}" ${S}/>`; }
      for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; s += `<ellipse cx="${f1(60 + 15 * Math.cos(a))}" cy="${f1(58 + 12 * Math.sin(a))}" rx="15" ry="13" fill="${c.p}" ${S1}/>`; }
      s += `<path d="M42 58 C 40 42, 50 34, 56 40 C 58 32, 66 32, 68 40 C 74 34, 82 42, 78 58 C 72 68, 48 68, 42 58 Z" fill="${c.l}" ${S}/>` +
        line('M50 56 C 52 48, 56 46, 58 50', .6, 1.1) + line('M62 50 C 64 46, 69 46, 70 54', .6, 1.1) + line('M46 62 C 54 66, 66 66, 74 62', .5, 1.1);
      return s + shine('M28 46 C 32 36, 40 30, 48 28');
    },

    pinecone: () => {
      let s = stem('M60 298 C 58 230, 62 150, 60 76', '#8A6A4F', 3.4);
      const holly = 'M60 120 L66 111 L72 115 L78 105 L85 110 L92 101 L97 108 L106 104 C 102 114, 96 118, 90 120 L92 127 L84 125 L80 132 L74 127 L68 130 Z';
      s += `<path d="${holly}" fill="#5F7F5A" ${S}/><path d="${holly}" transform="translate(120 6) scale(-1 1)" fill="#6E8C66" ${S}/>` +
        line('M62 120 C 76 116, 90 112, 102 106', .5, 1) + line('M58 126 C 44 122, 30 118, 18 112', .5, 1) +
        `<ellipse cx="60" cy="52" rx="19" ry="28" fill="#6E4C31" ${S}/>`;
      for (let y = 30; y <= 76; y += 7) {
        const w = 19 * Math.sqrt(Math.max(0, 1 - ((y - 52) / 28) ** 2)) - 3, n = Math.max(2, Math.round((w * 2) / 8.5)), off = (y / 7) % 2 ? 2 : -2;
        for (let i = 0; i < n; i++) { const x = 60 - w + (2 * w * (i + .5)) / n + off; s += `<path d="M${f1(x - 5)} ${y} C ${f1(x - 5)} ${y + 7}, ${f1(x + 5)} ${y + 7}, ${f1(x + 5)} ${y} Z" fill="#A97C55" ${S1}/>`; }
      }
      [[56, 112], [64, 108], [61, 118], [69, 116]].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="5" fill="#B8403E" ${S1}/><circle cx="${x - 1.5}" cy="${y - 1.7}" r="1.3" fill="#fff" opacity=".7"/>`);
      return s;
    },

    chamomile: c =>
      stem('M60 298 C 60 240, 58 180, 60 132', '#8FA77E', 2.8) + stem('M60 156 C 52 124, 44 94, 40 66', '#8FA77E', 2.4) +
      stem('M60 146 C 70 114, 78 82, 80 52', '#8FA77E', 2.4) + stem('M60 134 C 60 120, 61 110, 62 102', '#8FA77E', 2.2) +
      leaf('M60 222 C 68 210, 82 207, 90 212 C 84 222, 72 226, 60 222 Z', 'M62 221 C 70 216, 80 213, 87 212') +
      leaf('M60 190 C 52 178, 38 175, 30 180 C 36 190, 48 194, 60 190 Z', 'M58 189 C 50 184, 40 181, 33 181') +
      daisyHead(40, 62, 22, c) + daisyHead(80, 48, 20, c) + daisyHead(62, 100, 16, c),

    babysbreath: c => {
      const R = rng(11);
      let s = stem('M60 298 C 60 230, 59 170, 60 132', '#8FA77E', 2.2);
      const tips = [[24, 62], [32, 36], [50, 20], [72, 22], [92, 36], [98, 62], [42, 78], [62, 50], [80, 78], [54, 100], [74, 104]];
      tips.forEach(([x, y]) => s += stem(`M60 134 Q ${f1((60 + x) / 2 + (x < 60 ? 6 : -6))} ${f1((134 + y) / 2 + 8)}, ${x} ${y}`, '#8FA77E', 1.1));
      tips.forEach(([x, y]) => {

  // 空間背景（畫布底層）＋ 窗邊光影遮罩（最上層、pointer-events: none）
  const NOISE = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .29 0 0 0 0 .25 0 0 0 0 .22 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")`;

  // 立體書景深：依疊放順序與種類給每朵花一個 Z 高度（嚴格遞增，確保 3D 排序與圖層順序一致）
  // 花材層維持在 Z 0 ~ 20：在內襯（-20）之前、左右側翼（30）之後，花頭從紙的懷抱中探出
  const Z_RANGE = { foliage: [0, 3], filler: [3, 7], base: [7, 10], main: [10, 17] }, Z_MAX = 20;
  function depthMap() {
    const list = state.flowers, n = list.length, z = {};
    const groups = {};
    list.forEach(f => (groups[MAT[f.type].slot] = groups[MAT[f.type].slot] || []).push(f));
    let prev = -Infinity;
    list.forEach((f, i) => {
      const slot = MAT[f.type].slot, g = groups[slot], k = g.indexOf(f), [a, b] = Z_RANGE[slot];
      let v = a + (b - a) * (g.length > 1 ? k / (g.length - 1) : .5);
      if (i === n - 1 && RANK[slot] >= RANK.base) v = Z_MAX; // 最前排焦點主花
      z[f.id] = prev = Math.max(v, prev + 1.2);
    });

    const vals = Object.values(z), lo = Math.min(...vals), hi = Math.max(...vals);

  /* ---------- 色票列 ---------- */
  // 色票作用對象：畫布上選取的花 > 剛放進花束的那朵 > 下一朵要加入的花
  function swatchTarget() {

  }
  function swatchBarHTML() {
    const k = state.activeMat, m = MAT[k], t = swatchTarget();

    const who = t ? (t.id === state.sel ? '套用到：畫布上選取的這朵' : '套用到：剛放進花束的這朵') : '設定下一朵加入的顏色';

          <div class="flex gap-1.5 shrink-0">${noColor ? '<span class="text-[10.5px] text-ink/45">極簡無襯紙</span>' : colors.map(c =>
            `<button data-act="wrapset" data-key="${cKey}" data-val="${c.id}" title="${c.n}" aria-label="${c.n}" class="sw sm ${w[cKey] === c.id ? 'on' : ''}" style="background-color:${c.c}"></button>`).join('')}</div>

        `<div class="grid gap-1.5" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">` + Object.entries(styles).map(([id, st]) => `

            <div class="h-[52px] w-full">${id === 'none' ? '<div class="h-full flex items-center justify-center text-[22px] opacity-40">∅</div>' : preview(id)}</div>
            <div class="text-[11.5px] font-bold mt-1 leading-tight">${st.short}</div>
            <div class="text-[8.5px] text-ink/45 leading-tight">${st.en}</div>
          </div>`).join('') + `</div>`;
    } else {
      const c = state.card, sub = state.cardSub;
      const subs = [['style', '🏷️ 卡片款式與位置', '5款造型'], ['text', '✍️ 文字與字體', '含靈感金句'], ['scene', '☀️ 背景與光影', '5款場景']];
      const subBar = `<div class="flex gap-1.5">${subs.map(([id, label, hint]) =>
        `<button data-act="csub" data-val="${id}" class="flex-1 min-w-0 rounded-xl px-1 py-1 text-[11.5px] leading-tight border transition ${sub === id ? 'bg-white border-sage-dark font-bold shadow-[0_0_0_2px_rgba(125,148,113,.25)]' : 'bg-white/50 border-ink/10 text-ink/70'}">${label}<span class="block text-[9px] font-normal opacity-60 mt-0.5">${hint}</span></button>`).join('')}</div>`;
      let head = '', body = '';
      if (sub === 'style') {

        head = `<div class="flex items-center justify-between gap-2 mt-1.5">
            <div class="min-w-0 text-[11px] leading-tight text-ink/65 truncate"><b class="text-ink">${st.name}</b>${c.style === 'none' ? '' : ` · ${toneOf(c.style).n}`}</div>
            <div class="flex items-center gap-1.5 shrink-0">${c.style === 'none' ? '' : st.tones.map(t =>

              `<button data-act="creset" class="ml-1 rounded-full border border-ink/15 bg-white/70 px-2 py-0.5 text-[10.5px]">↺ 歸位</button>`}</div>

        body = `<div class="grid grid-cols-5 gap-1.5">` + Object.entries(CARD_STYLES).map(([id, cs]) => `
            <div data-act="cstyle" data-val="${id}" class="${cardCls(c.style === id)}" role="button" aria-label="${cs.name}">
              <div class="h-[50px] w-full flex items-center justify-center pointer-events-none">${id === 'none' ? '<span class="text-[22px] opacity-40">∅</span>' :
                cardSVG(id, c.tones[id]).replace(/width="\d+" height="\d+"/, 'style="max-width:100%;max-height:100%"')}</div>
              <div class="text-[11px] font-bold mt-1 leading-tight">${cs.short}</div>
              <div class="text-[8.5px] text-ink/45 leading-tight">${cs.en}</div>
            </div>`).join('') + `</div>
          <p class="text-[10.5px] text-ink/50 mt-2">💡 在畫布上直接拖曳卡片：放上方花叢當插牌，放到收腰附近就變成吊牌。</p>`;
      } else if (sub === 'text') {
        body = `<div class="flex flex-col gap-1.5 mt-1.5">
            <div class="grid grid-cols-2 gap-1.5">
              <label class="fld"><span>To:</span><input id="cTo" data-field="to" maxlength="12" placeholder="收件人" value="${esc(c.to)}"></label>
              <label class="fld"><span>From:</span><input id="cFrom" data-field="sign" maxlength="12" placeholder="署名" value="${esc(c.sign)}"></label>
            </div>
            <label class="fld !items-start"><span class="pt-[7px]">Message</span><textarea id="cMsg" data-field="msg" maxlength="36" rows="2" placeholder="寫下想說的話…">${esc(c.msg)}</textarea></label>
            <div class="flex gap-1.5">${Object.entries(FONTS).map(([id, n]) =>
              `<button data-act="cfont" data-val="${id}" class="font-${id} flex-1 min-w-0 rounded-xl border px-1 py-1.5 text-[12px] leading-tight transition ${c.font === id ? 'bg-white border-sage-dark shadow-[0_0_0_2px_rgba(125,148,113,.25)]' : 'bg-white/50 border-ink/10'}">${n}<span class="block text-[10px] opacity-60">Aa 花</span></button>`).join('')}
              <button data-act="quote" class="lucky-btn shrink-0 rounded-xl px-2.5 text-[11.5px] leading-tight">✨ 靈感<br>金句</button>
            </div>
          </div>`;
      } else {
        const sc = SCENES[state.scene];
        head = `<div class="mt-1.5 text-[11px] text-ink/65"><b class="text-ink">${sc.emoji} ${sc.name}</b> · 背景＋窗邊光影，3D 傾斜時光斑會跟著位移</div>`;
        body = `<div class="grid grid-cols-5 gap-1.5">` + SCENE_ORDER.map(id => { const s2 = SCENES[id]; return `
            <div data-act="scene" data-val="${id}" class="${cardCls(state.scene === id)}" role="button" aria-label="${s2.name}">
              <div class="h-[50px] w-full rounded-lg relative overflow-hidden pointer-events-none border border-ink/10" style="background:${s2.bg.replace(/"/g, '&quot;')}">
                <div class="absolute inset-0 overflow-hidden" style="transform:scale(.5);transform-origin:0 0;width:200%;height:200%">${sceneDecor(s2)}</div>
                <span class="absolute right-1 bottom-0.5 text-[14px]">${s2.emoji}</span></div>

    }
  }

  /* ================= 行為 ================= */
  function slotFor(slot, i) {
    const list = SLOTS[slot], base = list[i % list.length], ring = Math.floor(i / list.length);
    const rot = base.a + (Math.random() - .5) * 5 + (ring ? (Math.random() < .5 ? -1 : 1) * (4 + ring * 2) : 0);
    const s = base.s * Math.max(.75, 1 - ring * .06) * (.97 + Math.random() * .06);
    return {
      x: PIVOT.x + Math.sin(rot * Math.PI / 180) * 8 + (Math.random() - .5) * 6,
      y: PIVOT.y + (Math.random() - .5) * 6, rot, scale: s,
    };
  }
  function addFlower(type) {
    const m = MAT[type];
    const idx = state.flowers.filter(f => MAT[f.type].slot === m.slot).length;
    const f = { id: 'f' + uidN++, type, color: state.curColor[type], flip: Math.random() < .5, ...slotFor(m.slot, idx) };
    // 依圖層排序插入：葉材在最後方、主花在最前方，新手更容易排出層次
    const at = state.flowers.findIndex(g => rankOf(g) > RANK[m.slot]);
    if (at < 0) state.flowers.push(f); else state.flowers.splice(at, 0, f);
    lastAdded = f.id; state.focus = f.id; state.activeMat = type;
    state.sel = null;
    renderFlowers(); renderWorkspace();
    toast(`${m.seasonal ? '★ ' : ''}${m.name}・${m.meaning}`);
  }
  function reshuffle() {
    if (!state.flowers.length) return toast('花束還是空的喔');
    Object.keys(SLOTS).forEach(slot =>
      shuffleArr(state.flowers.filter(f => MAT[f.type].slot === slot)).forEach((f, i) => Object.assign(f, slotFor(slot, i), { flip: Math.random() < .5, _r: Math.random() })));
    state.flowers.sort((a, b) => rankOf(a) - rankOf(b) || a._r - b._r);
    zMap = depthMap();
    layerFlowers.classList.add('animate');
    state.flowers.forEach(applyFlower);
    updateSel();
    setTimeout(() => layerFlowers.classList.remove('animate'), 700);
  }

  let toastT;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.remove('hide');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 1600);
  }

  /* ---------- 畫布縮放與座標 ---------- */
  function fit() {
    scale = Math.min(canvasWrap.clientWidth / 360, canvasWrap.clientHeight / 480);
    applyStageTilt();
  }
  const goboShift = t => `translate(${(t.y * 1.4).toFixed(1)}px, ${(-t.x * 1.2).toFixed(1)}px)`;
  function applyStageTilt() {
    const t = mainTilt;
    $('#gobo').style.transform = goboShift(t);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})` + (t.on || t.x || t.y ? ` rotateX(${t.x.toFixed(2)}deg) rotateY(${t.y.toFixed(2)}deg)` : '');
  }
  new ResizeObserver(fit).observe(canvasWrap);
  const toStage = e => { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; };

  /* ---------- 拖曳 / 旋轉縮放 ---------- */
  canvasWrap.addEventListener('pointerdown', e => {
    if (state.finished || state.mode3d || e.target.closest('#toolbar, .mode-ui, #btnLucky, #fortune')) return;
    const handle = e.target.closest('#handle');
    const fl = e.target.closest('.flower');
    if (handle && state.sel) {
      const f = get(state.sel), p = toStage(e);
      drag = { mode: 'rot', f, pid: e.pointerId, a0: Math.atan2(p.y - f.y, p.x - f.x), d0: Math.max(18, Math.hypot(p.x - f.x, p.y - f.y)), rot0: f.rot, s0: f.scale };
      stage.classList.add('xray');
      e.preventDefault();
    } else if (fl) {
      const f = get(fl.dataset.id), p = toStage(e);
      if (state.sel !== f.id) select(f.id);
      drag = { mode: 'move', f, pid: e.pointerId, px: p.x, py: p.y, x0: f.x, y0: f.y, moved: false };
      e.preventDefault();
    } else if (e.target.closest('#cardEl')) {
      const p = toStage(e);
      if (state.sel) select(null);
      drag = { mode: 'card', pid: e.pointerId, px: p.x, py: p.y, x0: state.card.x, y0: state.card.y, moved: false };
      e.preventDefault();
    } else if (state.sel) select(null);
  });
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const p = toStage(e), f = drag.f;
    if (drag.mode === 'card') {
      const dx = p.x - drag.px, dy = p.y - drag.py;
      if (!drag.moved) { if (Math.hypot(dx, dy) < 4) return; drag.moved = true; $('#cardEl').classList.add('dragging'); }
      state.card.x = clamp(drag.x0 + dx, -30, 330); state.card.y = clamp(drag.y0 + dy, -20, 440);
      return positionCard();
    }
    if (drag.mode === 'move') {
      const dx = p.x - drag.px, dy = p.y - drag.py;
      if (!drag.moved) { if (Math.hypot(dx, dy) < 3) return; drag.moved = true; stage.classList.add('xray'); }
      f.x = clamp(drag.x0 + dx, -30, 390);
      f.y = clamp(drag.y0 + dy, 140, 600);
    } else {
      f.rot = drag.rot0 + (Math.atan2(p.y - f.y, p.x - f.x) - drag.a0) * 180 / Math.PI;
      f.scale = clamp(drag.s0 * Math.hypot(p.x - f.x, p.y - f.y) / drag.d0, .45, 1.8);
    }
    applyFlower(f);
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null; stage.classList.remove('xray');
    if (d.mode === 'card') { $('#cardEl')?.classList.remove('dragging'); if (!d.moved && e.type === 'pointerup') openCardText(); }
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* ---------- 懸浮工具列 ---------- */
  toolbar.addEventListener('click', e => {
    const b = e.target.closest('[data-tool]'); const f = get(state.sel);
    if (!b || !f) return;
    const arr = state.flowers, i = arr.indexOf(f);
    switch (b.dataset.tool) {
      case 'fwd': if (i < arr.length - 1) { [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]]; } else toast('已經在最前面了'); break;
      case 'back': if (i > 0) { [arr[i], arr[i - 1]] = [arr[i - 1], arr[i]]; } else toast('已經在最後面了'); break;
      case 'flip': f.flip = !f.flip; break;
      case 'dup': {
        const c = { ...f, id: 'f' + uidN++, x: f.x + 16, rot: f.rot + 8 };
        arr.splice(i + 1, 0, c); lastAdded = c.id; state.sel = c.id; renderFlowers(); return;
      }
      case 'del': arr.splice(i, 1); state.sel = null; renderFlowers(); renderWorkspace(); return;
    }
    arr.forEach(applyFlower);
  });

  /* ---------- 工作台事件 ---------- */
  $('#workspace').addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const { act, val } = t.dataset;
    if (act === 'tab') state.tab = val;
    else if (act === 'add') return addFlower(val);
    else if (act === 'color') {
      const k = state.activeMat, tgt = swatchTarget();
      state.curColor[k] = +val;
      if (tgt) { tgt.color = +val; renderFlowers(); }
    } else if (act === 'wsub') state.wrapSub = val;
    else if (act === 'wrapset') {
      state.wrap[t.dataset.key] = val;
      if (t.dataset.key.startsWith('tie')) renderRibbon(); else renderWraps();
    }
    else if (act === 'csub') state.cardSub = val;
    else if (act === 'cstyle') setCardStyle(val);
    else if (act === 'ctone') { state.card.tones[state.card.style] = val; renderTag(); }
    else if (act === 'creset') { [state.card.x, state.card.y] = CARD_STYLES[state.card.style].def; positionCard(); return; }
    else if (act === 'cfont') { state.card.font = val; renderTag(); }
    else if (act === 'quote') {
      state.card.msg = QUOTES[quoteIdx++ % QUOTES.length];
      ensureCardVisible(); renderTag();
      const m = $('#cMsg'); if (m) m.value = state.card.msg;
      return;
    } else if (act === 'scene') { state.scene = val; renderScene(); }
    renderWorkspace();
  });

  /* ---------- 小卡文字（工作台內直接輸入） ---------- */
  function ensureCardVisible() {
    if (state.card.style !== 'none') return;
    setCardStyle('tag'); toast('已顯示毛邊吊牌小卡');
  }
  $('#workspace').addEventListener('input', e => {
    const f = e.target.dataset.field; if (!f) return;
    state.card[f] = e.target.value;
    ensureCardVisible(); renderTag();
  });
  function openCardText() {
    state.tab = 'card'; state.cardSub = 'text'; renderWorkspace();
    setTimeout(() => $('#cMsg')?.focus(), 60);
  }

  /* ---------- 頂部列 ---------- */
  $('#btnClear').onclick = () => {
    if (!state.flowers.length) return toast('花束已經是空的');
    state.flowers = []; state.sel = null; state.focus = null; state.fortune = null; hideFortune();
    renderFlowers(); renderWorkspace(); toast('已清空，重新開始吧');
  };
  $('#btnShuffle').onclick = reshuffle;
  $('#btnDone').onclick = finish;

  /* ---------- 完成：花語收據 ---------- */
  function finish() {
    if (!state.flowers.length) return toast('先放幾朵花進花束吧 🌷');
    state.finished = true; select(null);
    app.classList.add('finished');
    buildReceipt();
    setTimeout(() => $('#receiptModal').classList.remove('hide'), 200);
  }
  function backToEdit() {
    $('#receiptModal').classList.add('hide');
    if (pvTilt) pvTilt.on = false;
    pvTilt = null;
    state.finished = false; app.classList.remove('finished');
  }
  function buildReceipt() {
    const now = new Date(), pad = n => String(n).padStart(2, '0');
    const date = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())}`;
    const week = '日一二三四五六'[now.getDay()];
    const counts = {};
    state.flowers.forEach(f => (counts[f.type] = (counts[f.type] || 0) + 1));
    const used = Object.keys(MAT).filter(k => counts[k]);
    const q = k => `「${MAT[k].meaning}」`;
    const by = fn => used.filter(k => fn(MAT[k]));
    const mains = by(m => m.tab === 'main' && !m.seasonal), fills = by(m => m.tab === 'filler'), leaves = by(m => m.tab === 'foliage'), seasonal = by(m => m.seasonal);
    const parts = [];
    if (mains.length) parts.push(`藏著${mains.map(q).join('、')}`);
    if (fills.length) parts.push(`再添上${fills.map(q).join('與')}悄悄陪著`);
    if (leaves.length) parts.push(`以${leaves.map(q).join('、')}溫柔襯底`);
    let poem = parts.length ? `這束花裡，${parts.join('；')}。` : '';
    if (seasonal.length) poem += `還有季節限定的${seasonal.map(k => MAT[k].name).join('與')}，替此刻記下${seasonal.map(q).join('、')}。`;

    for (let k = 0; k < nF; k++) { const t = fk[k % fk.length]; place(t, th.fillers[t]); }
    // 三明治包裝
    const [outer, outerColor] = pick(th.outer), [tissue, tissueColor] = pick(th.tissue), [tie, tieColor] = pick(th.tie);
    state.wrap = { outer, outerColor, tissue, tissueColor, tie, tieColor };
    // 小卡自動填上主題短句，並換上最適合的卡片、字體與光影背景
    state.card.msg = th.card; state.card.font = th.font; state.card.tones[th.cardStyle] = th.cardTone;
    state.card.style = th.cardStyle; [state.card.x, state.card.y] = CARD_STYLES[th.cardStyle].def;
    state.scene = pick(th.scenes);
    state.fortune = th;
  }

  function magicBurst() {
    const box = document.createElement('div');
    box.className = 'magic';
    const colors = ['#F5C6CF', '#F6E2A6', '#FBF4EA', '#DCE5D2', '#E7D3EC', '#EFA9B0'];
    let h = '<div class="glow"></div>';
    for (let i = 0; i < 22; i++) {
      const a = (i / 22) * Math.PI * 2 + Math.random() * .3, dist = 90 + Math.random() * 110, spark = i % 3 === 0;
      const style = `--dx:${Math.round(Math.cos(a) * dist)}px;--dy:${Math.round(Math.sin(a) * dist)}px;--r:${rint(-200, 200)}deg;--dl:${(Math.random() * .12).toFixed(2)}s`;
      h += `<span class="bp" style="${style}">${spark ? '<span class="spark" style="display:block"></span>' :
        `<svg width="12" height="15" viewBox="0 0 16 20"><path d="M8 1 C 14 5, 15 12, 8 19 C 1 12, 2 5, 8 1 Z" fill="${colors[i % colors.length]}" stroke="${INK}" stroke-width=".9" stroke-opacity=".55"/></svg>`}</span>`;
    }
    box.innerHTML = h;
    canvasWrap.appendChild(box);
    setTimeout(() => box.remove(), 1000);
  }

  function showFortune(th) {
    $('#fortuneTitle').textContent = `${th.emoji} ${th.name}`;
    $('#fortuneText').textContent = th.fortune;
    $('#fortune').classList.remove('hide');
  }
  const hideFortune = () => $('#fortune').classList.add('hide');
  $('#fortuneClose').onclick = hideFortune;
  // 抽花時已自動把短句寫進小卡，這裡直接帶去編輯
  $('#fortuneToCard').onclick = () => { hideFortune(); openCardText(); };

  async function drawLucky() {
    if (luckyBusy || state.finished) return;
    luckyBusy = true; $('#btnLucky').disabled = true;
    select(null); hideFortune();
    magicBurst();
    layerFlowers.querySelectorAll('.flip').forEach(el => el.classList.add('poof'));
    await wait(600);
    const th = pickTheme();
    generateLucky(th);
    renderWraps(); renderRibbon(); renderTag(); renderScene();
    state.tab = 'main'; state.activeMat = state.flowers[state.flowers.length - 1].type;
    renderFlowers(); renderWorkspace();
    setMode(true);
    setTimeout(() => { showFortune(th); luckyBusy = false; $('#btnLucky').disabled = false; }, 650);
  }
  $('#btnLucky').onclick = drawLucky;

  /* ================= 初始化 ================= */
  renderScene(); renderWraps(); renderRibbon(); renderTag(); renderFlowers(); renderWorkspace(); buildPetals(); fit();
  bindTilt(canvasWrap, mainTilt); syncModeUI();
  if (document.fonts) document.fonts.ready.then(syncModeUI);
})();
</script>
</body>
</html>
