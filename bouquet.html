<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>花語包花室</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#333333',
          paper: '#F5F5F0',
          milk: { DEFAULT: '#55554F', light: '#DCDCD5', deep: '#6B6B63' },
          sage: { DEFAULT: '#9CAF88', dark: '#7D9471', light: '#DCE5D2' },
        },
        fontFamily: { ui: ['Inter', '"Helvetica Neue"', 'Helvetica', '"Noto Sans TC"', '"PingFang TC"', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100dvh; padding: 16px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-family: Inter, "Helvetica Neue", Helvetica, "Noto Sans TC", "PingFang TC", sans-serif; color: #333;
    background: #E0E0E0;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  /* 純淨平面底色（不使用紙紋） */
  .paper-tex { background: #F5F5F0; }
  .phone {
    position: relative; overflow: hidden; display: flex; flex-direction: column;
    width: 390px; height: min(844px, calc(100dvh - 32px));
    border-radius: 44px; border: 9px solid #2B2B2B;
    box-shadow: 0 24px 50px -24px rgba(0, 0, 0, .35);
  }
  @media (max-width: 480px) {
    body { padding: 0; }
    .phone { width: 100vw; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
  }

  /* ---------- 畫布與圖層 ---------- */
  .canvas-wrap { touch-action: none; }
  .stage { position: absolute; left: 50%; top: 50%; width: 360px; height: 480px; transform-origin: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  .layer { position: absolute; inset: 0; }
  .layer > svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .layer-back, .layer-tissue, .layer-front, .layer-ribbon, .layer-flowers { pointer-events: none; }
  .layer-front { transform-origin: 180px 340px; } /* 左右側翼以收腰中心為軸 */
  .layer-back { z-index: 1; } .layer-tissue { z-index: 2; } .layer-flowers { z-index: 3; } .layer-front { z-index: 4; }
  .layer-ribbon { z-index: 5; } .layer-card { z-index: 6; pointer-events: none; } .sel-layer { z-index: 7; pointer-events: none; }
  .stage.xray .layer-front { opacity: .4; }

  /* ---------- 微景深（圖鑑排列為主，只保留極輕微的前後層次） ---------- */
  .canvas-wrap, .pv-3d { perspective: 1400px; }
  .layer { transition: transform .5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity .25s ease; }
  .z-anim .flower { transition: transform .5s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .stage.is3d, .stage.is3d-out, .stage.is3d .layer-flowers, .stage.is3d-out .layer-flowers { transform-style: preserve-3d; }
  .stage.is3d .layer-back   { transform: translateZ(-12px); }
  .stage.is3d .layer-tissue { transform: translateZ(-6px); }
  .stage.is3d .layer-front  { transform: translateZ(9px); }
  .stage.is3d .layer-ribbon { transform: translateZ(13px); }
  .stage.is3d .layer-card   { transform: translateZ(18px); }
  .stage.is3d .layer-front > svg, .stage.is3d .card-el svg { filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .08)); }

  /* 編輯 / 3D 切換膠囊 */
  .mode-ui .seg { display: flex; padding: 3px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CFCFC8; position: relative; }
  .mode-ui .seg button { position: relative; z-index: 1; padding: 5px 10px; border-radius: 999px; font-size: 12px; line-height: 1.2; color: #666; transition: color .25s; white-space: nowrap; }
  .mode-ui .seg button.on { color: #fff; }
  .mode-ui .seg .thumb { position: absolute; top: 3px; bottom: 3px; border-radius: 999px; background: #55554F;
    transition: left .35s cubic-bezier(.3,1.3,.5,1), width .35s cubic-bezier(.3,1.3,.5,1); }
  .tilt-hint { transition: opacity .4s; }
  .tilt-hint.hide { opacity: 0; }

  /* ---------- 🔮 今日幸運花束 ---------- */
  .lucky-btn { color: #333; font-weight: 500; background: #FFFFFF; border: 1px solid #555; }
  .lucky-btn:active { transform: scale(.95); }
  .lucky-btn[disabled] { opacity: .7; }
  .magic { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .magic .glow { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 999px;
    border: 1px solid #555; background: rgba(255,255,255,.55); animation: glow .75s ease-out forwards; }
  .magic .bp { position: absolute; left: 50%; top: 50%; animation: burst .7s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: var(--dl); opacity: 0; }
  @keyframes glow { 0% { transform: scale(.3); opacity: 0; } 35% { opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes burst { 0% { transform: translate(-50%, -50%) scale(.3) rotate(0deg); opacity: 0; } 15% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity: 0; } }
  .poof { animation: poof .45s ease-in forwards; transform-origin: 50% 100%; }
  @keyframes poof { to { transform: scale(.5) rotate(12deg); opacity: 0; } }
  .fortune { transition: opacity .45s ease, transform .5s cubic-bezier(.3,1.3,.5,1); }
  .fortune.hide { opacity: 0; transform: translateY(-10px) scale(.97); pointer-events: none; }
  .fortune-box { background: #F4F4EF; border: 1px solid #DADAD3; }
  @media (prefers-reduced-motion: reduce) { .magic .bp, .magic .glow { animation: none; opacity: 0; } }

  .flower { position: absolute; transform-origin: 50% 100%; pointer-events: none; will-change: transform; }
  .flower svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .flower svg * { pointer-events: visiblePainted; cursor: grab; }
  .flower.is-sel svg { filter: drop-shadow(0 0 0.5px #555); }
  .flip { width: 100%; height: 100%; transform-origin: 50% 100%; }
  .flip.on { transform: scaleX(-1); }
  .pop { width: 100%; height: 100%; transform-origin: 50% 100%; animation: pop .55s cubic-bezier(.3, 1.5, .5, 1) both; }
  @keyframes pop { from { transform: scale(.35) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .animate .flower { transition: left .6s cubic-bezier(.3,1.25,.5,1), top .6s cubic-bezier(.3,1.25,.5,1), transform .6s cubic-bezier(.3,1.25,.5,1); }
  .animate .flip { transition: transform .6s ease; }

  .sel-box { position: absolute; transform-origin: 50% 100%; border: 1px dashed #555; border-radius: 4px; pointer-events: none; display: none; }
  .sel-handle { position: absolute; right: -15px; bottom: -15px; width: 30px; height: 30px; border-radius: 999px;
    background: #fff; border: 1px solid #555;
    display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; cursor: grab; }

  /* ---------- 小卡（可拖曳） ---------- */
  .card-el { position: absolute; pointer-events: auto; cursor: grab; touch-action: none; transform-origin: 50% 0; }
  .card-el.dragging { cursor: grabbing; }
  .card-el > svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .ct { position: absolute; display: flex; flex-direction: column; justify-content: space-between; color: #333; overflow: hidden; pointer-events: none;
    font-family: Inter, "Helvetica Neue", Helvetica, "Noto Sans TC", sans-serif; }
  .ct-to, .ct-from { font-size: 6.8px; line-height: 1.25; letter-spacing: .04em; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ct-from { text-align: right; }
  .ct-msg { font-size: 8.6px; line-height: 1.38; font-weight: 500; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 3); overflow: hidden; }
  .fld { display: flex; align-items: center; gap: 6px; border-radius: 10px; border: 1px solid #D5D5CE; background: #FFFFFF; padding: 0 10px; }
  .fld > span { font-size: 10.5px; letter-spacing: .04em; color: #888; white-space: nowrap; }
  .fld input, .fld textarea { flex: 1; min-width: 0; background: transparent; outline: none; font-size: 13.5px; padding: 6px 0; resize: none; }
  .fld:focus-within { border-color: #555; }

  /* ---------- 空間背景與窗邊光影 ---------- */
  .scene { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; transition: background .5s; }
  .gobo { position: absolute; inset: -36px; z-index: 20; pointer-events: none; }
  .gobo > * { position: absolute; inset: 0; }
  .dotty { position: absolute; width: 3px; height: 3px; border-radius: 999px; background: #E8E4D6; opacity: .55; }
  .scene-dark .empty-hint { color: rgba(255, 248, 235, .7); }

  /* ---------- 工作台 ---------- */
  .workspace { transition: transform .45s cubic-bezier(.4,0,.2,1), opacity .35s; }
  .finished .workspace { transform: translateY(105%); opacity: 0; pointer-events: none; }
  .finished .toolbar, .finished .sel-box { display: none !important; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  .mat-card { transition: transform .15s, box-shadow .2s, border-color .2s; }
  .mat-card:active { transform: scale(.95); }
  .mini-dot { width: 7px; height: 7px; border-radius: 999px; border: 1px solid #555; }
  .mat-card.is-active { border-color: #555 !important; }

  /* 色票列 */
  .swatch-bar { background: #EDEDE8; }
  .sw { width: 24px; height: 24px; border-radius: 999px; border: 1px solid #555; flex-shrink: 0; transition: transform .15s; }
  .sw.sm { width: 20px; height: 20px; }
  .sw.on { box-shadow: 0 0 0 2px #EDEDE8, 0 0 0 3px #555; }
  .sw:active { transform: scale(.9); }

  /* 季節限定卡片 */
  .seasonal { border-color: #555 !important; background: #FFFFFF !important; }
  .badge { font-size: 8px; line-height: 1; padding: 3px 5px; border-radius: 3px; white-space: nowrap; letter-spacing: .08em;
    background: #333; color: #F5F5F0; }
  .stamp { display: inline-block; font-size: 8.5px; letter-spacing: .12em; font-weight: 600; color: #555; border: 1px solid #555;
    border-radius: 3px; padding: 0 4px; line-height: 1.6; vertical-align: 1px; margin-left: 6px; }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

  .toolbar { transition: opacity .2s, transform .25s cubic-bezier(.3,1.4,.5,1); }
  .toolbar.hide { opacity: 0; transform: translate(-50%, 16px) scale(.95); pointer-events: none; }

  /* ---------- 收據 ---------- */
  .modal { transition: opacity .3s; }
  .modal.hide { opacity: 0; pointer-events: none; }
  .modal .sheet { transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
  .modal.hide .sheet { transform: translateY(40px) scale(.96); }
  .order { background: #FFFFFF; border: 1px solid #D5D5CE; }
  .order h4 { font-size: 10px; letter-spacing: .18em; color: #888; font-weight: 500; margin: 0 0 6px; }
  .order .sec { padding: 14px 20px; border-top: 1px solid #ECECE6; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .toast { transition: opacity .25s, transform .25s; }
  .toast.hide { opacity: 0; transform: translate(-50%, -8px); }
</style>
</head>
<body>

<!-- 共用 SVG 定義：內襯印刷紋樣 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 英文報紙段落 -->
    <pattern id="news" width="64" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <path d="M2 3 H19 M22 3 H30 M33 3 H48 M51 3 H62 M2 7 H11 M14 7 H32 M35 7 H43 M46 7 H62" stroke="#4A403A" stroke-opacity=".3" stroke-width="1.1" stroke-linecap="round" />
    </pattern>
    <!-- 網紗網格 -->
    <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0 L5 5 M5 0 L0 5" stroke="#4A403A" stroke-opacity=".16" stroke-width=".5" />
    </pattern>
    <pattern id="fiber" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M2 5 q4 -3 8 0 M12 16 q3 2 7 -1 M4 18 q2 -2 3 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1" />
    </pattern>
  </defs>
</svg>

<div id="app" class="phone paper-tex font-ui">

  <!-- 1. 頂部列 8% -->
  <header class="h-[8%] shrink-0 flex items-center justify-between px-4 pt-1 relative z-20">
    <div class="flex gap-2">
      <button id="btnClear" class="flex items-center gap-1 rounded-full border border-[#CFCFC8] bg-white px-3 py-1.5 text-[12.5px] active:scale-95 transition">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>清空
      </button>
      <button id="btnShuffle" class="flex items-center gap-1 rounded-full border border-[#CFCFC8] bg-white px-3 py-1.5 text-[12.5px] active:scale-95 transition">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>隨機重排
      </button>
    </div>
    <button id="btnDone" class="rounded-full bg-[#333] text-white px-4 py-2 text-[13.5px] font-medium active:scale-95 transition">完成包裝</button>
  </header>

  <!-- 2. 中央畫布 57% -->
  <main id="canvasWrap" class="canvas-wrap h-[57%] shrink-0 relative overflow-hidden">
    <div id="scene" class="scene"></div>
    <div id="stage" class="stage">
      <div class="layer layer-back" id="layerBack"></div>
      <div class="layer layer-tissue" id="layerTissue"></div>
      <div class="layer layer-flowers" id="layerFlowers"></div>
      <div class="layer layer-front fold-l" id="foldL"></div>
      <div class="layer layer-front fold-r" id="foldR"></div>
      <div class="layer layer-ribbon" id="layerRibbon"></div>
      <div class="layer layer-card" id="layerCard"></div>
      <div class="layer sel-layer">
        <div id="selBox" class="sel-box">
          <div id="handle" class="sel-handle" title="拖曳旋轉／縮放">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          </div>
        </div>
      </div>
      <div class="empty-hint absolute left-0 right-0 top-[118px] text-center text-[13.5px] text-[#888] pointer-events-none z-[5] leading-relaxed" id="emptyHint">
        點選下方花材<br/>花朵會自動排成對稱的倒三角花束
      </div>
    </div>

    <div id="gobo" class="gobo" aria-hidden="true"></div>

    <!-- 🔮 今日幸運花束 -->
    <button id="btnLucky" class="lucky-btn absolute top-2 left-3 z-30 rounded-full px-3 py-[7px] text-[12px] leading-tight transition">✦ 今日幸運花束</button>
    <div id="fortune" class="fortune hide absolute left-3 right-3 top-[48px] z-[35] rounded-xl bg-white border border-[#D5D5CE] px-3 py-2" role="status" aria-live="polite">
      <div class="flex items-center gap-2">
        <div class="min-w-0 flex-1">
          <div class="text-[9.5px] tracking-[.18em] text-[#888] leading-tight">TODAY'S FORTUNE · 今日花籤</div>
          <div id="fortuneTitle" class="text-[13px] font-bold leading-tight mt-0.5 truncate"></div>
        </div>
        <button id="fortuneToCard" class="shrink-0 rounded-full border border-[#555] px-2.5 py-1 text-[11px] active:scale-95 transition">編輯小卡</button>
        <button id="fortuneClose" class="shrink-0 w-6 h-6 rounded-full text-ink/50 text-[16px] leading-none" aria-label="關閉花籤">×</button>
      </div>
      <p id="fortuneText" class="text-[11.5px] leading-[1.55] text-ink/80 mt-1"></p>
    </div>

    <!-- 編輯 / 3D 預覽切換 -->
    <div class="mode-ui absolute top-2 right-3 z-30 flex flex-col items-end gap-1.5 pointer-events-none">
      <div class="seg pointer-events-auto" id="modeSeg" role="tablist" aria-label="檢視模式">
        <span class="thumb" id="modeThumb"></span>
        <button data-mode="edit" class="on" role="tab">平面</button>
        <button data-mode="3d" role="tab">微景深</button>
      </div>
    </div>
    <div id="tiltHint" class="tilt-hint hide absolute left-1/2 -translate-x-1/2 bottom-3 z-30 rounded-full bg-white border border-[#D5D5CE] px-3 py-1.5 text-[11.5px] text-[#666] pointer-events-none whitespace-nowrap">
      拖曳可微微轉動視角
    </div>

    <!-- 懸浮微調工具列 -->
    <div id="toolbar" class="toolbar hide absolute left-1/2 -translate-x-1/2 bottom-3 z-30 flex items-center gap-0.5 rounded-full bg-white px-2 py-1.5 border border-[#CFCFC8]">
      <button data-tool="fwd" class="tb">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>往前</span></button>
      <button data-tool="back" class="tb">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span>往後</span></button>
      <button data-tool="flip" class="tb">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M8 7 3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg><span>翻轉</span></button>
      <button data-tool="dup" class="tb">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>複製</span></button>
      <button data-tool="del" class="tb text-[#B4535E]">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span>刪除</span></button>
    </div>
    <style>
      .tb { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; line-height: 1; transition: background .15s, transform .15s; }
      .tb:active { transform: scale(.9); background: #EDEDE8; }
      .tb svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </main>

  <!-- 3. 底部花藝工作台 35% -->
  <section id="workspace" class="workspace h-[35%] shrink-0 relative z-20 flex flex-col rounded-t-[24px] bg-[#EDEDE8] border-t border-[#DADAD3]">
    <div class="mx-auto mt-2 h-1 w-10 rounded-full bg-ink/15"></div>
    <nav id="tabs" class="no-scrollbar flex gap-1.5 overflow-x-auto px-3 pt-2 pb-1.5 shrink-0"></nav>
    <div id="panel" class="no-scrollbar flex-1 overflow-y-auto px-3 pb-4"></div>
  </section>

  <!-- 提示 -->
  <div id="toast" class="toast hide absolute left-1/2 -translate-x-1/2 top-[calc(8%+50px)] z-[60] rounded-full bg-[#333] text-white text-[12.5px] px-4 py-2 pointer-events-none whitespace-nowrap"></div>

  <!-- 完成：拍立得 / 今日花語收據 -->
  <div id="receiptModal" class="modal hide absolute inset-0 z-[90] bg-[#E6E6E1] overflow-y-auto no-scrollbar">
    <div class="sheet min-h-full flex flex-col items-center px-6 pt-8 pb-8" id="receiptBody"></div>
  </div>
</div>

<script>
(() => {
  /* ================= 繪圖工具（極簡植物圖鑑：1px #555 線條＋平面色塊，無漸層） ================= */
  const INK = '#555555';
  const S = `stroke="${INK}" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"`;
  const LEAF = '#9CAF88', LEAF2 = '#B7C4A7', LEAF3 = '#7F9474';
  const f1 = n => (+n).toFixed(1);
  const rng = seed => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const line = (d, o = 1) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1" stroke-linecap="round" opacity="${o}"/>`;
  const C = (cx, cy, r, fill) => `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="${fill}" ${S}/>`;
  const dot = (cx, cy, r, fill) => `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="${fill}"/>`;
  const STEM = (top, bottom = 298) => line(`M60 ${bottom} L60 ${top}`);
  const at = (x, y, ang, d0 = 0) => `transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(ang)}) translate(0 ${f1(-d0)})"`;

  // 花瓣造型（本地座標：基部在原點、朝上延伸 len、半寬 w）
  const SHAPE = {
    point: (len, w) => `M0 0 C ${f1(w)} ${f1(-len * .35)}, ${f1(w * .55)} ${f1(-len * .85)}, 0 ${f1(-len)} C ${f1(-w * .55)} ${f1(-len * .85)}, ${f1(-w)} ${f1(-len * .35)}, 0 0 Z`,

  };
  const petal = (x, y, ang, d0, shape, len, w, fill, vein = 0) =>
    `<path d="${SHAPE[shape](len, w)}" ${at(x, y, ang, d0)} fill="${fill}" ${S}/>` +
    (vein ? `<path d="M0 ${f1(-len * .12)} L0 ${f1(-len * vein)}" ${at(x, y, ang, d0)} fill="none" stroke="${INK}" stroke-width="1" stroke-linecap="round" opacity=".3"/>` : '');
  // n 片花瓣等角度環繞 (cx, cy)
  const petals = (cx, cy, n, d0, shape, len, w, fill, off = 0, vein = 0) => {
    let s = '';
    for (let i = 0; i < n; i++) s += petal(cx, cy, off + (i * 360) / n, d0, shape, len, w, fill, vein);

  // 扇貝邊圓（重瓣花的一層花瓣）；bulge 越接近 .5 弧越飽滿（.5 = 半圓）
  const scallop = (cx, cy, r, n, fill, off = 0, bulge = .62) => {
    const pt = i => { const a = (off + i * 360 / n) * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
    const rr = 2 * r * Math.sin(Math.PI / n) * bulge;
    let d = `M${f1(pt(0)[0])} ${f1(pt(0)[1])}`;
    for (let i = 1; i <= n; i++) { const [x, y] = pt(i); d += ` A ${f1(rr)} ${f1(rr)} 0 0 1 ${f1(x)} ${f1(y)}`; }
    return `<path d="${d} Z" fill="${fill}" ${S}/>`;
  };

  const spiral = (cx, cy, r0, turns) => {
    let d = '';
    for (let k = 0; k <= 48; k++) { const t = k / 48, r = r0 * (1 - t) + .8, a = t * turns * 2 * Math.PI; d += `${k ? 'L' : 'M'}${f1(cx + r * Math.sin(a))} ${f1(cy - r * Math.cos(a))} `; }
    return line(d);

  const lens = (x, y, len, w, ang, fill) => {

  /* ================= 渲染 ================= */
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  /* ================= 小卡（Layer 5：長方形專業標籤牌）與空間背景 ================= */
  const CARD_TONES = [{ id: 'white', n: '純白', c: '#FFFFFF' }, { id: 'stone', n: '石灰', c: '#E8E8E2' }, { id: 'sage', n: '鼠尾草', c: '#DCE5D2' }];
  const CARD_STYLES = {
    label: { name: '植物學名標籤', short: '學名標籤', en: 'Specimen Label', w: 124, h: 70, def: [196, 372], box: [8, 19, 116, 64], lines: 3 },

  const QUOTES = [

  // 立體書景深：依疊放順序與種類給每朵花一個 Z 高度（嚴格遞增，確保 3D 排序與圖層順序一致）
  // 微景深：花材層只在 Z 0 ~ 6 之間，介於內襯（-6）與前包裝紙（9）之間
  const Z_RANGE = { foliage: [0, 1], filler: [1, 2], base: [2, 3], main: [3, 5] }, Z_MAX = 6;
  function depthMap() {
    const list = state.flowers, n = list.length, z = {};

    const vals = Object.values(z), lo = Math.min(...vals), hi = Math.max(...vals);

  /* ---------- 色票列 ---------- */

  /* ---------- 工作台 ---------- */
  function renderWorkspace() {
    $('#tabs').innerHTML = TABS.map(t =>
      `<button data-act="tab" data-val="${t.id}" class="shrink-0 rounded-full px-3 py-1.5 text-[12.5px] border transition ${state.tab === t.id ? 'bg-[#333] text-white border-[#333]' : 'bg-white text-[#555] border-[#D5D5CE]'}">${t.label}${t.count ? `<span class="ml-1 text-[10px] opacity-70">${t.count}</span>` : ''}</button>`).join('');

    const panel = $('#panel');
    const cardCls = on => `mat-card rounded-xl border bg-white p-1.5 flex flex-col items-center text-center cursor-pointer ${on ? 'is-active' : 'border-[#E0E0DA]'}`;
    const section = t => `<div class="text-[11px] tracking-[.15em] text-ink/55 mt-1 mb-1.5">${t}</div>`;

    if (FLOWER_TABS.includes(state.tab)) {
      if (MAT[state.activeMat].tab !== state.tab) state.activeMat = Object.keys(MAT).find(k => MAT[k].tab === state.tab);
      const items = Object.entries(MAT).filter(([, m]) => m.tab === state.tab);
      panel.innerHTML = swatchBarHTML() + `<div class="grid grid-cols-4 gap-2 pt-1.5">` + items.map(([k, m]) => `
        <div data-act="add" data-val="${k}" class="${cardCls(state.activeMat === k)} ${m.seasonal ? 'seasonal' : ''}" role="button" aria-label="加入${m.name}">
          ${m.seasonal ? `<span class="badge -mt-0.5 mb-0.5">${m.seasonal}</span>` : ''}
          <div class="${m.seasonal ? 'h-[40px]' : 'h-[50px]'} w-full flex items-center justify-center pointer-events-none relative z-[1]">${flowerSVG(k, state.curColor[k], m.thumb, 'height:100%;width:100%')}</div>
          <div class="text-[12px] font-medium mt-0.5 leading-tight">${m.name}</div><div class="text-[8px] tracking-[.06em] text-[#999] leading-tight uppercase truncate w-full">${m.en}</div>
          <div class="text-[9px] text-[#777] leading-[1.25] mt-0.5 line-clamp-2 min-h-[22px]">${m.meaning}</div>
          <div class="flex gap-[3px] mt-1 h-[7px] relative z-[1]">${m.colors.length > 1 ? m.colors.map(c => `<span class="mini-dot" style="background:${c.p}"></span>`).join('') : ''}</div>
        </div>`).join('') + `</div>`;
    } else if (state.tab === 'wrap') {
      const w = state.wrap, [, styles, colors, sKey, cKey, cols] = WRAP_SUBS[state.wrapSub];
      const subBar = `<div class="flex gap-1.5">${Object.entries(WRAP_SUBS).map(([id, [label, , , , , , hint]]) =>
        `<button data-act="wsub" data-val="${id}" class="flex-1 min-w-0 rounded-xl px-1 py-1 text-[12px] leading-tight border transition ${state.wrapSub === id ? 'bg-white border-[#555] font-medium' : 'bg-transparent border-[#D5D5CE] text-[#777]'}">${label}<span class="block text-[9px] font-normal opacity-60 mt-0.5">${hint}</span></button>`).join('')}</div>`;
      const noColor = sKey === 'tissue' && w.tissue === 'none';
      const curC = colorOf(colors, w[cKey]);
      const swRow = `<div class="flex items-center justify-between gap-2 mt-1.5">
          <div class="min-w-0 text-[11px] leading-tight text-ink/65 truncate"><b class="text-ink">${styles[w[sKey]].name}</b>${noColor ? '' : ` · ${curC.n}`}</div>
          <div class="flex gap-1.5 shrink-0">${noColor ? '<span class="text-[10.5px] text-ink/45">極簡無襯紙</span>' : colors.map(c =>
            `<button data-act="wrapset" data-key="${cKey}" data-val="${c.id}" title="${c.n}" aria-label="${c.n}" class="sw sm ${w[cKey] === c.id ? 'on' : ''}" style="background-color:${c.c}"></button>`).join('')}</div>
        </div>`;
      const stack = (parts, vb) => `<div class="relative w-full h-full pointer-events-none">${parts.map(svg => `<div class="absolute inset-0">${svg.replace('<svg viewBox', '<svg style="width:100%;height:100%" viewBox')}</div>`).join('')}</div>`;
      const preview = id => {
        const ww = { ...w, [sKey]: id };
        if (sKey === 'tie') return stack([frontWrapSVG(ww, '100 300 160 150'), tieSVG(ww, '100 300 160 150')]);
        return stack([backWrapSVG(ww, '0 14 360 466'), tissueSVG(ww, '0 14 360 466'), frontWrapSVG(ww, '0 14 360 466')]);
      };
      panel.innerHTML = `<div class="swatch-bar sticky top-0 z-10 -mx-3 px-3 pt-0.5 pb-2 mb-1.5 border-b border-[#DADAD3]">${subBar}${swRow}</div>` +
        `<div class="grid gap-1.5" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">` + Object.entries(styles).map(([id, st]) => `
          <div data-act="wrapset" data-key="${sKey}" data-val="${id}" class="${cardCls(w[sKey] === id)}" role="button" aria-label="${st.name}">
            <div class="h-[52px] w-full">${id === 'none' ? '<div class="h-full flex items-center justify-center text-[22px] opacity-40">∅</div>' : preview(id)}</div>
            <div class="text-[11px] font-medium mt-1 leading-tight">${st.short}</div>
            <div class="text-[8px] tracking-[.05em] text-[#999] leading-tight uppercase">${st.en}</div>
          </div>`).join('') + `</div>`;
    } else {
      const c = state.card, sub = state.cardSub;
      const subs = [['style', '標籤款式與位置', '3款標籤'], ['text', '標籤文字', '含靈感金句'], ['scene', '空間背景', '5款平面場景']];
      const subBar = `<div class="flex gap-1.5">${subs.map(([id, label, hint]) =>
        `<button data-act="csub" data-val="${id}" class="flex-1 min-w-0 rounded-xl px-1 py-1 text-[11.5px] leading-tight border transition ${sub === id ? 'bg-white border-[#555] font-medium' : 'bg-transparent border-[#D5D5CE] text-[#777]'}">${label}<span class="block text-[9px] font-normal opacity-60 mt-0.5">${hint}</span></button>`).join('')}</div>`;
      let head = '', body = '';
      if (sub === 'style') {
        const st = CARD_STYLES[c.style];
        head = `<div class="flex items-center justify-between gap-2 mt-1.5">
            <div class="min-w-0 text-[11px] leading-tight text-[#777] truncate"><b class="text-ink font-medium">${st.name}</b>${c.style === 'none' ? '' : ` · ${toneOf().n}`}</div>
            <div class="flex items-center gap-1.5 shrink-0">${c.style === 'none' ? '' : CARD_TONES.map(t =>
              `<button data-act="ctone" data-val="${t.id}" title="${t.n}" aria-label="${t.n}" class="sw sm ${c.tone === t.id ? 'on' : ''}" style="background-color:${t.c}"></button>`).join('') +
              `<button data-act="creset" class="ml-1 rounded-full border border-[#CFCFC8] bg-white px-2 py-0.5 text-[10.5px]">歸位</button>`}</div>
          </div>`;
        body = `<div class="grid grid-cols-4 gap-1.5">` + Object.entries(CARD_STYLES).map(([id, cs]) => `
            <div data-act="cstyle" data-val="${id}" class="${cardCls(c.style === id)}" role="button" aria-label="${cs.name}">
              <div class="h-[50px] w-full flex items-center justify-center pointer-events-none">${id === 'none' ? '<span class="text-[20px] text-[#AAA]">∅</span>' :
                cardSVG(id, c.tone).replace(/width="\d+" height="\d+"/, 'style="max-width:100%;max-height:100%"')}</div>
              <div class="text-[11px] font-medium mt-1 leading-tight">${cs.short}</div>
              <div class="text-[8px] tracking-[.05em] text-[#999] leading-tight uppercase">${cs.en}</div>
            </div>`).join('') + `</div>
          <p class="text-[10.5px] text-[#888] mt-2">在畫布上直接拖曳標籤：放上方當插牌，放到收腰附近會自動連線成吊牌。</p>`;
      } else if (sub === 'text') {
        body = `<div class="flex flex-col gap-1.5 mt-1.5">
            <div class="grid grid-cols-2 gap-1.5">
              <label class="fld"><span>TO</span><input id="cTo" data-field="to" maxlength="12" placeholder="收件人" value="${esc(c.to)}"></label>
              <label class="fld"><span>FROM</span><input id="cFrom" data-field="sign" maxlength="12" placeholder="署名" value="${esc(c.sign)}"></label>
            </div>
            <label class="fld !items-start"><span class="pt-[7px]">MESSAGE</span><textarea id="cMsg" data-field="msg" maxlength="36" rows="2" placeholder="寫下想說的話…">${esc(c.msg)}</textarea></label>
            <div class="flex items-center justify-between gap-2">
              <span class="text-[10.5px] text-[#888]">字體：Inter／Noto Sans TC（無襯線）</span>
              <button data-act="quote" class="lucky-btn shrink-0 rounded-full px-3 py-1.5 text-[11.5px]">✦ 隨機靈感金句</button>
            </div>
          </div>`;
      } else {
        const sc = SCENES[state.scene];
        head = `<div class="mt-1.5 text-[11px] text-[#777]"><b class="text-ink font-medium">${sc.name}</b> · 純色平面背景</div>`;
        body = `<div class="grid grid-cols-5 gap-1.5">` + SCENE_ORDER.map(id => { const s2 = SCENES[id]; return `
            <div data-act="scene" data-val="${id}" class="${cardCls(state.scene === id)}" role="button" aria-label="${s2.name}">
              <div class="h-[46px] w-full rounded-md relative overflow-hidden pointer-events-none border border-[#D5D5CE]" style="background:${s2.bg}">
                <div class="absolute inset-0 overflow-hidden">${sceneDecor(s2)}</div>
                <div class="absolute inset-0 overflow-hidden">${s2.gobo}</div></div>
              <div class="text-[11px] font-medium mt-1 leading-tight">${s2.short}</div>
            </div>`; }).join('') + `</div>`;
      }
      panel.innerHTML = `<div class="swatch-bar sticky top-0 z-10 -mx-3 px-3 pt-0.5 pb-2 mb-1.5 border-b border-[#DADAD3]">${subBar}${head}</div>` + body;
    }
  }

  /* ================= 行為 ================= */
  function slotFor(slot, i) {
    const list = SLOTS[slot], base = list[i % list.length], ring = Math.floor(i / list.length);
    const rot = base.a + Math.sign(base.a) * ring * 4;
    const s = Math.min(1.3, (base.s * Math.max(.78, 1 - ring * .07)) / Math.cos(rot * Math.PI / 180));
    return { x: PIVOT.x + Math.sin(rot * Math.PI / 180) * 8, y: PIVOT.y, rot, scale: s, flip: rot > 0 };
  }
  function addFlower(type) {
    const m = MAT[type];
    const idx = state.flowers.filter(f => MAT[f.type].slot === m.slot).length;
    const f = { id: 'f' + uidN++, type, color: state.curColor[type], ...slotFor(m.slot, idx) };
    // 依圖層排序插入：葉材在最後方、主花在最前方，新手更容易排出層次
    const at = state.flowers.findIndex(g => rankOf(g) > RANK[m.slot]);
    if (at < 0) state.flowers.push(f); else state.flowers.splice(at, 0, f);
    lastAdded = f.id; state.focus = f.id; state.activeMat = type;
    state.sel = null;
    renderFlowers(); renderWorkspace();
    toast(`${m.seasonal ? '★ ' : ''}${m.name}・${m.meaning}`);
  }
  function reshuffle() {
    if (!state.flowers.length) return toast('花束還是空的喔');
    Object.keys(SLOTS).forEach(slot =>
      shuffleArr(state.flowers.filter(f => MAT[f.type].slot === slot)).forEach((f, i) => Object.assign(f, slotFor(slot, i), { _r: Math.random() })));
    state.flowers.sort((a, b) => rankOf(a) - rankOf(b) || a._r - b._r);
    zMap = depthMap();
    layerFlowers.classList.add('animate');
    state.flowers.forEach(applyFlower);
    updateSel();
    setTimeout(() => layerFlowers.classList.remove('animate'), 700);
  }

  let toastT;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.remove('hide');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 1600);
  }

  /* ---------- 畫布縮放與座標 ---------- */
  function fit() {
    scale = Math.min(canvasWrap.clientWidth / 360, canvasWrap.clientHeight / 480);
    applyStageTilt();
  }
  const goboShift = t => `translate(${(t.y * 1.4).toFixed(1)}px, ${(-t.x * 1.2).toFixed(1)}px)`;
  function applyStageTilt() {
    const t = mainTilt;
    $('#gobo').style.transform = goboShift(t);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})` + (t.on || t.x || t.y ? ` rotateX(${t.x.toFixed(2)}deg) rotateY(${t.y.toFixed(2)}deg)` : '');
  }
  new ResizeObserver(fit).observe(canvasWrap);
  const toStage = e => { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; };

  /* ---------- 拖曳 / 旋轉縮放 ---------- */
  canvasWrap.addEventListener('pointerdown', e => {
    if (state.finished || state.mode3d || e.target.closest('#toolbar, .mode-ui, #btnLucky, #fortune')) return;
    const handle = e.target.closest('#handle');
    const fl = e.target.closest('.flower');
    if (handle && state.sel) {
      const f = get(state.sel), p = toStage(e);
      drag = { mode: 'rot', f, pid: e.pointerId, a0: Math.atan2(p.y - f.y, p.x - f.x), d0: Math.max(18, Math.hypot(p.x - f.x, p.y - f.y)), rot0: f.rot, s0: f.scale };
      stage.classList.add('xray');
      e.preventDefault();
    } else if (fl) {
      const f = get(fl.dataset.id), p = toStage(e);
      if (state.sel !== f.id) select(f.id);
      drag = { mode: 'move', f, pid: e.pointerId, px: p.x, py: p.y, x0: f.x, y0: f.y, moved: false };
      e.preventDefault();
    } else if (e.target.closest('#cardEl')) {
      const p = toStage(e);
      if (state.sel) select(null);
      drag = { mode: 'card', pid: e.pointerId, px: p.x, py: p.y, x0: state.card.x, y0: state.card.y, moved: false };
      e.preventDefault();
    } else if (state.sel) select(null);
  });
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const p = toStage(e), f = drag.f;
    if (drag.mode === 'card') {
      const dx = p.x - drag.px, dy = p.y - drag.py;
      if (!drag.moved) { if (Math.hypot(dx, dy) < 4) return; drag.moved = true; $('#cardEl').classList.add('dragging'); }
      state.card.x = clamp(drag.x0 + dx, -30, 330); state.card.y = clamp(drag.y0 + dy, -20, 440);
      return positionCard();
    }
    if (drag.mode === 'move') {
      const dx = p.x - drag.px, dy = p.y - drag.py;
      if (!drag.moved) { if (Math.hypot(dx, dy) < 3) return; drag.moved = true; stage.classList.add('xray'); }
      f.x = clamp(drag.x0 + dx, -30, 390);
      f.y = clamp(drag.y0 + dy, 140, 600);
    } else {
      f.rot = drag.rot0 + (Math.atan2(p.y - f.y, p.x - f.x) - drag.a0) * 180 / Math.PI;
      f.scale = clamp(drag.s0 * Math.hypot(p.x - f.x, p.y - f.y) / drag.d0, .45, 1.8);
    }
    applyFlower(f);
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null; stage.classList.remove('xray');
    if (d.mode === 'card') { $('#cardEl')?.classList.remove('dragging'); if (!d.moved && e.type === 'pointerup') openCardText(); }
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* ---------- 懸浮工具列 ---------- */
  toolbar.addEventListener('click', e => {
    const b = e.target.closest('[data-tool]'); const f = get(state.sel);
    if (!b || !f) return;
    const arr = state.flowers, i = arr.indexOf(f);
    switch (b.dataset.tool) {
      case 'fwd': if (i < arr.length - 1) { [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]]; } else toast('已經在最前面了'); break;
      case 'back': if (i > 0) { [arr[i], arr[i - 1]] = [arr[i - 1], arr[i]]; } else toast('已經在最後面了'); break;
      case 'flip': f.flip = !f.flip; break;
      case 'dup': {
        const c = { ...f, id: 'f' + uidN++, x: f.x + 16, rot: f.rot + 8 };
        arr.splice(i + 1, 0, c); lastAdded = c.id; state.sel = c.id; renderFlowers(); return;
      }
      case 'del': arr.splice(i, 1); state.sel = null; renderFlowers(); renderWorkspace(); return;
    }
    arr.forEach(applyFlower);
  });

  /* ---------- 工作台事件 ---------- */
  $('#workspace').addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const { act, val } = t.dataset;
    if (act === 'tab') state.tab = val;
    else if (act === 'add') return addFlower(val);
    else if (act === 'color') {
      const k = state.activeMat, tgt = swatchTarget();
      state.curColor[k] = +val;
      if (tgt) { tgt.color = +val; renderFlowers(); }
    } else if (act === 'wsub') state.wrapSub = val;
    else if (act === 'wrapset') {
      state.wrap[t.dataset.key] = val;
      if (t.dataset.key.startsWith('tie')) renderRibbon(); else renderWraps();
    }
    else if (act === 'csub') state.cardSub = val;
    else if (act === 'cstyle') setCardStyle(val);
    else if (act === 'ctone') { state.card.tone = val; renderTag(); }
    else if (act === 'creset') { [state.card.x, state.card.y] = CARD_STYLES[state.card.style].def; positionCard(); return; }
    else if (act === 'quote') {
      state.card.msg = QUOTES[quoteIdx++ % QUOTES.length];
      ensureCardVisible(); renderTag();
      const m = $('#cMsg'); if (m) m.value = state.card.msg;
      return;
    } else if (act === 'scene') { state.scene = val; renderScene(); }
    renderWorkspace();
  });

  /* ---------- 小卡文字（工作台內直接輸入） ---------- */
  function ensureCardVisible() {
    if (state.card.style !== 'none') return;
    setCardStyle('label'); toast('已顯示學名標籤');
  }
  $('#workspace').addEventListener('input', e => {
    const f = e.target.dataset.field; if (!f) return;
    state.card[f] = e.target.value;
    ensureCardVisible(); renderTag();
  });
  function openCardText() {
    state.tab = 'card'; state.cardSub = 'text'; renderWorkspace();
    setTimeout(() => $('#cMsg')?.focus(), 60);
  }

  /* ---------- 頂部列 ---------- */
  $('#btnClear').onclick = () => {
    if (!state.flowers.length) return toast('花束已經是空的');
    state.flowers = []; state.sel = null; state.focus = null; state.fortune = null; hideFortune();
    renderFlowers(); renderWorkspace(); toast('已清空，重新開始吧');
  };
  $('#btnShuffle').onclick = reshuffle;
  $('#btnDone').onclick = finish;

  /* ---------- 完成：花語收據 ---------- */
  function finish() {
    if (!state.flowers.length) return toast('先放幾朵花進花束吧 🌷');
    state.finished = true; select(null);
    app.classList.add('finished');
    buildReceipt();
    setTimeout(() => $('#receiptModal').classList.remove('hide'), 200);
  }
  function backToEdit() {
    $('#receiptModal').classList.add('hide');
    if (pvTilt) pvTilt.on = false;
    pvTilt = null;
    state.finished = false; app.classList.remove('finished');
  }
  function buildReceipt() {
    const now = new Date(), pad = n => String(n).padStart(2, '0');
    const date = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())}`;
    const week = '日一二三四五六'[now.getDay()];
    const counts = {};
    state.flowers.forEach(f => (counts[f.type] = (counts[f.type] || 0) + 1));
    const used = Object.keys(MAT).filter(k => counts[k]);
    const q = k => `「${MAT[k].meaning}」`;
    const by = fn => used.filter(k => fn(MAT[k]));
    const mains = by(m => m.tab === 'main' && !m.seasonal), fills = by(m => m.tab === 'filler'), leaves = by(m => m.tab === 'foliage'), seasonal = by(m => m.seasonal);
    const parts = [];
    if (mains.length) parts.push(`藏著${mains.map(q).join('、')}`);
    if (fills.length) parts.push(`再添上${fills.map(q).join('與')}悄悄陪著`);
    if (leaves.length) parts.push(`以${leaves.map(q).join('、')}溫柔襯底`);
    let poem = parts.length ? `這束花裡，${parts.join('；')}。` : '';
    if (seasonal.length) poem += `還有季節限定的${seasonal.map(k => MAT[k].name).join('與')}，替此刻記下${seasonal.map(q).join('、')}。`;
    poem += '願收下它的你，今天也被溫柔地偏愛著。';
    const total = state.flowers.length;
    const no = String(Math.floor(Math.random() * 900000) + 100000);
    const label = m => m.seasonal ? '限定' : { main: '主花', filler: '配花', foliage: '葉材' }[m.tab];
    const row = (l, r, sub = '') => `<div class="flex justify-between items-baseline gap-3 py-[3px] text-[12.5px]"><span class="min-w-0">${l}</span><span class="shrink-0 text-[#777] text-right">${r}</span></div>${sub ? `<div class="text-[10.5px] text-[#999] -mt-0.5 mb-1">${sub}</div>` : ''}`;
    const order = [...seasonal, ...mains, ...fills, ...leaves];
    const w = state.wrap, c = state.card;
    const recipe = `${OUTERS[w.outer].short} (${colorOf(OUTER_COLORS, w.outerColor).n}) + ${w.tissue === 'none' ? '無內襯' : `${TISSUES[w.tissue].short} (${colorOf(TISSUE_COLORS, w.tissueColor).n})`} + ${TIES[w.tie].short} (${colorOf(TIE_COLORS, w.tieColor).n})`;

    $('#receiptBody').innerHTML = `
      <div class="order w-[310px] rounded-2xl overflow-hidden text-ink">
        <div class="px-5 pt-5 pb-4 flex justify-between items-start">
          <div><div class="text-[10px] tracking-[.22em] text-[#888]">DIGITAL ORDER</div><div class="text-[19px] font-semibold mt-1">花束訂製單</div></div>
          <div class="mono text-right text-[10px] leading-[1.6] text-[#888]">#${no}<br>${date} (${week})</div>
        </div>
        <div class="px-5 pb-4"><div id="pv" class="relative overflow-hidden rounded-xl border border-[#E2E2DC] mx-auto" style="width:270px;height:300px"></div></div>
        <div class="sec"><h4>ITEMS · 花材 ${total} 枝</h4>
          ${order.map(k => row(`${MAT[k].name} <span class="text-[#999] text-[11px]">× ${counts[k]}</span>${MAT[k].seasonal ? '<span class="stamp">SEASONAL</span>' : ''}`, label(MAT[k]), MAT[k].meaning)).join('')}
        </div>
        <div class="sec"><h4>WRAP · 包裝</h4>
          ${row('外層主紙', `${OUTERS[w.outer].short} · ${colorOf(OUTER_COLORS, w.outerColor).n}`)}${row('內層襯紙', w.tissue === 'none' ? '無內襯' : `${TISSUES[w.tissue].short} · ${colorOf(TISSUE_COLORS, w.tissueColor).n}`)}${row('緞帶綁繩', `${TIES[w.tie].short} · ${colorOf(TIE_COLORS, w.tieColor).n}`)}${row('空間背景', SCENES[state.scene].name)}
        </div>
        ${c.style !== 'none' && c.msg ? `<div class="sec"><h4>NOTE · ${CARD_STYLES[c.style].short}</h4>
          ${c.to ? `<div class="text-[11px] tracking-[.06em] text-[#888]">TO　${esc(c.to)}</div>` : ''}
          <div class="text-[14px] leading-relaxed mt-1">${esc(c.msg)}</div>
          <div class="text-right text-[11px] tracking-[.06em] text-[#888] mt-1">FROM　${esc(c.sign)}</div></div>` : ''}
        <div class="sec"><h4>MEANING · 專屬花語</h4><p class="text-[12.5px] leading-[1.75] text-[#444]">${poem}</p></div>
        ${state.fortune ? `<div class="sec"><h4>TODAY'S FORTUNE · 今日花籤</h4>
          <div class="fortune-box rounded-lg px-3 py-2.5">
            <div class="text-[13px] font-medium">${state.fortune.name}</div>
            <div class="text-[9.5px] tracking-[.16em] text-[#999] mt-0.5">${state.fortune.en.toUpperCase()}</div>
            <p class="text-[12px] leading-relaxed text-[#555] mt-1.5">${state.fortune.fortune}</p>
          </div></div>` : ''}
        <div class="sec mono text-[10px] leading-relaxed text-[#888]">WRAP RECIPE: ${recipe}</div>
        <div class="sec flex justify-between text-[10px] tracking-[.16em] text-[#999]"><span>THANK YOU</span><span>謝謝你把心意包起來</span></div>
      </div>

      <button id="btnBack" class="mt-6 rounded-full border border-[#555] bg-white px-8 py-2.5 text-[14px] active:scale-95 transition">← 返回修改</button>`;

    // 成品照片：以平面圖鑑方式呈現（不傾斜）
    const clone = stage.cloneNode(true), pv = $('#pv');
    clone.querySelectorAll('.sel-layer, .empty-hint').forEach(n => n.remove());
    clone.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    clone.removeAttribute('id'); clone.classList.remove('xray', 'is3d', 'is3d-out');
    clone.querySelectorAll('.flower').forEach(el => { const f = get(el.dataset.id); el.style.transform = `rotate(${f.rot}deg) scale(${f.scale})`; });
    clone.style.cssText = 'left:50%;top:48%;transform:translate(-50%,-50%) scale(.66);pointer-events:none';
    const pvScene = $('#scene').cloneNode(true), pvGobo = $('#gobo').cloneNode(true);
    pvScene.removeAttribute('id'); pvGobo.removeAttribute('id'); pvGobo.style.transform = '';
    pv.append(pvScene, clone, pvGobo);
    $('#btnBack').onclick = backToEdit;
  }

  /* ================= 微景深預覽 ================= */
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const makeTilt = apply => ({ x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, on: false, hold: false, touching: false, apply });
  const mainTilt = makeTilt(() => applyStageTilt());
  let pvTilt = null, rafId = 0, outT = 0;
  const t0 = performance.now();

  // 微景深：滑鼠依游標位置、手指依拖曳距離，輕微傾斜（rotateX ±6°、rotateY ±9°）
  function bindTilt(el, t) {
    const move = e => {
      if (!t.on) return;
      if (e.pointerType === 'mouse') {
        const r = el.getBoundingClientRect();
        const nx = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1), ny = clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1, 1);
        t.tx = -ny * 6; t.ty = nx * 9;
      } else {
        if (!t.touching) return;
        t.ty = clamp(t.by + (e.clientX - t.sx) * .12, -9, 9);
        t.tx = clamp(t.bx - (e.clientY - t.sy) * .1, -6, 6);
      }
      t.hold = true; kick();
    };
    const release = () => { t.touching = false; t.hold = false; };
    el.addEventListener('pointerdown', e => {
      if (!t.on) return;
      t.touching = true;
      if (e.pointerType === 'mouse') return move(e);
      Object.assign(t, { sx: e.clientX, sy: e.clientY, bx: t.x, by: t.y, tx: t.x, ty: t.y, hold: true });
    });
    el.addEventListener('pointermove', move);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, release));
  }

  // 彈簧回正 + 呼吸般的待機搖擺
  function tick(now) {
    const time = (now - t0) / 1000;
    let active = false;
    [mainTilt, pvTilt].forEach(t => {
      if (!t) return;
      let tx = 0, ty = 0;
      if (t.on) {
        if (t.hold) { tx = t.tx; ty = t.ty; }
        else if (!reduceMotion) { tx = 1.2 * Math.sin(time * 1.1); ty = 2.5 * Math.sin(time * 0.7); }
      }
      t.vx = (t.vx + (tx - t.x) * 0.06) * 0.84;
      t.vy = (t.vy + (ty - t.y) * 0.06) * 0.84;
      t.x += t.vx; t.y += t.vy;
      const moving = Math.abs(t.x) + Math.abs(t.y) + Math.abs(t.vx) + Math.abs(t.vy) > 0.02;
      if (t.on || moving) active = true; else t.x = t.y = t.vx = t.vy = 0;
      t.apply();
    });
    rafId = active ? requestAnimationFrame(tick) : 0;
  }
  const kick = () => { if (!rafId) rafId = requestAnimationFrame(tick); };

  function setMode(on) {
    if (state.mode3d === on) return;
    if (on) select(null);
    state.mode3d = on;
    clearTimeout(outT);
    stage.classList.toggle('is3d', on);
    stage.classList.toggle('is3d-out', !on);
    if (!on) outT = setTimeout(() => stage.classList.remove('is3d-out'), 650);
    // DOM 順序對齊圖層順序，再於下一幀套上 Z 高度，讓花朵平滑「立起來」
    state.flowers.forEach(f => { const el = layerFlowers.querySelector(`[data-id="${f.id}"]`); if (el) layerFlowers.appendChild(el); });
    zMap = depthMap();
    requestAnimationFrame(() => {
      layerFlowers.classList.add('z-anim');
      state.flowers.forEach(applyFlower);
      setTimeout(() => layerFlowers.classList.remove('z-anim'), 600);
    });
    mainTilt.on = on; mainTilt.hold = false;
    kick(); syncModeUI();
    const hint = $('#tiltHint');
    hint.classList.toggle('hide', !on);
    if (on) setTimeout(() => hint.classList.add('hide'), 2800);
  }
  function syncModeUI() {
    const seg = $('#modeSeg'), thumb = $('#modeThumb');
    seg.classList.toggle('is3d', state.mode3d);
    seg.querySelectorAll('[data-mode]').forEach(b => {
      const on = (b.dataset.mode === '3d') === state.mode3d;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
      if (on) { thumb.style.left = b.offsetLeft + 'px'; thumb.style.width = b.offsetWidth + 'px'; }
    });
  }
  $('#modeSeg').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode === '3d'); });

  /* ================= 🔮 今日幸運花束（花藝師主題靈感庫 + 黃金結構插花） ================= */
  // 每個主題：主花 / 配花與果實（花材 → 可用色票名）、葉材、包裝組合 [款式, 色票]、籤詩
  const THEMES = [
    { id: 'sun', scenes: ['sun', 'paper'], cardStyle: 'hang', cardTone: 'white', emoji: '☀️', name: '晨間暖陽與元氣', en: 'Morning Sunshine',
      mains: { sunflower: ['陽光黃'], tulip: ['鵝黃', '鬱金香橘'], gerbera: ['暖陽橘', '奶油白'], rose: ['奶油黃'] },
      fillers: { chamomile: ['純白'], freesia: ['鵝黃', '奶白'], babysbreath: ['白'] },
      foliage: ['eucalyptus', 'olive', 'fern'],
      outer: [['craft', 'kraft'], ['craft', 'oat'], ['korean', 'oat']], tissue: [['news', 'apricot'], ['news', 'beige']], tie: [['jute', 'caramel'], ['jute', 'gold'], ['long', 'caramel']],
      fortune: '把生活調成喜歡的頻道，今天的你自帶溫暖光芒，好事正順著陽光向你走來。', card: '今天的你自帶溫暖光芒，好事正向你走來' },
    { id: 'romance', scenes: ['paper', 'grey'], cardStyle: 'label', cardTone: 'white', emoji: '🩰', name: '溫柔芭蕾與初戀', en: 'Soft Romance',
      mains: { rose: ['茱萸粉', '香檳白'], tulip: ['蜜桃粉'], ranunculus: ['藕粉'], gerbera: ['珊瑚粉'] },
      fillers: { babysbreath: ['淺粉', '白'], freesia: ['奶白'], lily: ['純白'] },
      foliage: ['eucalyptus', 'fern', 'olive'],
      outer: [['korean', 'pink'], ['korean', 'cream']], tissue: [['tulle', 'pink'], ['tulle', 'white']], tie: [['chiffon', 'rose'], ['chiffon', 'cream']],
      fortune: '允許自己偶爾慢下來，今天適合買杯喜歡的飲料，溫柔地偏愛自己一回。', card: '慢下來，溫柔地偏愛自己一回' },
    { id: 'forest', scenes: ['grey', 'sun'], cardStyle: 'label', cardTone: 'sage', emoji: '🌿', name: '森林微風與深呼吸', en: 'Forest Breeze',
      mains: { hydrangea: ['雪球白', '霧霾藍'], tulip: ['純白'], ranunculus: ['奶白'], rose: ['香檳白'], gerbera: ['奶油白'] },
      fillers: { lily: ['純白'], babysbreath: ['白'], chamomile: ['純白'], berries: ['青綠果實'] },
      foliage: ['eucalyptus', 'olive', 'fern'],
      outer: [['korean', 'sage'], ['korean', 'blue'], ['craft', 'sage'], ['cello', 'cream'], ['cello', 'sage']], tissue: [['tissue', 'white'], ['tissue', 'apricot']], tie: [['long', 'forest'], ['long', 'cream']],
      fortune: '那些困擾你的小事都會隨風散去，今天的幸運藏在一次深呼吸與放寬心裡。', card: '小事隨風散去，幸運藏在深呼吸裡' },
    { id: 'vintage', scenes: ['wood', 'midnight'], cardStyle: 'label', cardTone: 'stone', emoji: '🍷', name: '復古電影與微醺', en: 'Vintage Muse',
      mains: { rose: ['經典紅'], ranunculus: ['香檳杏'], sunflower: ['復古焦糖橘'], tulip: ['鬱金香橘'] },
      fillers: { berries: ['紅棕果實'], cotton: ['原色'], babysbreath: ['白'] },
      foliage: ['eucalyptus', 'olive', 'fern'],
      outer: [['korean', 'black'], ['cone', 'black'], ['craft', 'kraft'], ['cone', 'kraft']], tissue: [['news', 'beige']], tie: [['long', 'wine'], ['seal', 'wine']],
      fortune: '不必迎合所有人的期待，你獨特的靈魂與神秘感，就是今天最迷人的風景。', card: '你獨特的靈魂，就是今天最迷人的風景' },
    { id: 'miracle', scenes: ['midnight', 'paper'], cardStyle: 'stake', cardTone: 'white', emoji: '✨', name: '奇蹟降臨・季節限定特調', en: 'Seasonal Miracle', seasonal: true,
      mains: { rose: ['香檳白', '茱萸粉'], ranunculus: ['奶白', '藕粉'], tulip: ['純白'] },
      fillers: { babysbreath: ['白'], lily: ['純白'] },
      foliage: ['eucalyptus', 'fern', 'olive'],
      outer: [['korean', 'cream'], ['korean', 'oat']], tissue: [['tulle', 'white'], ['tissue', 'white']], tie: [['lace', 'gold']],
      fortune: '恭喜抽中隱藏版季節花束！今天會有意想不到的小確幸敲門，請準備好微笑收下。', card: '小確幸正在敲門，請微笑收下' },
  ];
  const pick = a => a[(Math.random() * a.length) | 0];
  const rint = (a, b) => a + ((Math.random() * (b - a + 1)) | 0);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let popIds = new Map(), luckyBusy = false;

  // 25% 觸發季節限定特調，其餘四個主題平均抽
  const pickTheme = () => Math.random() < .25 ? THEMES[4] : pick(THEMES.slice(0, 4));

  function generateLucky(th) {
    state.flowers = []; state.sel = null; state.focus = null; popIds = new Map();
    const counts = {};
    let order = 0;
    // slot 可另外指定（例如尤加利果實當配花），確保左右成對的位置不被打亂
    const place = (type, ci, slot = MAT[type].slot) => {
      const i = (counts[slot] = (counts[slot] ?? -1) + 1);
      const f = { id: 'f' + uidN++, type, color: ci, ...slotFor(slot, i) };
      const at = state.flowers.findIndex(g => rankOf(g) > RANK[MAT[type].slot]);
      if (at < 0) state.flowers.push(f); else state.flowers.splice(at, 0, f);
      popIds.set(f.id, order++ * 75);
    };
    const colorFor = (type, names) => { const m = MAT[type], want = pick(names || [m.colors[0].n]); return Math.max(0, m.colors.findIndex(c => c.n === want)); };
    const placePair = (type, names, slot) => { const ci = colorFor(type, names); place(type, ci, slot); place(type, ci, slot); };
    // 工整對稱的倒三角：每一層都是「同花材同顏色的左右一對」，可再加一支置中
    // Step 1｜後排打底：葉材一對（＋ 一半機率置中一支），共 2~3 支
    const fol = shuffleArr([...th.foliage]);
    placePair(fol[0], null, 'foliage');
    if (Math.random() < .5) place(fol[1], 0, 'foliage');
    // Step 2｜視覺核心：置中一朵＋左右一對，共 3 朵（季節限定特調必含 1~2 朵限定花材）
    const mk = shuffleArr(Object.keys(th.mains));
    let center = mk[0], side = mk[1] || mk[0], centerCols = th.mains[center], sideCols = th.mains[side];
    if (th.seasonal) {
      const m = new Date().getMonth() + 1, sp = m >= 3 && m <= 8 ? 'peony' : 'pinecone';
      if (Math.random() < .5) { center = sp; centerCols = null; } else { side = sp; sideCols = null; }
      if (sp === 'pinecone') th = { ...th, fillers: { ...th.fillers, berries: ['紅棕果實'], cotton: ['原色'] } };
    }
    place(center, colorFor(center, centerCols), 'main');
    placePair(side, sideCols, 'main');
    // Step 3｜空氣感點綴：配花一對（＋ 一半機率置中一支），共 2~3 支
    const fk = shuffleArr(Object.keys(th.fillers));
    placePair(fk[0], th.fillers[fk[0]], 'filler');
    if (Math.random() < .5) { const t = fk[1] || fk[0]; place(t, colorFor(t, th.fillers[t]), 'filler'); }
    // 三明治包裝
    const [outer, outerColor] = pick(th.outer), [tissue, tissueColor] = pick(th.tissue), [tie, tieColor] = pick(th.tie);
    state.wrap = { outer, outerColor, tissue, tissueColor, tie, tieColor };
    // 標籤自動填上主題短句，並換上最適合的標籤與背景
    state.card.msg = th.card; state.card.tone = th.cardTone;
    state.card.style = th.cardStyle; [state.card.x, state.card.y] = CARD_STYLES[th.cardStyle].def;
    state.scene = pick(th.scenes);
    state.fortune = th;
  }

  function magicBurst() {
    const box = document.createElement('div');
    box.className = 'magic';
    const colors = ['#E8C5C8', '#F1E3B8', '#FFFFFF', '#C5D1C5', '#C2CFD8', '#E6D7C3'];
    let h = '<div class="glow"></div>';
    for (let i = 0; i < 22; i++) {
      const a = (i / 22) * Math.PI * 2 + Math.random() * .3, dist = 90 + Math.random() * 110, spark = i % 3 === 0;
      const style = `--dx:${Math.round(Math.cos(a) * dist)}px;--dy:${Math.round(Math.sin(a) * dist)}px;--r:${rint(-200, 200)}deg;--dl:${(Math.random() * .12).toFixed(2)}s`;
      h += `<span class="bp" style="${style}"><svg width="${spark ? 6 : 11}" height="${spark ? 6 : 11}" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.5" fill="${spark ? '#FFFFFF' : colors[i % colors.length]}" stroke="${INK}" stroke-width="1"/></svg></span>`;
    }
    box.innerHTML = h;
    canvasWrap.appendChild(box);
    setTimeout(() => box.remove(), 1000);
  }

  function showFortune(th) {
    $('#fortuneTitle').textContent = `${th.name} · ${th.en}`;
    $('#fortuneText').textContent = th.fortune;
    $('#fortune').classList.remove('hide');
  }
  const hideFortune = () => $('#fortune').classList.add('hide');
  $('#fortuneClose').onclick = hideFortune;
  // 抽花時已自動把短句寫進小卡，這裡直接帶去編輯
  $('#fortuneToCard').onclick = () => { hideFortune(); openCardText(); };

  async function drawLucky() {
    if (luckyBusy || state.finished) return;
    luckyBusy = true; $('#btnLucky').disabled = true;
    select(null); hideFortune();
    magicBurst();
    layerFlowers.querySelectorAll('.flip').forEach(el => el.classList.add('poof'));
    await wait(600);
    const th = pickTheme();
    generateLucky(th);
    renderWraps(); renderRibbon(); renderTag(); renderScene();
    state.tab = 'main'; state.activeMat = state.flowers[state.flowers.length - 1].type;
    renderFlowers(); renderWorkspace();
    setTimeout(() => { showFortune(th); luckyBusy = false; $('#btnLucky').disabled = false; }, 650);
  }
  $('#btnLucky').onclick = drawLucky;

  /* ================= 初始化 ================= */
  renderScene(); renderWraps(); renderRibbon(); renderTag(); renderFlowers(); renderWorkspace(); fit();
  bindTilt(canvasWrap, mainTilt); syncModeUI();
  if (document.fonts) document.fonts.ready.then(syncModeUI);
})();
</script>
